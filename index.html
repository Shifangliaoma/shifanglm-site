<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>十方料码 · 胆码趋势列表</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #0b0b15;
            color: #ddd;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #0b0b15;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ff6b3533;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(90deg, #ff6b35, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo i {
            font-size: 1.6rem;
            color: #ffd166;
            -webkit-text-fill-color: initial;
        }
        .nav-tag {
            background: rgba(255,107,53,0.2);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #ff6b3540;
            color: #ffb347;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 16px 12px;
        }
        /* 搜索栏 */
        .search-bar {
            background: rgba(20, 20, 35, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            padding: 8px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,107,53,0.3);
            position: sticky;
            top: 70px;
            z-index: 9;
        }
        .search-bar i {
            color: #ff8c5a;
            font-size: 1.1rem;
        }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            padding: 8px 0;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #777;
        }
        .clear-search {
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 6px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #aaa;
            font-size: 0.9rem;
            padding: 0 4px;
        }
        .info-row span i {
            color: #ff6b35;
            margin-right: 4px;
        }
        /* 列表区 */
        .trend-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* 每一期条目 — 极简分割线 */
        .trend-item {
            background: rgba(18, 18, 30, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.1s;
        }
        .trend-item:hover {
            border-color: rgba(255,107,53,0.2);
        }
        .item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .issue-draw {
            display: flex;
            align-items: baseline;
            gap: 15px;
            flex-wrap: wrap;
        }
        .issue {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffd166;
            letter-spacing: 0.5px;
        }
        .issue small {
            font-size: 0.8rem;
            color: #888;
            font-weight: 400;
            margin-left: 4px;
        }
        .draw {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4ecdc4;
            font-family: 'Courier New', monospace;
            background: rgba(78,205,196,0.1);
            padding: 2px 12px;
            border-radius: 40px;
            line-height: 1.3;
        }
        .action-group {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.1rem;
            padding: 6px 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn.edit:hover {
            background: rgba(255,107,53,0.2);
            color: #ff8c5a;
        }
        .action-btn.delete:hover {
            background: rgba(255,80,80,0.2);
            color: #ff5e5e;
        }
        /* 0-9 网格 — 一行10个，手机自适应 */
        .digit-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            margin: 6px 0 0;
        }
        .digit-cell {
            aspect-ratio: 1/1;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.15s;
        }
        .digit-cell.highlight {
            background: #ff8c5a;
            color: #111;
            border-color: #ffd166;
            box-shadow: 0 0 10px #ff6b35;
            font-weight: 800;
            transform: scale(1.02);
        }
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #555;
        }
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 12px;
            color: #333;
        }
        /* 底部 */
        footer {
            text-align: center;
            padding: 30px 16px 10px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,107,53,0.1);
            margin-top: 30px;
        }
        .brand-highlight {
            color: #ffb347;
        }
        /* 模态框 (保留原有风格) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #151525;
            border-radius: 28px;
            padding: 28px 24px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #ff6b35;
            box-shadow: 0 20px 40px #00000080;
        }
        .close-btn {
            float: right;
            font-size: 2rem;
            line-height: 1;
            color: #aaa;
            cursor: pointer;
        }
        .modal-title {
            font-size: 1.8rem;
            color: #ff6b35;
            margin-bottom: 25px;
            clear: both;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
        }
        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: #1e1e30;
            border: 1px solid #333;
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .form-control:focus {
            border-color: #ff6b35;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
        .btn-block {
            width: 100%;
            background: linear-gradient(145deg, #ff6b35, #ff4500);
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            color: white;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }
        /* 手机小屏优化 */
        @media (max-width: 420px) {
            .issue { font-size: 1.1rem; }
            .draw { font-size: 1.4rem; padding: 2px 8px; }
            .digit-cell { font-size: 0.85rem; border-radius: 8px; }
            .item-header { flex-direction: column; align-items: flex-start; }
            .action-group { align-self: flex-end; margin-top: -30px; } /* 微调 */
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-chart-line"></i>
            <span>十方胆码</span>
        </div>
        <div class="nav-tag"><i class="fas fa-dice-three"></i> 0-9网格</div>
    </nav>

    <div class="container">
        <!-- 搜索与信息栏 -->
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchIssue" placeholder="输入期号如 25613" inputmode="numeric">
            <span class="clear-search" id="clearSearch" style="display: none;">✕</span>
        </div>
        <div class="info-row">
            <span><i class="far fa-list-alt"></i> 最近30期 (最新在底部)</span>
            <span><i class="fas fa-sort-amount-down-alt"></i> 共 <span id="totalCount">0</span> 条</span>
        </div>

        <!-- 列表容器 -->
        <div id="trendListContainer" class="trend-list">
            <!-- 动态渲染 -->
        </div>
    </div>

    <!-- 新增/编辑模态框 -->
    <div class="modal" id="trendModal">
        <div class="modal-content">
            <span class="close-btn" id="modalClose">&times;</span>
            <h3 class="modal-title" id="modalTitle">添加期号</h3>
            <div class="form-group">
                <label class="form-label">期号 (5位数字)</label>
                <input type="text" id="issueInput" class="form-control" placeholder="如 25613" maxlength="5">
                <div class="error-message" id="issueError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">开奖号码 (3位数字)</label>
                <input type="text" id="drawInput" class="form-control" placeholder="如 256" maxlength="3">
                <div class="error-message" id="drawError"></div>
            </div>
            <input type="hidden" id="editingId" value="">
            <button class="btn-block" id="saveTrendBtn"><i class="fas fa-save"></i> 保存记录</button>
        </div>
    </div>

    <footer>
        <p><span class="brand-highlight">十方料码 · 胆码趋势</span> 期号/奖号可编辑，网格自动标记</p>
        <p style="margin-top: 6px;">最新期数在底部 · 搜索即过滤</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        (function() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 40, density: { enable: true } },
                    color: { value: "#ff6b35" },
                    shape: { type: "circle" },
                    opacity: { value: 0.3, random: true },
                    size: { value: 2.5, random: true },
                    move: { enable: true, speed: 0.8 }
                }
            });

            // ---------- 数据 ----------
            let trends = [];               // 全部数据，按期号升序（旧→新）
            let filterText = '';           // 当前搜索词

            // 加载初始数据
            function loadFromStorage() {
                const stored = localStorage.getItem('shifang_trends_v2');
                if (stored) {
                    try { trends = JSON.parse(stored); } catch { trends = []; }
                }
                if (!trends.length) {
                    // 示例数据 (按期号升序：旧在上，新在下)
                    trends = [
                        { id: '1', issue: '25601', drawNumber: '425' },
                        { id: '2', issue: '25602', drawNumber: '789' },
                        { id: '3', issue: '25603', drawNumber: '014' },
                        { id: '4', issue: '25604', drawNumber: '333' },
                        { id: '5', issue: '25605', drawNumber: '256' },
                        { id: '6', issue: '25606', drawNumber: '107' },
                        { id: '7', issue: '25607', drawNumber: '888' },
                        { id: '8', issue: '25608', drawNumber: '692' },
                        { id: '9', issue: '25609', drawNumber: '555' },
                        { id: '10', issue: '25610', drawNumber: '123' },
                        { id: '11', issue: '25611', drawNumber: '999' },
                        { id: '12', issue: '25612', drawNumber: '777' },
                        { id: '13', issue: '25613', drawNumber: '256' },
                        { id: '14', issue: '25614', drawNumber: '321' },
                        { id: '15', issue: '25615', drawNumber: '468' },
                        { id: '16', issue: '25616', drawNumber: '111' },
                        { id: '17', issue: '25617', drawNumber: '222' },
                        { id: '18', issue: '25618', drawNumber: '333' },
                        { id: '19', issue: '25619', drawNumber: '444' },
                        { id: '20', issue: '25620', drawNumber: '555' },
                        { id: '21', issue: '25621', drawNumber: '666' },
                        { id: '22', issue: '25622', drawNumber: '777' },
                        { id: '23', issue: '25623', drawNumber: '888' },
                        { id: '24', issue: '25624', drawNumber: '999' },
                        { id: '25', issue: '25625', drawNumber: '000' },
                        { id: '26', issue: '25626', drawNumber: '135' },
                        { id: '27', issue: '25627', drawNumber: '579' },
                        { id: '28', issue: '25628', drawNumber: '246' },
                        { id: '29', issue: '25629', drawNumber: '802' },
                        { id: '30', issue: '25630', drawNumber: '413' },
                        { id: '31', issue: '25631', drawNumber: '725' },
                        { id: '32', issue: '25632', drawNumber: '690' }
                    ];
                }
                // 确保按期号升序 (旧→新)
                trends.sort((a, b) => parseInt(a.issue) - parseInt(b.issue));
                saveToStorage();
            }

            function saveToStorage() {
                localStorage.setItem('shifang_trends_v2', JSON.stringify(trends));
            }

            // ---------- 渲染列表 ----------
            function renderTrends() {
                const container = document.getElementById('trendListContainer');
                const totalSpan = document.getElementById('totalCount');
                if (!container) return;

                // 过滤
                let filtered = trends;
                if (filterText.trim() !== '') {
                    filtered = trends.filter(t => t.issue.includes(filterText.trim()));
                }

                // 默认显示最近30条 (最新在底部，即升序数组的最后30项)
                let displayList = filtered;
                if (filterText.trim() === '') {
                    // 取最后30项 (最近30期)
                    displayList = filtered.slice(-30);
                }

                totalSpan.innerText = filtered.length;

                if (displayList.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="far fa-frown"></i><p>没有匹配的期号</p></div>`;
                    return;
                }

                let html = '';
                displayList.forEach(item => {
                    const draw = item.drawNumber.padEnd(3, ' ').substring(0, 3);
                    // 生成网格
                    let gridCells = '';
                    for (let d = 0; d <= 9; d++) {
                        const isHighlight = item.drawNumber.includes(d.toString());
                        gridCells += `<div class="digit-cell ${isHighlight ? 'highlight' : ''}">${d}</div>`;
                    }

                    html += `
                        <div class="trend-item" data-id="${item.id}">
                            <div class="item-header">
                                <div class="issue-draw">
                                    <span class="issue">${item.issue}<small>期</small></span>
                                    <span class="draw">${draw}</span>
                                </div>
                                <div class="action-group">
                                    <button class="action-btn edit" data-id="${item.id}" title="编辑"><i class="fas fa-pen"></i></button>
                                    <button class="action-btn delete" data-id="${item.id}" title="删除"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                            <div class="digit-grid">
                                ${gridCells}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                // 绑定编辑/删除
                document.querySelectorAll('.edit').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.getAttribute('data-id');
                        openEditModal(id);
                    });
                });
                document.querySelectorAll('.delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.getAttribute('data-id');
                        deleteTrend(id);
                    });
                });
            }

            // ---------- 模态框逻辑 ----------
            function openAddModal() {
                document.getElementById('modalTitle').innerText = '添加期号';
                document.getElementById('issueInput').value = '';
                document.getElementById('drawInput').value = '';
                document.getElementById('editingId').value = '';
                clearErrors();
                document.getElementById('trendModal').style.display = 'flex';
            }

            function openEditModal(id) {
                const trend = trends.find(t => t.id === id);
                if (!trend) return;
                document.getElementById('modalTitle').innerText = '编辑期号';
                document.getElementById('issueInput').value = trend.issue;
                document.getElementById('drawInput').value = trend.drawNumber;
                document.getElementById('editingId').value = id;
                clearErrors();
                document.getElementById('trendModal').style.display = 'flex';
            }

            function clearErrors() {
                document.getElementById('issueError').style.display = 'none';
                document.getElementById('drawError').style.display = 'none';
            }

            function showError(elId, msg) {
                const el = document.getElementById(elId);
                el.innerText = msg;
                el.style.display = 'block';
            }

            function saveTrend() {
                const issue = document.getElementById('issueInput').value.trim();
                const draw = document.getElementById('drawInput').value.trim();
                const editingId = document.getElementById('editingId').value;

                clearErrors();

                if (!/^\d{5}$/.test(issue)) {
                    showError('issueError', '期号必须为5位数字');
                    return;
                }
                if (!/^\d{3}$/.test(draw)) {
                    showError('drawError', '开奖号码必须为3位数字');
                    return;
                }

                if (editingId) {
                    const index = trends.findIndex(t => t.id === editingId);
                    if (index !== -1) {
                        trends[index].issue = issue;
                        trends[index].drawNumber = draw;
                    }
                } else {
                    const newId = Date.now() + '-' + Math.random().toString(36).substr(2, 6);
                    trends.push({ id: newId, issue, drawNumber: draw });
                }

                // 保持升序
                trends.sort((a, b) => parseInt(a.issue) - parseInt(b.issue));
                saveToStorage();
                renderTrends();
                document.getElementById('trendModal').style.display = 'none';
            }

            function deleteTrend(id) {
                if (!confirm('确定删除该期记录？')) return;
                trends = trends.filter(t => t.id !== id);
                saveToStorage();
                renderTrends();
            }

            // 搜索功能
            const searchInput = document.getElementById('searchIssue');
            const clearBtn = document.getElementById('clearSearch');

            searchInput.addEventListener('input', function() {
                filterText = this.value.replace(/\D/g, ''); // 只留数字
                this.value = filterText; // 回显
                clearBtn.style.display = filterText ? 'inline' : 'none';
                renderTrends();
            });

            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                filterText = '';
                clearBtn.style.display = 'none';
                renderTrends();
            });

            // 初始化
            loadFromStorage();
            renderTrends();

            // 事件绑定
            document.getElementById('addTrendBtn')?.addEventListener('click', openAddModal); // 我们可能需要添加一个浮动按钮？但原需求没有明确新增按钮，不过我们可以加一个悬浮加号，但现有界面顶部有搜索栏，可以考虑在右上角加一个新增图标。为了保留功能，我们在info-row右侧加一个按钮。
            // 在info-row中加入添加按钮更合理
            const infoRow = document.querySelector('.info-row');
            if (infoRow) {
                const addBtn = document.createElement('span');
                addBtn.innerHTML = '<i class="fas fa-plus-circle" style="color:#ff8c5a; font-size:1.4rem; cursor:pointer;"></i>';
                addBtn.style.marginLeft = 'auto';
                addBtn.addEventListener('click', openAddModal);
                infoRow.appendChild(addBtn);
            }

            // 模态框关闭
            document.getElementById('modalClose').addEventListener('click', () => {
                document.getElementById('trendModal').style.display = 'none';
            });
            window.addEventListener('click', (e) => {
                const modal = document.getElementById('trendModal');
                if (e.target === modal) modal.style.display = 'none';
            });

            // 保存按钮
            document.getElementById('saveTrendBtn').addEventListener('click', saveTrend);

            // 限制数字输入
            document.getElementById('issueInput').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });
            document.getElementById('drawInput').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });
        })();
    </script>
</body>
</html>
