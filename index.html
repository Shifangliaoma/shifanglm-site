<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十方料码 - 会员登录</title>
    <!-- 替换为国内CDN的AppWrite SDK -->
    <script src="https://cdn.staticfile.org/appwrite/11.0.0/appwrite.min.js"></script>
    <style>
        .login-box {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>会员登录</h2>
        <input type="email" id="email" placeholder="请输入邮箱" required>
        <input type="password" id="password" placeholder="请输入密码" required>
        <button onclick="login()">登录</button>
        <p id="result"></p>
    </div>

    <script>
        // 初始化AppWrite（已填入你的参数）
        const client = new AppWrite.Client();
        client
            .setEndpoint('https://cloud.appwrite.io/v1') // 你的API Endpoint
            .setProject('6929b5bb003d77ecd385'); // 你的Project ID

        const account = new AppWrite.Account(client);
        const resultDom = document.getElementById('result');

        // 登录函数
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                // 创建登录会话
                const session = await account.createEmailSession(email, password);
                resultDom.style.color = 'green';
                resultDom.innerText = '登录成功！Session ID：' + session.$id;
            } catch (error) {
                resultDom.style.color = 'red';
                resultDom.innerText = '登录失败：' + error.message;
            }
        }
    </script>
</body>
</html>
