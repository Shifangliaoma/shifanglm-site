<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十方料码 · 福彩3D胆码趋势分布</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b35;
            --secondary: #4ecdc4;
            --accent: #ffd166;
            --dark: #1a1a2e;
            --darker: #0f0f1a;
            --card-bg: rgba(25, 25, 45, 0.8);
            --text-light: #f0f0f0;
            --grid-highlight: #ff8c5a;
            --grid-bg: rgba(255, 255, 255, 0.05);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--darker), #1a1a3a);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 107, 53, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo i {
            font-size: 2rem;
            background: none;
            -webkit-text-fill-color: initial;
            color: var(--accent);
        }
        
        .nav-tag {
            color: #ccc;
            font-size: 1.1rem;
            padding: 8px 20px;
            background: rgba(255,107,53,0.15);
            border-radius: 30px;
            border: 1px solid rgba(255,107,53,0.3);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            transition: 0.2s;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .card-title {
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        
        .btn-primary {
            background: linear-gradient(145deg, var(--primary), #ff4500);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }
        
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        
        .btn-outline:hover {
            background: rgba(255, 107, 53, 0.1);
            transform: translateY(-2px);
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        
        .trend-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .trend-item {
            background: rgba(20, 20, 40, 0.6);
            border-radius: 18px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }
        
        .trend-item:hover {
            border-color: rgba(255, 107, 53, 0.3);
            background: rgba(30, 30, 50, 0.7);
        }
        
        .trend-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .issue-block, .draw-block {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .issue-label, .draw-label {
            color: #aaa;
            font-weight: 400;
            font-size: 0.9rem;
        }
        
        .issue-value, .draw-value {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--accent);
            letter-spacing: 1px;
        }
        
        .draw-value {
            color: var(--secondary);
            font-family: 'Courier New', monospace;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .digit-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            margin-top: 5px;
        }
        
        .digit-cell {
            aspect-ratio: 1 / 1;
            background: var(--grid-bg);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #ddd;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.15s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .digit-cell.highlight {
            background: var(--grid-highlight);
            color: #111;
            border-color: var(--accent);
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(255, 107, 53, 0.6);
            font-weight: 800;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #888;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 15px;
            color: #555;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255,107,53,0.3);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            color: #aaa;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }
        
        .close-btn:hover {
            color: var(--primary);
        }
        
        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--primary);
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 22px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
            transition: 0.2s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255,107,53,0.1);
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
            padding-left: 10px;
        }
        
        .btn-block {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 1.1rem;
        }
        
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #666;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 40px;
            background: rgba(15, 15, 30, 0.5);
        }
        
        .brand-highlight {
            color: var(--accent);
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .trend-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .action-buttons {
                align-self: flex-end;
            }
            .digit-cell {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div id="particles-js"></div>
    
    <!-- 导航栏 (简约风格) -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-chart-pie"></i>
            <span>十方料码 · 胆码趋势</span>
        </div>
        <div class="nav-tag">
            <i class="fas fa-dice"></i> 福彩3D 0-9网格
        </div>
    </nav>
    
    <!-- 主内容区：胆码趋势分布 -->
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-table"></i> 期号·奖号·胆码趋势
                </h2>
                <button class="btn btn-primary" id="addTrendBtn">
                    <i class="fas fa-plus-circle"></i> 新增期号
                </button>
            </div>
            
            <!-- 趋势列表容器 -->
            <div id="trendListContainer" class="trend-list">
                <!-- 动态由JS渲染 -->
                <div class="loading" id="trendLoading" style="display: none;">
                    <div class="spinner"></div>
                    <p>加载数据中...</p>
                </div>
            </div>
            
            <!-- 提示信息 -->
            <div style="margin-top: 25px; padding: 15px; background: rgba(255, 209, 102, 0.08); border-radius: 16px; border-left: 4px solid var(--accent);">
                <p style="color: var(--accent); display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-info-circle"></i> 胆码网格根据开奖号码自动高亮。点击编辑按钮可修改期号与奖号。
                </p>
            </div>
        </div>
    </div>
    
    <!-- 新增/编辑 模态框 (复用原上传模态框结构但改造) -->
    <div class="modal" id="trendModal">
        <div class="modal-content">
            <span class="close-btn" id="modalClose">&times;</span>
            <h3 class="modal-title" id="modalTitle">添加期号</h3>
            
            <div class="form-group">
                <label class="form-label">期号 <span style="color:#aaa;">(5位数字，例：25613)</span></label>
                <input type="text" id="issueInput" class="form-control" placeholder="如 25613" maxlength="5" inputmode="numeric">
                <div class="error-message" id="issueError"></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">开奖号码 <span style="color:#aaa;">(3位数字，例：256)</span></label>
                <input type="text" id="drawInput" class="form-control" placeholder="如 256" maxlength="3" inputmode="numeric">
                <div class="error-message" id="drawError"></div>
            </div>
            
            <input type="hidden" id="editingId" value="">
            <button class="btn btn-primary btn-block" id="saveTrendBtn">
                <i class="fas fa-save"></i> 保存胆码记录
            </button>
        </div>
    </div>
    
    <footer>
        <p><span class="brand-highlight">十方料码</span> · 福彩3D胆码趋势分布 · 0-9网格动态标记</p>
        <p style="margin-top: 8px; font-size: 0.85rem;">数据仅供技术交流 · 期号与开奖号可编辑 · 高亮自动更新</p>
    </footer>

    <!-- 粒子库 -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
        (function() {
            // 粒子背景初始化
            particlesJS('particles-js', {
                particles: {
                    number: { value: 50, density: { enable: true, value_area: 800 } },
                    color: { value: "#ff6b35" },
                    shape: { type: "circle" },
                    opacity: { value: 0.4, random: true },
                    size: { value: 2.5, random: true },
                    move: {
                        enable: true,
                        speed: 1,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                }
            });

            // ---------- 数据模型 ----------
            let trends = [];  // 每个对象 { id, issue, drawNumber }

            // 加载本地数据
            function loadFromStorage() {
                const stored = localStorage.getItem('shifang_trends');
                if (stored) {
                    try {
                        trends = JSON.parse(stored);
                    } catch (e) {
                        trends = [];
                    }
                } else {
                    // 初始化示例数据 (符合示例格式)
                    trends = [
                        { id: '1', issue: '25613', drawNumber: '256' },
                        { id: '2', issue: '25612', drawNumber: '789' },
                        { id: '3', issue: '25611', drawNumber: '014' },
                        { id: '4', issue: '25610', drawNumber: '333' }
                    ];
                }
                // 按期号倒序 (最新在前)
                trends.sort((a, b) => parseInt(b.issue) - parseInt(a.issue));
                saveToStorage();
            }

            function saveToStorage() {
                localStorage.setItem('shifang_trends', JSON.stringify(trends));
            }

            // ---------- 渲染趋势列表 ----------
            function renderTrends() {
                const container = document.getElementById('trendListContainer');
                if (!container) return;

                if (trends.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-chart-bar"></i>
                            <h3>暂无胆码记录</h3>
                            <p>点击“新增期号”开始添加</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                trends.forEach(item => {
                    // 格式化显示
                    const issueShow = item.issue + '期';
                    const draw = item.drawNumber.padEnd(3, ' ').substring(0, 3); // 确保三位

                    // 生成0-9网格，并标记高亮
                    let gridCells = '';
                    for (let digit = 0; digit <= 9; digit++) {
                        const digitStr = digit.toString();
                        // 检查是否在开奖号码中 (drawNumber 是字符串如 "256")
                        const isHighlight = item.drawNumber && item.drawNumber.includes(digitStr);
                        const highlightClass = isHighlight ? 'highlight' : '';
                        gridCells += `<div class="digit-cell ${highlightClass}">${digit}</div>`;
                    }

                    html += `
                        <div class="trend-item" data-id="${item.id}">
                            <div class="trend-header">
                                <div style="display: flex; flex-wrap: wrap; gap: 12px;">
                                    <div class="issue-block">
                                        <span class="issue-label"><i class="far fa-calendar-alt"></i> 期号</span>
                                        <span class="issue-value">${issueShow}</span>
                                    </div>
                                    <div class="draw-block">
                                        <span class="draw-label"><i class="fas fa-dice-d6"></i> 奖号</span>
                                        <span class="draw-value">${draw}</span>
                                    </div>
                                </div>
                                <div class="action-buttons">
                                    <button class="btn btn-sm btn-outline edit-trend" title="编辑" data-id="${item.id}">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline delete-trend" title="删除" data-id="${item.id}" style="border-color:#ff8888; color:#ff8888;">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="digit-grid">
                                ${gridCells}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                // 绑定编辑和删除事件 (通过事件代理更佳，但为清晰直接绑定)
                document.querySelectorAll('.edit-trend').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.getAttribute('data-id');
                        openEditModal(id);
                    });
                });

                document.querySelectorAll('.delete-trend').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.getAttribute('data-id');
                        deleteTrend(id);
                    });
                });
            }

            // ---------- 打开新增模态框 ----------
            function openAddModal() {
                document.getElementById('modalTitle').innerText = '添加期号';
                document.getElementById('issueInput').value = '';
                document.getElementById('drawInput').value = '';
                document.getElementById('editingId').value = '';
                clearErrors();
                document.getElementById('trendModal').style.display = 'flex';
            }

            // 打开编辑模态框
            function openEditModal(id) {
                const trend = trends.find(t => t.id === id);
                if (!trend) return;
                document.getElementById('modalTitle').innerText = '编辑期号';
                document.getElementById('issueInput').value = trend.issue;
                document.getElementById('drawInput').value = trend.drawNumber;
                document.getElementById('editingId').value = id;
                clearErrors();
                document.getElementById('trendModal').style.display = 'flex';
            }

            // 清除错误信息
            function clearErrors() {
                document.getElementById('issueError').style.display = 'none';
                document.getElementById('drawError').style.display = 'none';
            }

            // 显示错误
            function showError(elementId, msg) {
                const el = document.getElementById(elementId);
                el.innerText = msg;
                el.style.display = 'block';
            }

            // 验证并保存
            function saveTrend() {
                const issue = document.getElementById('issueInput').value.trim();
                const draw = document.getElementById('drawInput').value.trim();
                const editingId = document.getElementById('editingId').value;

                clearErrors();

                // 验证期号: 5位数字
                const issueValid = /^\d{5}$/.test(issue);
                if (!issueValid) {
                    showError('issueError', '期号必须为5位数字 (例如 25613)');
                    return;
                }
                // 验证开奖号码: 3位数字
                const drawValid = /^\d{3}$/.test(draw);
                if (!drawValid) {
                    showError('drawError', '开奖号码必须为3位数字 (例如 256)');
                    return;
                }

                if (editingId) {
                    // 编辑更新
                    const index = trends.findIndex(t => t.id === editingId);
                    if (index !== -1) {
                        trends[index].issue = issue;
                        trends[index].drawNumber = draw;
                    }
                } else {
                    // 新增: 生成新id (时间戳 + 随机)
                    const newId = Date.now() + '-' + Math.random().toString(36).substr(2, 6);
                    trends.push({ id: newId, issue: issue, drawNumber: draw });
                }

                // 重新按期号排序
                trends.sort((a, b) => parseInt(b.issue) - parseInt(a.issue));
                saveToStorage();
                renderTrends();

                // 关闭模态框
                document.getElementById('trendModal').style.display = 'none';
            }

            // 删除
            function deleteTrend(id) {
                if (!confirm('确定要删除这条胆码记录吗？')) return;
                trends = trends.filter(t => t.id !== id);
                saveToStorage();
                renderTrends();
            }

            // 初始化事件监听
            function init() {
                // 加载数据
                loadFromStorage();
                renderTrends();

                // 新增按钮
                document.getElementById('addTrendBtn').addEventListener('click', openAddModal);

                // 保存按钮
                document.getElementById('saveTrendBtn').addEventListener('click', saveTrend);

                // 关闭模态框 (X 和 点击外部)
                document.getElementById('modalClose').addEventListener('click', () => {
                    document.getElementById('trendModal').style.display = 'none';
                });
                window.addEventListener('click', (e) => {
                    const modal = document.getElementById('trendModal');
                    if (e.target === modal) {
                        modal.style.display = 'none';
                    }
                });

                // 输入框限制只能输入数字
                const issueInput = document.getElementById('issueInput');
                const drawInput = document.getElementById('drawInput');
                [issueInput, drawInput].forEach(inp => {
                    inp.addEventListener('input', function() {
                        this.value = this.value.replace(/\D/g, '');
                    });
                });
            }

            // 启动
            init();
        })();
    </script>
</body>
</html>
