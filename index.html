<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十方料码论坛 - 黑科技霓虹风</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #b300ff;
            --neon-pink: #ff00cc;
            --neon-green: #00ff9d;
            --dark-bg: #0a0a14;
            --darker-bg: #05050c;
            --card-bg: rgba(15, 15, 30, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --accent: #4d00ff;
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.7);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(77, 0, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 20%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        /* 头部样式 */
        header {
            background: var(--darker-bg);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
        }
        
        .logo {
            display: flex;
            align-items: center;
        }
        
        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            margin-right: 12px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }
        
        .logo-text h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        
        .logo-text p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        /* 导航栏 */
        .navbar {
            display: flex;
            align-items: center;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            margin-right: 20px;
        }
        
        .nav-links li {
            margin-left: 20px;
        }
        
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 6px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-links a:hover, .nav-links a.active {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--neon-blue);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        
        .nav-links a:hover::after, .nav-links a.active::after {
            width: 80%;
            box-shadow: 0 0 8px var(--neon-blue);
        }
        
        /* 用户控制 */
        .user-controls {
            display: flex;
            align-items: center;
        }
        
        .search-box {
            position: relative;
            margin-right: 15px;
        }
        
        .search-box input {
            padding: 10px 15px 10px 40px;
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            font-size: 0.9rem;
            width: 220px;
            transition: all 0.3s ease;
            color: var(--text-primary);
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        
        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 0.9rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: white;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        
        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.7);
            transform: translateY(-2px);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
        }
        
        .btn-outline:hover {
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        
        /* 主要内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            margin: 25px 0;
        }
        
        /* 侧边栏 */
        .sidebar {
            position: sticky;
            top: 80px;
            height: fit-content;
        }
        
        .sidebar-card {
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        
        .sidebar-card:hover {
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border-color: rgba(0, 243, 255, 0.4);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        }
        
        .card-header i {
            color: var(--neon-blue);
            margin-right: 8px;
            font-size: 1.1rem;
            text-shadow: 0 0 8px var(--neon-blue);
        }
        
        .card-header h3 {
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        
        /* 分类列表 */
        .category-list {
            list-style: none;
        }
        
        .category-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .category-item:last-child {
            border-bottom: none;
        }
        
        .category-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .category-link:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }
        
        .category-name {
            flex: 1;
        }
        
        .category-count {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-blue);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
        }
        
        /* 论坛内容 */
        .forum-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 帖子列表 */
        .posts-section {
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            background: rgba(10, 10, 20, 0.5);
        }
        
        .section-title {
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            color: var(--neon-blue);
            margin-right: 10px;
            font-size: 1.2rem;
            text-shadow: 0 0 8px var(--neon-blue);
        }
        
        .section-title h2 {
            font-size: 1.3rem;
            color: var(--text-primary);
        }
        
        .filter-options {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .filter-btn {
            padding: 8px 15px;
            border-radius: 6px;
            background: rgba(10, 10, 20, 0.7);
            color: var(--text-secondary);
            border: 1px solid rgba(0, 243, 255, 0.2);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-blue);
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }
        
        .posts-list {
            list-style: none;
        }
        
        .post-item {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .post-item:hover {
            background: rgba(0, 243, 255, 0.05);
        }
        
        .post-item:last-child {
            border-bottom: none;
        }
        
        .post-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            margin-right: 12px;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        
        .post-info {
            flex: 1;
        }
        
        .post-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
            text-decoration: none;
            display: block;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .post-title:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }
        
        .post-meta {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        .post-meta span {
            margin-right: 15px;
            display: flex;
            align-items: center;
        }
        
        .post-meta i {
            margin-right: 5px;
            font-size: 0.8rem;
        }
        
        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        
        .tag {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-blue);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }
        
        .tag.primary {
            background: rgba(179, 0, 255, 0.1);
            color: var(--neon-purple);
            border-color: rgba(179, 0, 255, 0.2);
        }
        
        .post-stats {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .post-stat {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .post-stat i {
            margin-right: 5px;
        }
        
        .post-stat.liked {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }
        
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 12, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--card-bg);
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 20, 0.5);
        }
        
        .modal-header h3 {
            font-size: 1.2rem;
            color: var(--text-primary);
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-modal:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: var(--text-primary);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }
        
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }
        
        .form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        /* 编辑器工具栏 */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(10, 10, 20, 0.5);
            border-radius: 6px;
        }
        
        .editor-btn {
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: var(--text-secondary);
        }
        
        .editor-btn:hover {
            background: var(--neon-blue);
            color: white;
            box-shadow: 0 0 10px var(--neon-blue);
        }
        
        .editor-content {
            min-height: 200px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 6px;
            padding: 10px;
            background: rgba(10, 10, 20, 0.7);
            color: var(--text-primary);
        }
        
        /* 页脚样式 */
        footer {
            background: var(--darker-bg);
            color: var(--text-secondary);
            padding: 40px 0 20px;
            margin-top: 50px;
            border-top: 1px solid rgba(0, 243, 255, 0.2);
        }
        
        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .footer-column h4 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 10px;
            color: var(--text-primary);
        }
        
        .footer-column h4::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 30px;
            height: 2px;
            background: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue);
        }
        
        .footer-links {
            list-style: none;
        }
        
        .footer-links li {
            margin-bottom: 10px;
        }
        
        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .footer-links a:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }
        
        .copyright {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 992px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: static;
            }
        }
        
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .navbar {
                width: 100%;
                justify-content: space-between;
                margin-top: 15px;
            }
            
            .nav-links {
                margin-right: 0;
            }
            
            .user-controls {
                margin-top: 15px;
                width: 100%;
                justify-content: space-between;
            }
            
            .search-box {
                flex: 1;
                margin-right: 10px;
            }
            
            .search-box input {
                width: 100%;
            }
            
            .post-header {
                flex-direction: column;
            }
            
            .user-avatar {
                margin-bottom: 10px;
            }
            
            .post-stats {
                margin-top: 10px;
                justify-content: flex-start;
            }
            
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .filter-options {
                margin-top: 10px;
            }
        }
        
        @media (max-width: 576px) {
            .nav-links {
                display: none;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        /* 隐藏元素 */
        .hidden {
            display: none;
        }
        
        /* 霓虹文字效果 */
        .neon-text {
            text-shadow: 0 0 10px currentColor;
        }
        
        /* 数据流背景效果 */
        .data-stream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.1;
        }
        
        .stream {
            position: absolute;
            width: 2px;
            height: 100px;
            background: var(--neon-blue);
            opacity: 0.5;
            animation: streamFall linear infinite;
        }
        
        @keyframes streamFall {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 数据流背景 -->
    <div class="data-stream" id="dataStream"></div>
    
    <!-- 头部 -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-dice-d20"></i>
                    </div>
                    <div class="logo-text">
                        <h1>十方料码论坛</h1>
                        <p>黑科技预测社区</p>
                    </div>
                </div>
                
                <div class="navbar">
                    <ul class="nav-links">
                        <li><a href="#" class="active" id="navHome">首页</a></li>
                        <li><a href="#" id="navTrends">走势分析</a></li>
                        <li><a href="#" id="navTools">预测工具</a></li>
                        <li><a href="#" id="navRank">排行榜</a></li>
                    </ul>
                    
                    <div class="user-controls">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" placeholder="搜索帖子..." id="searchInput">
                        </div>
                        <button class="btn btn-outline" id="loginBtn">登录</button>
                        <button class="btn btn-primary" id="registerBtn">注册</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- 首页内容 -->
        <div id="homePage">
            <div class="main-content">
                <!-- 侧边栏 -->
                <div class="sidebar">
                    <div class="sidebar-card">
                        <div class="card-header">
                            <i class="fas fa-list"></i>
                            <h3>论坛分类</h3>
                        </div>
                        <ul class="category-list" id="categoryList">
                            <!-- 分类将通过JavaScript动态加载 -->
                        </ul>
                    </div>
                    
                    <div class="sidebar-card">
                        <div class="card-header">
                            <i class="fas fa-chart-line"></i>
                            <h3>热门标签</h3>
                        </div>
                        <div class="post-tags" style="margin-top: 0;" id="hotTags">
                            <!-- 热门标签将通过JavaScript动态加载 -->
                        </div>
                    </div>
                    
                    <div class="sidebar-card">
                        <div class="card-header">
                            <i class="fas fa-fire"></i>
                            <h3>今日热点</h3>
                        </div>
                        <div class="hot-posts">
                            <div class="hot-post-item">
                                <div class="hot-post-title">福彩3D走势分析：重点关注6、8、9</div>
                                <div class="hot-post-meta">浏览 342 | 回复 28</div>
                            </div>
                            <div class="hot-post-item">
                                <div class="hot-post-title">排列三胆码预测：3、5、7有望开出</div>
                                <div class="hot-post-meta">浏览 298 | 回复 19</div>
                            </div>
                        </div>

                        <option value="福彩3D交流">福彩3D交流</option>
                        <option value="排列三交流">排列三交流</option>

                    <input type="text" class="form-control" id="postTagsInput" placeholder="例如: 福彩3D, 胆码, 预测">
                </div>

    <script>
        // 论坛数据管理
        const ForumManager = {
            // 初始化数据
            init() {
                // 检查本地存储中是否有数据
                if (!localStorage.getItem('forumUsers')) {
                    // 初始化默认用户
                    const defaultUsers = [
                        { id: 1, username: 'admin', email: 'admin@shifang.com', password: 'admin123', role: 'admin' },
                        { id: 2, username: '十方料码', email: 'user@shifang.com', password: 'user123', role: 'user' }
                    ];
                    localStorage.setItem('forumUsers', JSON.stringify(defaultUsers));
                }
                
                if (!localStorage.getItem('forumPosts')) {
                    // 初始化默认帖子
                    const defaultPosts = [
                        {
                            id: 1,
                            title: '今日福彩3D胆码分析：重点关注3、6、9',
                            content: '<p>根据近期走势分析，今天福彩3D的胆码建议重点关注3、6、9这三个数字。</p><p><strong>理由：</strong></p><ul><li>3号已经连续5期未出</li><li>6号在十位有较强回补趋势</li><li>9号在个位有热出迹象</li></ul><p>建议大家结合自己的判断进行投注！</p>',
                            category: '福彩3D交流',
                            tags: ['福彩3D', '胆码', '分析'],
                            author: '十方料码',
                            authorId: 2,
                            date: new Date('2024-01-15').toISOString(),
                            views: 142,
                            likes: 28,
                            replies: 12,
                            isSticky: true,
                            isEssence: true
                        },
                        {
                            id: 2,
                            title: '排列三组选复式投注技巧分享',
                            content: '<p>今天和大家分享一下排列三组选复式的投注技巧。</p><p><u>重点提示：</u>在选择复式号码时，要注意冷热号的搭配，不要全部选择热号或冷号。</p><p>建议选择2个热号+1个温号+1个冷号的组合方式，这样中奖概率会更高。</p>',
                            category: '排列三交流',
                            tags: ['排列三', '复式', '技巧'],
                            author: 'admin',
                            authorId: 1,
                            date: new Date('2024-01-14').toISOString(),
                            views: 98,
                            likes: 15,
                            replies: 7,
                            isSticky: false,
                            isEssence: true
                        },
                        {
                            id: 3,
                            title: '双飞组合分析：05、16、27值得关注',
                            content: '<p>本期双飞组合分析，05、16、27这三个组合值得重点关注。</p><p><strong>分析依据：</strong></p><ol><li>05组合已经间隔15期未出</li><li>16组合在近30期内出现频率较高</li><li>27组合有较强的互补性</li></ol><p>以上仅为个人观点，仅供参考！</p>',
                            category: '双飞分析',
                            tags: ['双飞', '组合', '分析'],
                            author: '十方料码',
                            authorId: 2,
                            date: new Date('2024-01-13').toISOString(),
                            views: 76,
                            likes: 12,
                            replies: 5,
                            isSticky: false,
                            isEssence: false
                        }
                    ];
                    localStorage.setItem('forumPosts', JSON.stringify(defaultPosts));
                }
                
                // 初始化分类和标签
                this.initCategoriesAndTags();
                // 加载帖子列表
                this.loadPosts();
                // 初始化事件
                this.initEvents();
                // 初始化数据流背景
                this.initDataStream();
            },
            
            // 初始化分类和标签
            initCategoriesAndTags() {
                const categories = [
                    { name: '福彩3D交流', count: 24 },
                    { name: '排列三交流', count: 18 },
                    { name: '胆码分析', count: 32 },
                    { name: '复式分析', count: 15 },
                    { name: '双飞分析', count: 21 }
                ];
                
                const categoryList = document.getElementById('categoryList');
                let categoryHTML = '';
                
                categories.forEach(cat => {
                    categoryHTML += `
                        <li class="category-item">
                            <a href="#" class="category-link" data-category="${cat.name}">
                                <span class="category-name">${cat.name}</span>
                                <span class="category-count">${cat.count}</span>
                            </a>
                        </li>
                    `;
                });
                
                categoryList.innerHTML = categoryHTML;
                
                // 热门标签
                const hotTags = document.getElementById('hotTags');
                const tags = ['福彩3D', '排列三', '胆码', '复式', '双飞', '预测', '走势', '分析'];
                let tagsHTML = '';
                
                tags.forEach(tag => {
                    tagsHTML += `<span class="tag">${tag}</span>`;
                });
                
                hotTags.innerHTML = tagsHTML;
            },
            
            // 获取所有帖子
            getPosts() {
                return JSON.parse(localStorage.getItem('forumPosts') || '[]');
            },
            
            // 加载帖子列表
            loadPosts(filter = 'latest') {
                let posts = this.getPosts();
                
                // 应用筛选
                if (filter === 'hot') {
                    posts = posts.sort((a, b) => b.views - a.views);
                } else if (filter === 'essence') {
                    posts = posts.filter(post => post.isEssence);
                } else {
                    // 最新帖子
                    posts = posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                }
                
                const postsList = document.getElementById('postsList');
                
                if (posts.length === 0) {
                    postsList.innerHTML = `
                        <li class="post-item">
                            <div style="text-align: center; padding: 40px 20px; color: var(--text-secondary);">
                                <i class="fas fa-inbox" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.5;"></i>
                                <p>暂无帖子，快来发布第一个帖子吧！</p>
                            </div>
                        </li>
                    `;
                    return;
                }
                
                let postsHTML = '';
                posts.forEach(post => {
                    const postDate = new Date(post.date);
                    const timeAgo = this.getTimeAgo(postDate);
                    
                    postsHTML += `
                        <li class="post-item">
                            <div class="post-header">
                                <div class="user-avatar">
                                    ${post.author.substring(0, 1)}
                                </div>
                                <div class="post-info">
                                    <a class="post-title" data-post-id="${post.id}">
                                        ${post.isSticky ? '<i class="fas fa-thumbtack" style="color: var(--neon-green); margin-right: 5px;"></i>' : ''}
                                        ${post.isEssence ? '<i class="fas fa-gem" style="color: var(--neon-blue); margin-right: 5px;"></i>' : ''}
                                        ${post.title}
                                    </a>
                                    <div class="post-meta">
                                        <span><i class="fas fa-user"></i> ${post.author}</span>
                                        <span><i class="fas fa-clock"></i> ${timeAgo}</span>
                                        <span><i class="fas fa-folder"></i> ${post.category}</span>
                                    </div>
                                    <div class="post-tags">
                                        ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                            <div class="post-stats">
                                <div class="post-stat" data-post-id="${post.id}" data-type="post">
                                    <i class="far fa-heart"></i> ${post.likes}
                                </div>
                                <div class="post-stat">
                                    <i class="fas fa-eye"></i> ${post.views}
                                </div>
                                <div class="post-stat">
                                    <i class="fas fa-comment"></i> ${post.replies}
                                </div>
                            </div>
                        </li>
                    `;
                });
                
                postsList.innerHTML = postsHTML;
            },
            
            // 计算时间差
            getTimeAgo(date) {
                const now = new Date();
                const diffInSeconds = Math.floor((now - date) / 1000);
                
                if (diffInSeconds < 60) {
                    return '刚刚';
                } else if (diffInSeconds < 3600) {
                    return `${Math.floor(diffInSeconds / 60)} 分钟前`;
                } else if (diffInSeconds < 86400) {
                    return `${Math.floor(diffInSeconds / 3600)} 小时前`;
                } else if (diffInSeconds < 2592000) {
                    return `${Math.floor(diffInSeconds / 86400)} 天前`;
                } else {
                    return date.toLocaleDateString('zh-CN');
                }
            },
            
            // 初始化事件
            initEvents() {
                // 分类点击事件
                document.getElementById('categoryList').addEventListener('click', (e) => {
                    e.preventDefault();
                    const categoryLink = e.target.closest('.category-link');
                    if (categoryLink) {
                        const category = categoryLink.getAttribute('data-category');
                        alert(`切换到分类: ${category}`);
                    }
                });
                
                // 筛选按钮
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.loadPosts(btn.getAttribute('data-filter'));
                    });
                });
                
                // 导航菜单
                document.querySelectorAll('.nav-links a').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));
                        link.classList.add('active');
                    });
                });
            },
            
            // 初始化数据流背景
            initDataStream() {
                const dataStream = document.getElementById('dataStream');
                const colors = ['#00f3ff', '#b300ff', '#ff00cc', '#00ff9d'];
                
                for (let i = 0; i < 30; i++) {
                    const stream = document.createElement('div');
                    stream.className = 'stream';
                    
                    // 随机位置
                    const left = Math.random() * 100;
                    stream.style.left = `${left}%`;
                    
                    // 随机颜色
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    stream.style.background = color;
                    stream.style.boxShadow = `0 0 10px ${color}`;
                    
                    // 随机延迟和速度
                    const delay = Math.random() * 15;
                    const duration = 5 + Math.random() * 10;
                    stream.style.animationDelay = `${delay}s`;
                    stream.style.animationDuration = `${duration}s`;
                    
                    dataStream.appendChild(stream);
                }
            }
        };

        // 模态框管理
        const ModalManager = {
            // 显示模态框
            showModal(modalId) {
                document.getElementById(modalId).classList.add('active');
            },
            
            // 隐藏模态框
            hideModal(modalId) {
                document.getElementById(modalId).classList.remove('active');
            },
            
            // 初始化模态框事件
            initModals() {
                // 登录模态框
                document.getElementById('loginBtn').addEventListener('click', () => {
                    this.showModal('loginModal');
                });
                
                document.getElementById('closeLogin').addEventListener('click', () => {
                    this.hideModal('loginModal');
                });
                
                // 注册模态框
                document.getElementById('registerBtn').addEventListener('click', () => {
                    this.showModal('registerModal');
                });
                
                document.getElementById('closeRegister').addEventListener('click', () => {
                    this.hideModal('registerModal');
                });
                
                // 发帖模态框
                document.getElementById('newPostBtn').addEventListener('click', () => {
                    this.showModal('newPostModal');
                });
                
                document.getElementById('closeNewPost').addEventListener('click', () => {
                    this.hideModal('newPostModal');
                });
                
                // 关闭按钮事件
                document.querySelectorAll('.close-modal').forEach(button => {
                    button.addEventListener('click', function() {
                        const modal = this.closest('.modal');
                        modal.classList.remove('active');
                    });
                });
                
                // 点击模态框外部关闭
                document.querySelectorAll('.modal').forEach(modal => {
                    modal.addEventListener('click', function(e) {
                        if (e.target === this) {
                            this.classList.remove('active');
                        }
                    });
                });
            },
            
            // 初始化表单提交事件
            initForms() {
                // 登录表单提交
                document.getElementById('submitLogin').addEventListener('click', () => {
                    const username = document.getElementById('loginUsername').value;
                    const password = document.getElementById('loginPassword').value;
                    
                    if (!username || !password) {
                        alert('请填写完整的登录信息！');
                        return;
                    }
                    
                    alert(`登录成功，欢迎 ${username}！`);
                    this.hideModal('loginModal');
                    // 清空表单
                    document.getElementById('loginUsername').value = '';
                    document.getElementById('loginPassword').value = '';
                });
                
                // 注册表单提交
                document.getElementById('submitRegister').addEventListener('click', () => {
                    const username = document.getElementById('registerUsername').value;
                    const email = document.getElementById('registerEmail').value;
                    const password = document.getElementById('registerPassword').value;
                    const confirmPassword = document.getElementById('registerConfirmPassword').value;
                    
                    if (!username || !email || !password || !confirmPassword) {
                        alert('请填写完整的注册信息！');
                        return;
                    }
                    
                    if (password !== confirmPassword) {
                        alert('两次输入的密码不一致！');
                        return;
                    }
                    
                    alert(`注册成功，欢迎 ${username}！`);
                    this.hideModal('registerModal');
                    // 清空表单
                    document.getElementById('registerUsername').value = '';
                    document.getElementById('registerEmail').value = '';
                    document.getElementById('registerPassword').value = '';
                    document.getElementById('registerConfirmPassword').value = '';
                });
                
                // 发帖表单提交
                document.getElementById('submitNewPost').addEventListener('click', () => {
                    const title = document.getElementById('postTitleInput').value;
                    const category = document.getElementById('postCategoryInput').value;
                    const content = document.getElementById('postContentEditor').innerHTML;
                    const tags = document.getElementById('postTagsInput').value;
                    
                    if (!title || !content) {
                        alert('请填写标题和内容！');
                        return;
                    }
                    
                    alert('帖子发布成功！');
                    this.hideModal('newPostModal');
                    // 清空表单
                    document.getElementById('postTitleInput').value = '';
                    document.getElementById('postContentEditor').innerHTML = '';
                    document.getElementById('postTagsInput').value = '';
                });
            }
        };

        // 初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化论坛数据
            ForumManager.init();
            
            // 初始化模态框
            ModalManager.initModals();
            ModalManager.initForms();
        });
    </script>
