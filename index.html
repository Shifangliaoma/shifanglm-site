<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十方料码论坛</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 原有样式保持不变，这里只添加新增功能的样式 */
        
        /* 后台管理样式 */
        .admin-panel {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .admin-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        .admin-tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .admin-tab.active {
            border-bottom-color: var(--primary);
            color: var(--primary);
            font-weight: 500;
        }
        
        .admin-content {
            display: none;
        }
        
        .admin-content.active {
            display: block;
        }
        
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .admin-table th, .admin-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        .admin-table th {
            background: var(--light);
            font-weight: 600;
        }
        
        .admin-table tr:hover {
            background: #f9f9f9;
        }
        
        .user-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        
        .user-status.active {
            background: rgba(40, 167, 69, 0.1);
            color: var(--success);
        }
        
        .user-status.banned {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger);
        }
        
        /* 积分等级样式 */
        .user-level {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-left: 5px;
        }
        
        .level-newbie {
            background: rgba(108, 117, 125, 0.1);
            color: var(--secondary);
        }
        
        .level-member {
            background: rgba(74, 108, 247, 0.1);
            color: var(--primary);
        }
        
        .level-expert {
            background: rgba(255, 193, 7, 0.1);
            color: #d4a900;
        }
        
        .level-master {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger);
        }
        
        .level-admin {
            background: rgba(111, 66, 193, 0.1);
            color: #6f42c1;
        }
        
        .user-points {
            font-size: 0.85rem;
            color: var(--gray);
        }
        
        /* 编辑帖子按钮 */
        .edit-post-btn {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            margin-left: 15px;
        }
        
        .edit-post-btn:hover {
            color: var(--primary);
        }
        
        /* 手机验证码样式 */
        .verification-code {
            display: flex;
            gap: 10px;
        }
        
        .verification-code input {
            flex: 1;
        }
        
        .send-code-btn {
            white-space: nowrap;
            padding: 10px 15px;
        }
        
        /* 倒计时样式 */
        .countdown {
            color: var(--gray);
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .admin-table {
                display: block;
                overflow-x: auto;
            }
            
            .verification-code {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-comments"></i>
                    </div>
                    <div class="logo-text">
                        <h1>十方料论坛</h1>
                        <p>粉丝互动社区</p>
                    </div>
                </div>
                
                <div class="navbar">
                    <ul class="nav-links">
                        <li><a href="#" class="active" id="navHome">首页</a></li>
                        <li><a href="#" id="navAdmin" class="hidden">后台管理</a></li>
                    </ul>
                    
                    <div class="user-controls">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" placeholder="搜索帖子..." id="searchInput">
                        </div>
                        <div id="userInfo" class="hidden">
                            <span id="userDisplayName" style="margin-right: 15px;"></span>
                            <button class="btn btn-outline" id="logoutBtn">退出</button>
                        </div>
                        <div id="guestControls">
                            <button class="btn btn-outline" id="loginBtn">登录</button>
                            <button class="btn btn-primary" id="registerBtn">注册</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- 首页内容 -->
        <div id="homePage">
            <div class="main-content">
                <!-- 侧边栏 -->
                <div class="sidebar">
                    <div class="sidebar-card">
                        <div class="card-header">
                            <i class="fas fa-list"></i>
                            <h3>论坛分类</h3>
                        </div>
                        <ul class="category-list" id="categoryList">
                            <!-- 分类将通过JavaScript动态加载 -->
                        </ul>
                    </div>
                    
                    <div class="sidebar-card">
                        <div class="card-header">
                            <i class="fas fa-chart-line"></i>
                            <h3>热门标签</h3>
                        </div>
                        <div class="post-tags" style="margin-top: 0;" id="hotTags">
                            <!-- 热门标签将通过JavaScript动态加载 -->
                        </div>
                    </div>
                    
                    <!-- 用户信息卡片 -->
                    <div class="sidebar-card hidden" id="userStatsCard">
                        <div class="card-header">
                            <i class="fas fa-user"></i>
                            <h3>我的信息</h3>
                        </div>
                        <div class="user-info">
                            <p>等级: <span id="userLevelDisplay" class="user-level level-newbie">新手</span></p>
                            <p>积分: <span id="userPointsDisplay">0</span></p>
                            <p>帖子: <span id="userPostsCount">0</span></p>
                        </div>
                    </div>
                </div>
                
                <!-- 论坛内容 -->
                <div class="forum-content">
                    <!-- 帖子列表 -->
                    <div class="posts-section fade-in">
                        <div class="section-header">
                            <div class="section-title">
                                <i class="fas fa-fire"></i>
                                <h2>热门帖子</h2>
                            </div>
                            <div class="filter-options">
                                <button class="filter-btn active" data-filter="latest">最新</button>
                                <button class="filter-btn" data-filter="hot">热门</button>
                                <button class="filter-btn" data-filter="essence">精华</button>
                                <button class="btn btn-primary" id="newPostBtn">
                                    <i class="fas fa-plus"></i> 发帖
                                </button>
                            </div>
                        </div>
                        
                        <ul class="posts-list" id="postsList">
                            <!-- 帖子将通过JavaScript动态加载 -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 帖子详情页面 -->
        <div id="postDetailPage" class="hidden">
            <div class="post-detail fade-in">
                <div class="post-detail-header">
                    <h1 class="post-detail-title" id="postDetailTitle"></h1>
                    <div class="post-meta">
                        <span><i class="fas fa-user"></i> <span id="postDetailAuthor"></span></span>
                        <span><i class="fas fa-clock"></i> <span id="postDetailDate"></span></span>
                        <span><i class="fas fa-folder"></i> <span id="postDetailCategory"></span></span>
                        <span><i class="fas fa-eye"></i> <span id="postDetailViews">0</span></span>
                    </div>
                    <div class="post-tags" id="postDetailTags"></div>
                </div>
                
                <div class="post-detail-content" id="postDetailContent"></div>
                
                <div class="post-actions">
                    <button class="action-btn" id="likePostBtn">
                        <i class="far fa-heart"></i> <span id="postLikesCount">0</span>
                    </button>
                    <button class="action-btn" id="replyToPostBtn">
                        <i class="far fa-comment"></i> 回复
                    </button>
                    <button class="btn btn-outline" id="backToHomeBtn">
                        <i class="fas fa-arrow-left"></i> 返回首页
                    </button>
                    <button class="edit-post-btn hidden" id="editPostBtn">
                        <i class="fas fa-edit"></i> 编辑帖子
                    </button>
                </div>
            </div>
            
            <!-- 回复列表 -->
            <div class="replies-section fade-in">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-comments"></i>
                        <h2>回复</h2>
                    </div>
                </div>
                
                <div id="repliesList">
                    <!-- 回复将通过JavaScript动态加载 -->
                </div>
                
                <!-- 回复编辑器 -->
                <div class="form-group" style="margin-top: 30px;">
                    <label class="form-label">发表回复</label>
                    <div class="editor-toolbar">
                        <button class="editor-btn" data-command="bold" title="加粗"><i class="fas fa-bold"></i></button>
                        <button class="editor-btn" data-command="italic" title="斜体"><i class="fas fa-italic"></i></button>
                        <button class="editor-btn" data-command="underline" title="下划线"><i class="fas fa-underline"></i></button>
                        <button class="editor-btn" data-command="insertUnorderedList" title="无序列表"><i class="fas fa-list-ul"></i></button>
                        <button class="editor-btn" data-command="insertOrderedList" title="有序列表"><i class="fas fa-list-ol"></i></button>
                        <button class="editor-btn" id="emojiBtn" title="表情">😀</button>
                    </div>
                    <div class="editor-content" id="replyEditor" contenteditable="true"></div>
                </div>
                <div class="form-footer">
                    <button class="btn btn-outline" id="cancelReplyBtn">取消</button>
                    <button class="btn btn-primary" id="submitReplyBtn">发表回复</button>
                </div>
            </div>
        </div>
        
        <!-- 后台管理页面 -->
        <div id="adminPage" class="hidden">
            <div class="admin-panel fade-in">
                <h2><i class="fas fa-cogs"></i> 后台管理</h2>
                
                <div class="admin-tabs">
                    <div class="admin-tab active" data-tab="users">用户管理</div>
                    <div class="admin-tab" data-tab="posts">帖子管理</div>
                </div>
                
                <div class="admin-content active" id="usersTab">
                    <h3>用户列表</h3>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>手机号</th>
                                <th>等级</th>
                                <th>积分</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="adminUsersList">
                            <!-- 用户列表将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="admin-content" id="postsTab">
                    <h3>帖子管理</h3>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>标题</th>
                                <th>作者</th>
                                <th>分类</th>
                                <th>发布时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="adminPostsList">
                            <!-- 帖子列表将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-column">
                    <h4>关于我们</h4>
                    <ul class="footer-links">
                        <li><a href="#">论坛简介</a></li>
                        <li><a href="#">管理团队</a></li>
                        <li><a href="#">使用条款</a></li>
                    </ul>
                </div>
            </div>
            <div class="copyright">
                <p>© 2025 十方料码论坛 - 彩民互动社区</p>
            </div>
        </div>
    </footer>

    <!-- 登录模态框 -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>用户登录</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">用户名或手机号</label>
                    <input type="text" class="form-control" id="loginUsername">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="loginPassword">
                </div>
                <div class="form-footer">
                    <button class="btn btn-outline" id="closeLogin">取消</button>
                    <button class="btn btn-primary" id="submitLogin">登录</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 注册模态框 -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>用户注册</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" id="registerUsername">
                </div>
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <div class="verification-code">
                        <input type="tel" class="form-control" id="registerPhone" maxlength="11">
                        <button class="btn btn-outline send-code-btn" id="sendCodeBtn">发送验证码</button>
                    </div>
                    <div class="countdown hidden" id="countdown"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <input type="text" class="form-control" id="registerCode" maxlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="registerPassword">
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <input type="password" class="form-control" id="registerConfirmPassword">
                </div>
                <div class="form-footer">
                    <button class="btn btn-outline" id="closeRegister">取消</button>
                    <button class="btn btn-primary" id="submitRegister">注册</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 发帖模态框 -->
    <div class="modal" id="newPostModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>发布新帖子</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input type="text" class="form-control" id="postTitleInput" placeholder="请输入帖子标题">
                </div>
                <div class="form-group">
                    <label class="form-label">分类</label>
                    <select class="form-control" id="postCategoryInput">
                        <option value="福彩3D交流">福彩3D交流</option>
                        <option value="排列三交流">排列三交流</option>
                        <option value="胆码分析">胆码分析</option>
                        <option value="复式分析">复式分析</option>
                        <option value="双飞分析">双飞分析</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">内容</label>
                    <div class="editor-toolbar">
                        <button class="editor-btn" data-command="bold" title="加粗"><i class="fas fa-bold"></i></button>
                        <button class="editor-btn" data-command="italic" title="斜体"><i class="fas fa-italic"></i></button>
                        <button class="editor-btn" data-command="underline" title="下划线"><i class="fas fa-underline"></i></button>
                        <button class="editor-btn" data-command="insertUnorderedList" title="无序列表"><i class="fas fa-list-ul"></i></button>
                        <button class="editor-btn" data-command="insertOrderedList" title="有序列表"><i class="fas fa-list-ol"></i></button>
                        <button class="editor-btn" id="postEmojiBtn" title="表情">😀</button>
                    </div>
                    <div class="editor-content" id="postContentEditor" contenteditable="true" placeholder="请输入帖子内容..."></div>
                </div>
                <div class="form-group">
                    <label class="form-label">标签 (用逗号分隔)</label>
                    <input type="text" class="form-control" id="postTagsInput" placeholder="例如: 福彩3D, 胆码, 预测">
                </div>
                <div class="form-footer">
                    <button class="btn btn-outline" id="closeNewPost">取消</button>
                    <button class="btn btn-primary" id="submitNewPost">发布</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑帖子模态框 -->
    <div class="modal" id="editPostModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑帖子</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input type="text" class="form-control" id="editPostTitleInput">
                </div>
                <div class="form-group">
                    <label class="form-label">分类</label>
                    <select class="form-control" id="editPostCategoryInput">
                        <option value="福彩3D交流">福彩3D交流</option>
                        <option value="排列三交流">排列三交流</option>
                        <option value="胆码分析">胆码分析</option>
                        <option value="复式分析">复式分析</option>
                        <option value="双飞分析">双飞分析</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">内容</label>
                    <div class="editor-toolbar">
                        <button class="editor-btn" data-command="bold" title="加粗"><i class="fas fa-bold"></i></button>
                        <button class="editor-btn" data-command="italic" title="斜体"><i class="fas fa-italic"></i></button>
                        <button class="editor-btn" data-command="underline" title="下划线"><i class="fas fa-underline"></i></button>
                        <button class="editor-btn" data-command="insertUnorderedList" title="无序列表"><i class="fas fa-list-ul"></i></button>
                        <button class="editor-btn" data-command="insertOrderedList" title="有序列表"><i class="fas fa-list-ol"></i></button>
                        <button class="editor-btn" id="editPostEmojiBtn" title="表情">😀</button>
                    </div>
                    <div class="editor-content" id="editPostContentEditor" contenteditable="true"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">标签 (用逗号分隔)</label>
                    <input type="text" class="form-control" id="editPostTagsInput">
                </div>
                <div class="form-footer">
                    <button class="btn btn-outline" id="closeEditPost">取消</button>
                    <button class="btn btn-primary" id="submitEditPost">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 论坛数据管理
        const ForumManager = {
            // 积分等级配置
            levelConfig: {
                0: { name: "练气期", class: "level-newbie" },
                100: { name: "金丹期", class: "level-member" },
                500: { name: "筑基期", class: "level-expert" },
                1000: { name: "元婴期", class: "level-master" },
                5000: { name: "大乘期", class: "level-admin" }
            },
            
            // 积分规则
            pointsRules: {
                post: 10,      // 发帖
                reply: 5,      // 回复
                like: 1,       // 点赞
                postLiked: 2,  // 帖子被点赞
                replyLiked: 1  // 回复被点赞
            },
            
            // 初始化数据
            init() {
                // 检查本地存储中是否有数据
                if (!localStorage.getItem('forumUsers')) {
                    // 初始化默认用户
                    const defaultUsers = [
                        { 
                            id: 1, 
                            username: 'admin', 
                            phone: '13800000000',
                            password: 'admin123', 
                            role: 'admin',
                            points: 1000,
                            status: 'active',
                            registerDate: new Date().toISOString()
                        },
                        { 
                            id: 2, 
                            username: '十方料码', 
                            phone: '13900000000',
                            password: 'user123', 
                            role: 'user',
                            points: 500,
                            status: 'active',
                            registerDate: new Date().toISOString()
                        }
                    ];
                    localStorage.setItem('forumUsers', JSON.stringify(defaultUsers));
                }
                
                if (!localStorage.getItem('forumPosts')) {
                    // 初始化默认帖子
                    const defaultPosts = [
                        {
                            id: 1,
                            title: '今日福彩3D胆码分析：重点关注3、6、9',
                            content: '<p>根据近期走势分析，今天福彩3D的胆码建议重点关注3、6、9这三个数字。</p><p><strong>理由：</strong></p><ul><li>3号已经连续5期未出</li><li>6号在十位有较强回补趋势</li><li>9号在个位有热出迹象</li></ul><p>建议大家结合自己的判断进行投注！</p>',
                            category: '福彩3D交流',
                            tags: ['福彩3D', '胆码', '分析'],
                            author: '十方料码',
                            authorId: 2,
                            date: new Date('2024-01-15').toISOString(),
                            lastEditDate: new Date('2024-01-15').toISOString(),
                            views: 142,
                            likes: 28,
                            replies: 12,
                            isSticky: true,
                            isEssence: true
                        },
                        {
                            id: 2,
                            title: '排列三组选复式投注技巧分享',
                            content: '<p>今天和大家分享一下排列三组选复式的投注技巧。</p><p><u>重点提示：</u>在选择复式号码时，要注意冷热号的搭配，不要全部选择热号或冷号。</p><p>建议选择2个热号+1个温号+1个冷号的组合方式，这样中奖概率会更高。</p>',
                            category: '排列三交流',
                            tags: ['排列三', '复式', '技巧'],
                            author: 'admin',

            // 更新帖子
            updatePost(postId, updates) {
                const posts = this.getPosts();
                const postIndex = posts.findIndex(p => p.id == postId);
                if (postIndex === -1) return false;
                
                // 检查是否在60分钟内
                const post = posts[postIndex];
                const postDate = new Date(post.date);
                const now = new Date();
                const diffInMinutes = (now - postDate) / (1000 * 60);
                
                if (diffInMinutes > 60) {
                    return { success: false, message: '帖子已超过60分钟，无法编辑' };
                }
                
                // 更新帖子内容
                Object.keys(updates).forEach(key => {
                    posts[postIndex][key] = updates[key];
                });
                posts[postIndex].lastEditDate = new Date().toISOString();
                
                localStorage.setItem('forumPosts', JSON.stringify(posts));
                
                return { success: true };
            },
            
            // 添加回复
            addReply(reply) {
                const replies = this.getReplies();
                // 生成新ID
                const newId = replies.length > 0 ? Math.max(...replies.map(r => r.id)) + 1 : 1;
                reply.id = newId;
                reply.date = new Date().toISOString();
                reply.likes = 0;
                replies.push(reply);
                localStorage.setItem('forumReplies', JSON.stringify(replies));
                
                // 更新用户积分
                this.addPoints(reply.authorId, this.pointsRules.reply);
                
                // 更新帖子的回复数
                const posts = this.getPosts();
                const postIndex = posts.findIndex(p => p.id === reply.postId);
                if (postIndex !== -1) {
                    posts[postIndex].replies++;
                    localStorage.setItem('forumPosts', JSON.stringify(posts));
                }
                
                return reply;
            },

            addPoints(userId, points) {

            // 获取用户等级
            getUserLevel(points) {
                let level = this.levelConfig[0];
                for (const threshold in this.levelConfig) {

                        level = this.levelConfig[threshold];
                    }
                }
                return level;

            // 生成验证码
            generateVerificationCode(phone) {
                // 生成6位随机数字
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                const codes = this.getVerificationCodes();
                
                // 移除该手机号之前的验证码
                const filteredCodes = codes.filter(c => c.phone !== phone);
                
                // 添加新验证码，有效期为10分钟
                filteredCodes.push({
                    phone,
                    code,
                    expires: new Date(Date.now() + 10 * 60 * 1000).toISOString()
                });
                
                localStorage.setItem('verificationCodes', JSON.stringify(filteredCodes));
                
                // 在实际应用中，这里应该调用短信服务发送验证码
                // 这里我们只在控制台输出，模拟发送
                console.log(`验证码发送到 ${phone}: ${code}`);
                
                return code;
            },
            
            // 验证验证码
            verifyCode(phone, code) {
                const codes = this.getVerificationCodes();
                const codeRecord = codes.find(c => c.phone === phone);
                
                if (!codeRecord) {
                    return { success: false, message: '请先获取验证码' };
                }
                
                if (codeRecord.code !== code) {
                    return { success: false, message: '验证码错误' };
                }
                
                if (new Date() > new Date(codeRecord.expires)) {
                    return { success: false, message: '验证码已过期' };
                }
                
                // 验证成功后移除验证码
                const filteredCodes = codes.filter(c => c.phone !== phone);
                localStorage.setItem('verificationCodes', JSON.stringify(filteredCodes));
                
                return { success: true };
            },

                    return;
                }
                
                const likes = this.getLikes();
                const existingLikeIndex = likes.findIndex(like => 
                    like.userId === currentUser.id && 
                    ((type === 'post' && like.postId === itemId) || (type === 'reply' && like.replyId === itemId))
                );
                
                if (existingLikeIndex !== -1) {
                    // 取消点赞
                    likes.splice(existingLikeIndex, 1);
                    
                    // 更新帖子或回复的点赞数
                    if (type === 'post') {
                        const posts = this.getPosts();
                        const postIndex = posts.findIndex(p => p.id === itemId);

                            posts[postIndex].likes--;

                        const replies = this.getReplies();
                        const replyIndex = replies.findIndex(r => r.id === itemId);

                            localStorage.setItem('forumReplies', JSON.stringify(replies));

                    const newLike = {
                        id: likes.length > 0 ? Math.max(...likes.map(l => l.id)) + 1 : 1,
                        userId: currentUser.id,
                        type: type,
                        date: new Date().toISOString()
                    };
                    
                    if (type === 'post') {
                        newLike.postId = itemId;
                        
                        // 更新帖子的点赞数
                        const posts = this.getPosts();
                        const postIndex = posts.findIndex(p => p.id === itemId);
                        if (postIndex !== -1) {
                            posts[postIndex].likes++;
                            localStorage.setItem('forumPosts', JSON.stringify(posts));
                            
                            // 给帖子作者加积分
                            this.addPoints(posts[postIndex].authorId, this.pointsRules.postLiked);
                        }
                        
                        // 给点赞者加积分
                        this.addPoints(currentUser.id, this.pointsRules.like);
                    } else {
                        newLike.replyId = itemId;
                        
                        // 更新回复的点赞数
                        const replies = this.getReplies();
                        const replyIndex = replies.findIndex(r => r.id === itemId);
                        if (replyIndex !== -1) {
                            replies[replyIndex].likes++;
                            localStorage.setItem('forumReplies', JSON.stringify(replies));
                            
                            // 给回复作者加积分
                            this.addPoints(replies[replyIndex].authorId, this.pointsRules.replyLiked);
                        }
                        
                        // 给点赞者加积分
                        this.addPoints(currentUser.id, this.pointsRules.like);
                    }
                    
                    likes.push(newLike);
                }
                
                localStorage.setItem('forumLikes', JSON.stringify(likes));
                
                // 刷新当前页面
                if (document.getElementById('postDetailPage').classList.contains('hidden')) {
                    this.loadPosts();
                } else {
                    const postId = document.querySelector('.post-title[data-post-id]').getAttribute('data-post-id');
                    this.showPostDetail(postId);
                }
            },
            
            // 计算时间差
            getTimeAgo(date) {
                const now = new Date();
                const diffInSeconds = Math.floor((now - date) / 1000);
                
                if (diffInSeconds < 60) {
                    return '刚刚';
                } else if (diffInSeconds < 3600) {
                    return `${Math.floor(diffInSeconds / 60)} 分钟前`;
                } else if (diffInSeconds < 86400) {
                    return `${Math.floor(diffInSeconds / 3600)} 小时前`;
                } else if (diffInSeconds < 2592000) {
                    return `${Math.floor(diffInSeconds / 86400)} 天前`;
                } else {
                    return date.toLocaleDateString('zh-CN');
                }
            },
            
            // 用户登录
            login(username, password) {
                const users = this.getUsers();
                const user = users.find(u => 
                    (u.username === username || u.phone === username) && u.password === password && u.status === 'active'
                );
                
                if (user) {
                    // 保存当前用户信息到sessionStorage
                    sessionStorage.setItem('currentUser', JSON.stringify(user));
                    return user;
                }
                
                return null;
            },
            
            // 用户注册
            register(username, phone, password, code) {
                // 验证验证码
                const codeResult = this.verifyCode(phone, code);
                if (!codeResult.success) {
                    return codeResult;
                }
                
                const users = this.getUsers();
                
                // 检查用户名是否已存在
                if (users.find(u => u.username === username)) {
                    return { success: false, message: '用户名已存在' };
                }
                
                // 添加新用户
                const result = this.addUser({ username, phone, password });
                return result;
            },
            
            // 获取当前登录用户
            getCurrentUser() {
                const userStr = sessionStorage.getItem('currentUser');
                return userStr ? JSON.parse(userStr) : null;
            },
            
            // 用户退出登录
            logout() {
                sessionStorage.removeItem('currentUser');
                location.reload();
            },

                const guestControls = document.getElementById('guestControls');

                    );

                if (posts.length === 0) {
                    postsList.innerHTML = `
                        <li class="post-item">
                            <div style="text-align: center; padding: 40px 20px; color: var(--gray);">

                            </div>
                        </li>
                    `;
                    return;
                }
                
                let postsHTML = '';
                posts.forEach(post => {
                    const postDate = new Date(post.date);
                    const timeAgo = this.getTimeAgo(postDate);
                    const currentUser = this.getCurrentUser();
                    const isLiked = currentUser ? this.getLikes().some(like => 
                        like.postId === post.id && like.userId === currentUser.id && like.type === 'post'
                    ) : false;
                    
                    // 获取作者信息
                    const author = this.getUsers().find(u => u.id === post.authorId);
                    const authorLevel = author ? this.getUserLevel(author.points) : this.levelConfig[0];
                    
                    postsHTML += `
                        <li class="post-item">
                            <div class="post-header">
                                <div class="user-avatar">
                                    ${post.author.substring(0, 1)}

                                        ${post.isSticky ? '<i class="fas fa-thumbtack" style="color: var(--warning); margin-right: 5px;"></i>' : ''}
                                        ${post.isEssence ? '<i class="fas fa-gem" style="color: var(--primary); margin-right: 5px;"></i>' : ''}
                                        ${post.title}
                                    </a>
                                    <div class="post-meta">
                                        <span><i class="fas fa-user"></i> ${post.author} <span class="user-level ${authorLevel.class}">${authorLevel.name}</span></span>
                                        <span><i class="fas fa-clock"></i> ${timeAgo}</span>
                                        <span><i class="fas fa-folder"></i> ${post.category}</span>

                            <div class="post-stats">
                                <div class="post-stat ${isLiked ? 'liked' : ''}" data-post-id="${post.id}" data-type="post">

                                </div>
                                <div class="post-stat">
                                    <i class="fas fa-comment"></i> ${post.replies}
                                </div>
                            </div>
                        </li>
                    `;
                });
                
                postsList.innerHTML = postsHTML;
                
                // 更新标题
                document.querySelector('.section-title h2').textContent = title;
            }

                        alert('用户名或密码错误，或账号已被封禁！');

                // 注册表单提交
                document.getElementById('submitRegister').addEventListener('click', () => {
                    const username = document.getElementById('registerUsername').value;
                    const phone = document.getElementById('registerPhone').value;
                    const code = document.getElementById('registerCode').value;
                    const password = document.getElementById('registerPassword').value;
                    const confirmPassword = document.getElementById('registerConfirmPassword').value;
                    
                    if (!username || !phone || !code || !password || !confirmPassword) {
                        alert('请填写完整的注册信息！');
                        return;
                    }
                    
                    if (password !== confirmPassword) {
                        alert('两次输入的密码不一致！');
                        return;
                    }
                    
                    // 验证手机号格式
                    const phoneRegex = /^1[3-9]\d{9}$/;
                    if (!phoneRegex.test(phone)) {
                        alert('请输入有效的手机号码！');
                        return;
                    }
                    
                    const result = ForumManager.register(username, phone, password, code);
                    if (result.success) {
                        alert(`注册成功，欢迎 ${username}！`);
                        this.hideModal('registerModal');
                        // 清空表单
                        document.getElementById('registerUsername').value = '';
                        document.getElementById('registerPhone').value = '';
                        document.getElementById('registerCode').value = '';
                        document.getElementById('registerPassword').value = '';
                        document.getElementById('registerConfirmPassword').value = '';
                        // 自动登录
                        sessionStorage.setItem('currentUser', JSON.stringify(result.user));
                        ForumManager.updateUserUI();
                    } else {
                        alert(result.message);
                    }
                });
                
                // 发送验证码
                document.getElementById('sendCodeBtn').addEventListener('click', () => {
                    const phone = document.getElementById('registerPhone').value;
                    
                    // 验证手机号格式
                    const phoneRegex = /^1[3-9]\d{9}$/;
                    if (!phoneRegex.test(phone)) {
                        alert('请输入有效的手机号码！');
                        return;
                    }
                    
                    // 检查手机号是否已注册
                    const users = ForumManager.getUsers();
                    if (users.find(u => u.phone === phone)) {
                        alert('该手机号已被注册！');
                        return;
                    }
                    
                    // 生成验证码
                    ForumManager.generateVerificationCode(phone);
                    
                    // 开始倒计时
                    let countdown = 60;
                    const countdownEl = document.getElementById('countdown');
                    const sendCodeBtn = document.getElementById('sendCodeBtn');
                    
                    sendCodeBtn.disabled = true;
                    countdownEl.classList.remove('hidden');
                    
                    const timer = setInterval(() => {
                        countdownEl.textContent = `${countdown}秒后重新发送`;
                        countdown--;
                        
                        if (countdown < 0) {
                            clearInterval(timer);
                            sendCodeBtn.disabled = false;
                            countdownEl.classList.add('hidden');
                        }
                    }, 1000);
                    
                    alert('验证码已发送，请查看控制台获取验证码（在实际应用中会发送到手机）');

                // 发帖表单提交
                document.getElementById('submitNewPost').addEventListener('click', () => {

                    const currentUser = ForumManager.getCurrentUser();
                    const tagArray = tags.split(',').map(tag => tag.trim()).filter(tag => tag);
                    
                    const newPost = {
                        title,
                        category,
                        content,
                        tags: tagArray,
                        author: currentUser.username,
                        authorId: currentUser.id
                    };
                    
                    ForumManager.addPost(newPost);
                    
                    alert('帖子发布成功！');

                    const content = document.getElementById('editPostContentEditor').innerHTML;
                    const tags = document.getElementById('editPostTagsInput').value;
                    
                    if (!title || !content) {
                        alert('请填写标题和内容！');
                        return;
                    }
                    
                    const tagArray = tags.split(',').map(tag => tag.trim()).filter(tag => tag);
                    
                    const updates = {
                        title,
                        category,
                        content,
                        tags: tagArray
                    };
                    
                    const result = ForumManager.updatePost(postId, updates);
                    
                    if (result.success) {
                        alert('帖子修改成功！');
                        this.hideModal('editPostModal');
                        
                        // 刷新帖子详情
                        ForumManager.showPostDetail(postId);

                // 回复表单提交
                document.getElementById('submitReplyBtn').addEventListener('click', () => {

                    }
                    
                    const currentUser = ForumManager.getCurrentUser();
                    if (!currentUser) {
                        alert('请先登录！');
                        this.showModal('loginModal');
                        return;
                    }
                    
                    const postId = parseInt(document.querySelector('.post-title[data-post-id]').getAttribute('data-post-id'));
                    
                    const newReply = {
                        postId: postId,
                        content: content,
                        author: currentUser.username,
                        authorId: currentUser.id
                    };
                    
                    ForumManager.addReply(newReply);
                    
                    alert('回复发表成功！');
                    document.getElementById('replyEditor').innerHTML = '';
                    
                    // 刷新回复列表
                    ForumManager.loadReplies(postId);
                });
                
                // 取消回复
                document.getElementById('cancelReplyBtn').addEventListener('click', () => {
                    document.getElementById('replyEditor').innerHTML = '';
                });
            },
            
            // 初始化编辑器功能
            initEditors() {
                // 为编辑器按钮添加功能
                const initEditorButtons = (toolbar, editor) => {
                    toolbar.querySelectorAll('.editor-btn[data-command]').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.preventDefault();
                            // 确保编辑器获得焦点
                            editor.focus();
                            const command = btn.getAttribute('data-command');
                            document.execCommand(command, false, null);
                            // 重新聚焦到编辑器
                            editor.focus();
                        });
                    });
                };
                
                // 初始化发帖编辑器
                const postToolbar = document.querySelector('#newPostModal .editor-toolbar');
                const postEditor = document.getElementById('postContentEditor');
                if (postToolbar && postEditor) {
                    initEditorButtons(postToolbar, postEditor);
                }
                
                // 初始化编辑帖子编辑器
                const editPostToolbar = document.querySelector('#editPostModal .editor-toolbar');
                const editPostEditor = document.getElementById('editPostContentEditor');
                if (editPostToolbar && editPostEditor) {
                    initEditorButtons(editPostToolbar, editPostEditor);
                }
                
                // 初始化回复编辑器
                const replyToolbar = document.querySelector('#postDetailPage .editor-toolbar');
                const replyEditor = document.getElementById('replyEditor');
                if (replyToolbar && replyEditor) {
                    initEditorButtons(replyToolbar, replyEditor);
                }
                
                // 表情按钮功能
                const initEmojiButton = (buttonId, editorId) => {
                    const emojiBtn = document.getElementById(buttonId);
                    const editor = document.getElementById(editorId);
                    
                    if (emojiBtn && editor) {
                        emojiBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            // 确保编辑器获得焦点
                            editor.focus();
                            
                            const emojis = ['😀', '😂', '🤣', '😍', '😎', '👍', '❤️', '🔥', '✨', '🎉'];
                            let emojiHTML = '';
                            emojis.forEach(emoji => {
                                emojiHTML += `<span class="editor-btn" style="font-size: 1.2rem; cursor: pointer; padding: 5px;">${emoji}</span>`;
                            });
                            
                            // 创建表情选择器
                            let emojiPicker = document.getElementById('emojiPicker');
                            if (!emojiPicker) {
                                emojiPicker = document.createElement('div');
                                emojiPicker.id = 'emojiPicker';
                                emojiPicker.style.cssText = `
                                    position: absolute;
                                    background: white;
                                    border: 1px solid var(--border);
                                    border-radius: 6px;
                                    padding: 10px;
                                    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                                    z-index: 1000;
                                    display: grid;
                                    grid-template-columns: repeat(5, 1fr);
                                    gap: 5px;
                                `;
                                document.body.appendChild(emojiPicker);
                            }
                            
                            emojiPicker.innerHTML = emojiHTML;
                            
                            // 定位表情选择器
                            const btnRect = emojiBtn.getBoundingClientRect();
                            emojiPicker.style.top = `${btnRect.bottom + window.scrollY}px`;
                            emojiPicker.style.left = `${btnRect.left + window.scrollX}px`;
                            
                            // 显示表情选择器
                            emojiPicker.style.display = 'grid';
                            
                            // 表情点击事件
                            emojiPicker.querySelectorAll('.editor-btn').forEach(emojiBtn => {
                                emojiBtn.addEventListener('click', () => {
                                    document.execCommand('insertHTML', false, emojiBtn.textContent);
                                    emojiPicker.style.display = 'none';
                                    // 重新聚焦到编辑器
                                    editor.focus();
                                });
                            });
                            
                            // 点击其他地方关闭表情选择器
                            setTimeout(() => {
                                document.addEventListener('click', function closeEmojiPicker(e) {
                                    if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
                                        emojiPicker.style.display = 'none';
                                        document.removeEventListener('click', closeEmojiPicker);
                                    }
                                });
                            }, 0);
                        });
                    }
                };
                
                // 初始化三个编辑器的表情按钮
                initEmojiButton('postEmojiBtn', 'postContentEditor');
                initEmojiButton('editPostEmojiBtn', 'editPostContentEditor');
                initEmojiButton('emojiBtn', 'replyEditor');
            }
        };

        // 初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化论坛数据
            ForumManager.init();
            
            // 初始化模态框
            ModalManager.initModals();
            ModalManager.initForms();
            ModalManager.initEditors();
            
            // 退出登录事件
            document.getElementById('logoutBtn').addEventListener('click', () => {
                ForumManager.logout();
            });
            
            // 添加一些动画效果
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };
            
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('fade-in');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);
            
            document.querySelectorAll('.posts-section').forEach(el => {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
