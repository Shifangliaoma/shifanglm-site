<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十方料码 - 3D趋势分析与缩水工具平台</title>
    <style>
        /* 之前的样式保持不变，只添加新的样式 */
        
        /* 新增：全局工具同步功能样式 */
        .global-sync-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #0ff;
            border-radius: 8px;
            background: #1a1a1a;
        }
        .sync-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .sync-btn {
            background: #ff9900;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .sync-btn:hover {
            background: #ffaa33;
        }
        .export-btn {
            background: #00cc00;
            color: #000;
        }
        .export-btn:hover {
            background: #00ee00;
        }
        .import-btn {
            background: #0066cc;
            color: #fff;
        }
        .import-btn:hover {
            background: #0088ff;
        }
        .sync-tips {
            color: #ff9900;
            font-size: 14px;
            margin-top: 10px;
            line-height: 1.4;
        }
        .global-tools-info {
            background: #2a2a2a;
            border-radius: 6px;
            padding: 12px;
            margin: 10px 0;
            border-left: 3px solid #0ff;
        }
        .refresh-btn {
            background: #0ff !important;
            color: #000 !important;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <!-- 页面其他部分保持不变 -->

    <!-- 在工具中心的导入模块后面添加全局工具同步功能 -->
    <div id="tool-area">
        <!-- 其他内容保持不变 -->
        
        <!-- 管理员导入模块（仅管理员可见） -->
        <div id="import-module">
            <!-- 原有的导入功能保持不变 -->
            
            <!-- 新增：全局工具同步功能（管理员专用） -->
            <div class="global-sync-section">
                <h3>🌐 全局工具管理系统</h3>
                <p style="color: #ccc; margin-bottom: 10px;">管理员功能：管理所有用户可见的工具</p>
                
                <div class="global-tools-info">
                    <strong>当前全局工具数量：<span id="global-tools-count">0</span> 个</strong>
                    <button class="sync-btn refresh-btn" onclick="loadGlobalTools()">🔄 刷新工具列表</button>
                </div>
                
                <div class="sync-buttons">
                    <button class="sync-btn export-btn" onclick="exportGlobalTools()">📤 备份全局工具</button>
                    <button class="sync-btn import-btn" onclick="document.getElementById('global-tools-import').click()">📥 恢复全局工具</button>
                    <input type="file" id="global-tools-import" accept=".json" style="display: none;" onchange="importGlobalTools(event)">
                    <button class="sync-btn" style="background: #ff3300;" onclick="clearAllTools()">🗑️ 清空所有工具</button>
                </div>
                
                <div class="sync-tips">
                    💡 全局工具说明：<br>
                    • 这里管理的工具对所有用户可见<br>
                    • 普通用户无法修改全局工具<br>
                    • 工具数据存储在云端（模拟）<br>
                    • 用户登录时会自动加载最新工具
                </div>
            </div>
        </div>

        <!-- 新增：用户工具同步提示 -->
        <div id="user-sync-info" style="display: none; margin: 15px 0; padding: 12px; background: #2a2a2a; border-radius: 6px; border-left: 3px solid #ff9900;">
            <strong>🔄 工具同步状态</strong>
            <div id="sync-status">正在加载工具列表...</div>
            <button class="nav-btn" style="margin-top: 8px;" onclick="loadGlobalTools()">手动刷新工具</button>
        </div>

        <!-- 工具列表 -->
        <div class="tool-list" id="tool-list"></div>
    </div>

    <script>
        // 全局工具数据键名
        const GLOBAL_TOOLS_KEY = 'shifanglm_global_tools';
        
        // ===================== 全局工具管理函数 =====================
        
        // 获取全局工具列表
        function getGlobalTools() {
            // 模拟从"云端"获取工具数据
            // 实际项目中这里应该是从服务器API获取
            const globalTools = JSON.parse(localStorage.getItem(GLOBAL_TOOLS_KEY) || '[]');
            return globalTools;
        }
        
        // 保存全局工具列表
        function saveGlobalTools(tools) {
            // 模拟保存到"云端"
            // 实际项目中这里应该是调用服务器API
            localStorage.setItem(GLOBAL_TOOLS_KEY, JSON.stringify(tools));
            
            // 更新所有已登录用户的工具列表
            updateAllUsersTools(tools);
        }
        
        // 更新所有用户的工具列表
        function updateAllUsersTools(tools) {
            // 这里模拟通知所有用户更新工具列表
            // 实际项目中应该使用WebSocket或轮询机制
            console.log('全局工具已更新，通知所有用户刷新');
            
            // 如果当前用户已登录，立即更新其工具列表
            if (Object.keys(loginUser).length > 0) {
                renderToolList();
                updateGlobalToolsCount();
            }
        }
        
        // 加载全局工具到当前用户
        function loadGlobalTools() {
            const globalTools = getGlobalTools();
            document.getElementById('sync-status').innerText = `已加载 ${globalTools.length} 个工具`;
            document.getElementById('user-sync-info').style.display = 'block';
            renderToolList();
            updateGlobalToolsCount();
            
            if (!isAdmin) {
                alert(`工具列表已刷新，共加载 ${globalTools.length} 个工具`);
            }
        }
        
        // 更新全局工具数量显示
        function updateGlobalToolsCount() {
            const globalTools = getGlobalTools();
            document.getElementById('global-tools-count').textContent = globalTools.length;
        }
        
        // 导出全局工具数据
        function exportGlobalTools() {
            if (!isAdmin) {
                alert('只有管理员可以导出全局工具');
                return;
            }
            
            const globalTools = getGlobalTools();
            const dataStr = JSON.stringify(globalTools, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `十方料码全局工具备份_${new Date().toLocaleDateString()}.json`;
            link.click();
            
            alert(`已导出 ${globalTools.length} 个全局工具`);
        }
        
        // 导入全局工具数据
        function importGlobalTools(event) {
            if (!isAdmin) {
                alert('只有管理员可以导入全局工具');
                return;
            }
            
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const toolsData = JSON.parse(e.target.result);
                    if (Array.isArray(toolsData)) {
                        if (confirm(`确定要导入 ${toolsData.length} 个工具吗？这将覆盖现有的全局工具。`)) {
                            saveGlobalTools(toolsData);
                            alert(`成功导入 ${toolsData.length} 个工具！所有用户将立即看到更新。`);
                            event.target.value = ''; // 清空文件输入
                        }
                    } else {
                        alert('文件格式错误：工具数据必须是数组格式');
                    }
                } catch (error) {
                    alert('文件读取失败：' + error.message);
                }
            };
            reader.readAsText(file);
        }
        
        // 清空所有工具
        function clearAllTools() {
            if (!isAdmin) {
                alert('只有管理员可以清空工具');
                return;
            }
            
            if (confirm('⚠️ 确定要清空所有全局工具吗？此操作不可恢复！')) {
                saveGlobalTools([]);
                alert('已清空所有全局工具');
            }
        }
        
        // ===================== 修改现有的工具相关函数 =====================
        
        // 修改渲染工具列表函数，使用全局工具数据
        function renderToolList() {
            const toolList = document.getElementById('tool-list');
            toolList.innerHTML = '';
            
            // 使用全局工具数据
            const globalTools = getGlobalTools();
            
            if (globalTools.length === 0) {
                toolList.innerHTML = '<div style="color:#999; width:100%; text-align:center; padding:20px;">暂无可用工具</div>';
                return;
            }

            globalTools.forEach(tool => {
                const toolItem = document.createElement('div');
                toolItem.className = 'tool-item';
                toolItem.setAttribute('data-tool-id', tool.id);
                
                // 创建工具名称
                const toolName = document.createElement('div');
                toolName.textContent = tool.name;
                toolName.style.cssText = 'padding-right: 25px; text-align: center; width: 100%;';
                
                // 创建删除按钮（仅管理员可见）
                if (isAdmin) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'tool-delete-btn';
                    deleteBtn.innerHTML = '×';
                    deleteBtn.onclick = (e) => deleteTool(tool.id, e);
                    toolItem.appendChild(deleteBtn);
                }
                
                toolItem.appendChild(toolName);
                toolItem.onclick = () => openToolModal(tool.id);
                
                toolList.appendChild(toolItem);
            });
        }
        
        // 修改删除工具函数，操作全局工具
        function deleteTool(toolId, event) {
            if (event) event.stopPropagation();
            
            if (!isAdmin) {
                alert('只有管理员可以删除工具');
                return;
            }
            
            if (confirm('确定要删除这个工具吗？所有用户都将看不到这个工具！')) {
                const globalTools = getGlobalTools();
                const updatedTools = globalTools.filter(tool => tool.id !== toolId);
                
                saveGlobalTools(updatedTools);
                alert('工具删除成功！');
            }
        }
        
        // 修改确认导入函数，将工具添加到全局工具
        function confirmHtmlImport() {
            const content = localStorage.getItem('tempHtmlImportContent') || document.getElementById('html-code-input').value.trim();
            const toolName = document.getElementById('tool-name-input').value.trim();
            if (!content) { alert('无导入内容'); return; }
            if (!toolName) { alert('请输入工具名称'); return; }

            const toolId = Date.now().toString();
            const newTool = { id: toolId, name: toolName, content: content };
            
            // 添加到全局工具
            const globalTools = getGlobalTools();
            globalTools.push(newTool);
            saveGlobalTools(globalTools);
            
            alert(`✅ 工具「${toolName}」导入成功！所有用户都能看到这个工具`);
            hideHtmlPreview();
            document.getElementById('tool-name-input').value = '';
        }
        
        // 修改打开工具弹窗函数，从全局工具获取内容
        function openToolModal(toolId) {
            const globalTools = getGlobalTools();
            const tool = globalTools.find(t => t.id === toolId);
            if (!tool) {
                alert('工具不存在或已被删除');
                return;
            }

            const modal = document.getElementById('tool-modal');
            const iframe = document.getElementById('tool-modal-iframe');
            
            iframe.src = 'about:blank';
            
            iframe.onload = function() {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(tool.content);
                doc.close();
            };
            
            modal.style.display = 'flex';
        }
        
        // ===================== 修改登录和页面显示逻辑 =====================
        
        // 在登录函数中添加工具加载
        function login() {
            // ... 其他登录逻辑保持不变 ...
            
            // 在登录成功后加载全局工具
            if (isAdmin || loginUser.name) {
                loadGlobalTools();
            }
        }
        
        // 在显示工具中心时加载全局工具
        function showToolCenter() {
            if (Object.keys(loginUser).length === 0) {
                alert('请先登录');
                switchToLogin();
                return;
            }
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('page-container').style.display = 'none';
            document.getElementById('no-login-tip').style.display = 'none';
            document.getElementById('admin-panel').style.display = isAdmin ? 'block' : 'none';
            
            // 管理员和会员都可以使用工具中心
            if (isAdmin || JSON.parse(localStorage.getItem(`member_${loginUser.name}`) || '{"type":"none"}').type !== 'none') {
                document.getElementById('tool-area').style.display = 'block';
                // 显示用户同步信息（非管理员）
                if (!isAdmin) {
                    document.getElementById('user-sync-info').style.display = 'block';
                }
                loadGlobalTools(); // 加载全局工具
            } else {
                document.getElementById('tool-area').style.display = 'none';
                alert('需开通会员后使用工具中心');
            }
        }
        
        // ===================== 页面初始化 =====================
        window.onload = function() {
            toggleAdjustBox();
            renderToolList();
            updateGlobalToolsCount();
            
            document.getElementById('admin-import-btn').onclick = function() {
                document.getElementById('tool-area').style.display = 'block';
                document.getElementById('import-module').scrollIntoView({ behavior: 'smooth' });
            };
            
            // 初始化时显示同步状态
            if (Object.keys(loginUser).length > 0 && !isAdmin) {
                document.getElementById('user-sync-info').style.display = 'block';
            }
        };
    </script>
</body>
</html>
