<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十方料码 - 福彩3D工具平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .neon-title {
            font-size: 2.5rem;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
            margin-bottom: 20px;
            text-align: center;
        }
        .neon-subtitle {
            font-size: 1rem;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
            margin-bottom: 40px;
            text-align: center;
        }
        .neon-btn {
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: 0 0 5px #00ffff;
            box-shadow: 0 0 10px #00ffff;
            transition: all 0.3s ease;
            margin: 10px;
        }
        .neon-btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff;
        }
        .header {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }
        .auth-btns {
            display: flex;
            gap: 10px;
        }
        .footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff00ff;
            width: 90%;
            max-width: 400px;
        }
        .modal-title {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #00ffff;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #00ffff;
            color: #fff;
            border-radius: 5px;
            outline: none;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #ff00ff;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .tool-section {
            display: none;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .tool-title {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            margin-bottom: 30px;
        }
        .doc-embed {
            width: 100%;
            height: 400px;
            border: 2px solid #ff00ff;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 2px dashed #00ffff;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .upload-area:hover {
            box-shadow: 0 0 10px #00ffff;
        }
        .error-message {
            color: #ff4444;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .user-info {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #00ffff;
            display: none;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-left: 10px;
        }
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <div class="logo">十方料码</div>
        <div class="auth-btns">
            <button class="neon-btn" id="loginBtn">登录</button>
            <button class="neon-btn" id="registerBtn">注册</button>
        </div>
        <div class="user-info" id="userInfo">
            欢迎，<span id="userEmail"></span>
            <button class="logout-btn" id="logoutBtn">退出</button>
        </div>
    </div>

    <!-- 访客页面 -->
    <div class="guest-section">
        <h1 class="neon-title">欢迎访问十方料码平台</h1>
        <p class="neon-subtitle">登录后即可使用福彩3D工具库与专业分析文档</p>
        <button class="neon-btn" id="guestLoginBtn">立即登录体验</button>
    </div>

    <!-- 工具页面（登录后显示） -->
    <div class="tool-section" id="toolSection">
        <h2 class="tool-title">福彩3D工具库</h2>
        <!-- 金山文档嵌入 -->
        <iframe class="doc-embed" src="https://kdocs.cn/l/cnqZ0nGYv6Uc" frameborder="0"></iframe>
        <!-- HTML文件上传 -->
        <div class="upload-area" id="uploadArea">
            <p>点击上传本地HTML工具文件</p>
        </div>
        <input type="file" id="fileInput" accept=".html" style="display: none;">
        <button class="neon-btn" id="previewBtn">预览上传文件</button>
        <div id="previewArea" style="margin-top: 20px;"></div>
    </div>

    <!-- 登录弹窗 -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-btn" id="loginClose">&times;</span>
            <h3 class="modal-title">用户登录</h3>
            <div class="input-group">
                <label for="loginEmail">邮箱</label>
                <input type="email" id="loginEmail" placeholder="请输入注册邮箱">
            </div>
            <div class="input-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <div class="error-message" id="loginError"></div>
            <div class="modal-btns">
                <button class="neon-btn" id="doLoginBtn">登录</button>
            </div>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="close-btn" id="registerClose">&times;</span>
            <h3 class="modal-title">用户注册</h3>
            <div class="input-group">
                <label for="registerEmail">邮箱</label>
                <input type="email" id="registerEmail" placeholder="请输入邮箱">
            </div>
            <div class="input-group">
                <label for="registerPassword">密码</label>
                <input type="password" id="registerPassword" placeholder="请设置密码（至少8位）">
            </div>
            <div class="error-message" id="registerError"></div>
            <div class="modal-btns">
                <button class="neon-btn" id="doRegisterBtn">注册</button>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
        2025 十方料码 - 福彩3D工具平台 | 仅供研究参考，不构成投注建议
    </div>

    <!-- 使用最新的Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script>
        // 使用正确的配置初始化Appwrite客户端
        const client = new Appwrite.Client();
        client
            .setEndpoint('https://fra.cloud.appwrite.io/v1')  // 修正后的端点
            .setProject('6929b5bb003d77ecd385');  // 修正后的项目ID

        // 初始化账户服务
        const account = new Appwrite.Account(client);

        // DOM元素
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const guestLoginBtn = document.getElementById('guestLoginBtn');
        const loginModal = document.getElementById('loginModal');
        const registerModal = document.getElementById('registerModal');
        const loginClose = document.getElementById('loginClose');
        const registerClose = document.getElementById('registerClose');
        const doLoginBtn = document.getElementById('doLoginBtn');
        const doRegisterBtn = document.getElementById('doRegisterBtn');
        const toolSection = document.getElementById('toolSection');
        const guestSection = document.querySelector('.guest-section');
        const userInfo = document.getElementById('userInfo');
        const userEmail = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginError = document.getElementById('loginError');
        const registerError = document.getElementById('registerError');

        // 显示错误信息
        function showError(element, message) {
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        // 显示加载状态
        function setLoading(button, isLoading) {
            if (isLoading) {
                button.classList.add('loading');
                button.textContent = '处理中...';
            } else {
                button.classList.remove('loading');
                button.textContent = button === doLoginBtn ? '登录' : '注册';
            }
        }

        // 弹窗控制
        function showModal(modal) {
            modal.style.display = 'flex';
        }

        function hideModal(modal) {
            modal.style.display = 'none';
        }

        // 事件监听器
        loginBtn.addEventListener('click', () => showModal(loginModal));
        registerBtn.addEventListener('click', () => showModal(registerModal));
        guestLoginBtn.addEventListener('click', () => showModal(loginModal));
        
        loginClose.addEventListener('click', () => hideModal(loginModal));
        registerClose.addEventListener('click', () => hideModal(registerModal));

        // 点击模态框外部关闭
        window.addEventListener('click', (e) => {
            if (e.target === loginModal) hideModal(loginModal);
            if (e.target === registerModal) hideModal(registerModal);
        });

        // 注册功能
        doRegisterBtn.addEventListener('click', async () => {
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;

            if (!email || !password) {
                showError(registerError, '请输入邮箱和密码！');
                return;
            }

            if (password.length < 8) {
                showError(registerError, '密码至少需要8位！');
                return;
            }

            setLoading(doRegisterBtn, true);

            try {
                // 创建用户
                await account.create(
                    Appwrite.ID.unique(),
                    email,
                    password
                );
                
                // 自动登录
                await account.createEmailPasswordSession(email, password);
                
                alert('注册成功！已自动登录');
                hideModal(registerModal);
                await showToolSection();
            } catch (error) {
                console.error('注册错误:', error);
                showError(registerError, '注册失败: ' + error.message);
            } finally {
                setLoading(doRegisterBtn, false);
            }
        });

        // 登录功能
        doLoginBtn.addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError(loginError, '请输入邮箱和密码！');
                return;
            }

            setLoading(doLoginBtn, true);

            try {
                await account.createEmailPasswordSession(email, password);
                alert('登录成功！');
                hideModal(loginModal);
                await showToolSection();
            } catch (error) {
                console.error('登录错误:', error);
                showError(loginError, '登录失败: ' + error.message);
            } finally {
                setLoading(doLoginBtn, false);
            }
        });

        // 退出登录
        logoutBtn.addEventListener('click', async () => {
            try {
                await account.deleteSession('current');
                alert('已退出登录');
                location.reload();
            } catch (error) {
                console.error('退出登录错误:', error);
            }
        });

        // 显示工具页面
        async function showToolSection() {
            try {
                const user = await account.get();
                userEmail.textContent = user.email;
                
                guestSection.style.display = 'none';
                toolSection.style.display = 'block';
                loginBtn.style.display = 'none';
                registerBtn.style.display = 'none';
                userInfo.style.display = 'block';
            } catch (error) {
                console.error('获取用户信息失败:', error);
            }
        }

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                await account.get();
                await showToolSection();
            } catch (error) {
                console.log('用户未登录');
                guestSection.style.display = 'block';
                toolSection.style.display = 'none';
                userInfo.style.display = 'none';
                loginBtn.style.display = 'block';
                registerBtn.style.display = 'block';
            }
        }

        // 文件上传功能
        document.getElementById('uploadArea').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                document.getElementById('uploadArea').innerHTML = `已选择文件：${e.target.files[0].name}`;
            }
        });

        document.getElementById('previewBtn').addEventListener('click', () => {
            const file = document.getElementById('fileInput').files[0];
            if (!file) {
                alert('请先选择要上传的HTML文件！');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewArea').innerHTML = 
                    `<iframe src="${e.target.result}" width="100%" height="400px" frameborder="0"></iframe>`;
            };
            reader.readAsDataURL(file);
        });

        // 页面加载时检查登录状态
        document.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>
</body>
</html>
