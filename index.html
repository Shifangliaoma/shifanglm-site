<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十方料码 - 福彩3D工具平台</title>
    <!-- 引入外部资源 -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@11.0.0"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 配置Tailwind霓虹主题 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonBlue: '#00f3ff',
                        neonPurple: '#bf00ff',
                        neonPink: '#ff00c8',
                        darkBg: '#0a021a',
                    },
                    animation: {
                        'neon-pulse': 'neon 2s infinite alternate',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        neon: {
                            '0%': { boxShadow: '0 0 5px #00f3ff, 0 0 10px #00f3ff' },
                            '100%': { boxShadow: '0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 30px #bf00ff' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow-neon {
                text-shadow: 0 0 5px #00f3ff, 0 0 10px #bf00ff;
            }
            .bg-glass {
                background: rgba(10, 2, 26, 0.7);
                backdrop-filter: blur(10px);
            }
            .border-neon {
                border: 1px solid #00f3ff;
                box-shadow: 0 0 10px #00f3ff;
            }
        }
    </style>
</head>
<body class="bg-darkBg text-white min-h-screen overflow-x-hidden">
    <!-- 背景霓虹装饰 -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden z-0">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 rounded-full bg-neonBlue/10 blur-3xl animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 rounded-full bg-neonPurple/10 blur-3xl animate-pulse delay-1000"></div>
        <div class="absolute top-3/4 left-2/3 w-64 h-64 rounded-full bg-neonPink/10 blur-3xl animate-pulse delay-2000"></div>
    </div>

    <!-- 导航栏 -->
    <nav class="bg-glass border-b border-neon/30 fixed top-0 w-full z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-2xl font-bold text-shadow-neon">
                <<i class="fa fa-ticket mr-2 text-neonPink"></</i>十方料码
            </div>
            <div id="authButtons" class="flex gap-3">
                <button id="loginBtn" class="px-4 py-2 bg-neonBlue/20 hover:bg-neonBlue/40 text-neonBlue rounded-lg transition-all animate-neon-pulse">
                    登录
                </button>
                <button id="registerBtn" class="px-4 py-2 bg-neonPurple/20 hover:bg-neonPurple/40 text-neonPurple rounded-lg transition-all animate-neon-pulse">
                    注册
                </button>
            </div>
            <div id="userMenu" class="hidden flex items-center gap-3">
                <span id="username" class="text-neonBlue"></span>
                <button id="logoutBtn" class="px-3 py-1 bg-red-500/30 hover:bg-red-500/50 rounded-lg transition-all">
                    退出
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 pt-24 pb-16 z-10 relative">
        <!-- 登录/注册模态框 -->
        <div id="authModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
            <div class="bg-glass border-neon rounded-xl p-6 w-full max-w-md animate-float">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="modalTitle" class="text-xl font-bold text-shadow-neon">用户登录</h2>
                    <button id="closeModal" class="text-white hover:text-neonPink text-xl">
                        <<i class="fa fa-times"></</i>
                    </button>
                </div>
                <form id="authForm" class="space-y-4">
                    <div>
                        <label class="block text-neonBlue mb-1" for="email">邮箱</label>
                        <input type="email" id="email" class="w-full px-4 py-2 bg-darkBg/50 border border-neonBlue/50 rounded-lg text-white focus:outline-none focus:border-neonBlue focus:ring-1 focus:ring-neonBlue" required>
                    </div>
                    <div>
                        <label class="block text-neonBlue mb-1" for="password">密码</label>
                        <input type="password" id="password" class="w-full px-4 py-2 bg-darkBg/50 border border-neonBlue/50 rounded-lg text-white focus:outline-none focus:border-neonBlue focus:ring-1 focus:ring-neonBlue" required>
                    </div>
                    <button type="submit" class="w-full py-2 bg-neonBlue/30 hover:bg-neonBlue/50 text-white rounded-lg transition-all animate-neon-pulse">
                        登录
                    </button>
                    <div class="text-center text-gray-400">
                        <span id="toggleAuthText">没有账号？</span>
                        <button type="button" id="toggleAuthBtn" class="text-neonPurple hover:underline ml-1">立即注册</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 工具列表区 -->
        <section id="toolsSection" class="hidden mt-8">
            <h2 class="text-2xl font-bold mb-6 text-shadow-neon text-center">福彩3D工具库</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 工具1：金山文档嵌入示例 -->
                <div class="bg-glass border-neon rounded-xl p-4 hover:shadow-lg hover:shadow-neonBlue/20 transition-all">
                    <h3 class="text-xl font-semibold text-neonBlue mb-3">3D走势分析文档</h3>
                    <div class="aspect-video border border-neonPurple/50 rounded-lg overflow-hidden">
                        <!-- 替换为你的金山文档嵌入代码 -->
                        <iframe src="https://kdocs.cn/l/csC7X7rP0j88" frameborder="0" width="100%" height="100%" allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 工具2：HTML上传与预览 -->
                <div class="bg-glass border-neon rounded-xl p-4 hover:shadow-lg hover:shadow-neonPink/20 transition-all">
                    <h3 class="text-xl font-semibold text-neonPink mb-3">自定义工具上传</h3>
                    <div class="space-y-4">
                        <input type="file" id="htmlUpload" accept=".html" class="w-full px-4 py-2 bg-darkBg/50 border border-neonPink/50 rounded-lg text-white">
                        <button id="previewBtn" class="w-full py-2 bg-neonPink/30 hover:bg-neonPink/50 text-white rounded-lg transition-all">
                            预览上传的工具
                        </button>
                        <div id="previewContainer" class="aspect-video border border-neonPink/50 rounded-lg overflow-hidden hidden">
                            <iframe id="previewIframe" frameborder="0" width="100%" height="100%"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 未登录提示区 -->
        <section id="guestSection" class="mt-16 text-center">
            <h2 class="text-3xl font-bold text-shadow-neon mb-6">欢迎访问十方料码平台</h2>
            <p class="text-gray-300 mb-8">登录后即可使用福彩3D工具库与专业分析文档</p>
            <button id="guestLoginBtn" class="px-6 py-3 bg-neonBlue/30 hover:bg-neonBlue/50 text-white rounded-lg transition-all animate-neon-pulse text-lg">
                立即登录体验
            </button>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-glass border-t border-neon/30 py-6 z-10 relative">
        <div class="container mx-auto px-4 text-center text-gray-400">
            <p>© 2025 十方料码 - 福彩3D工具平台 | 仅供研究参考，不构成投注建议</p>
        </div>
    </footer>

    <!-- 核心功能脚本 -->
    <script>
        // 初始化Appwrite客户端（已替换你的项目ID）
        const appwrite = new Appwrite();
        appwrite
            .setEndpoint('https://cloud.appwrite.io/v1') 
            .setProject('6929b5bb003d77ECD385') // 已替换为你的项目ID
            .setPlatform('web');

        // DOM元素
        const authButtons = document.getElementById('authButtons');
        const userMenu = document.getElementById('userMenu');
        const username = document.getElementById('username');
        const authModal = document.getElementById('authModal');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const closeModal = document.getElementById('closeModal');
        const logoutBtn = document.getElementById('logoutBtn');
        const authForm = document.getElementById('authForm');
        const modalTitle = document.getElementById('modalTitle');
        const toggleAuthText = document.getElementById('toggleAuthText');
        const toggleAuthBtn = document.getElementById('toggleAuthBtn');
        const toolsSection = document.getElementById('toolsSection');
        const guestSection = document.getElementById('guestSection');
        const guestLoginBtn = document.getElementById('guestLoginBtn');
        const htmlUpload = document.getElementById('htmlUpload');
        const previewBtn = document.getElementById('previewBtn');
        const previewContainer = document.getElementById('previewContainer');
        const previewIframe = document.getElementById('previewIframe');

        // 状态变量
        let isLoginMode = true;

        // 检查用户登录状态
        async function checkAuthStatus() {
            try {
                const user = await appwrite.account.get();
                // 已登录
                authButtons.classList.add('hidden');
                userMenu.classList.remove('hidden');
                username.textContent = user.name || user.email.split('@')[0];
                toolsSection.classList.remove('hidden');
                guestSection.classList.add('hidden');
            } catch (error) {
                // 未登录
                authButtons.classList.remove('hidden');
                userMenu.classList.add('hidden');
                toolsSection.classList.add('hidden');
                guestSection.classList.remove('hidden');
            }
        }

        // 打开模态框
        function openModal(mode) {
            isLoginMode = mode;
            if (isLoginMode) {
                modalTitle.textContent = '用户登录';
                authForm.querySelector('button[type="submit"]').textContent = '登录';
                toggleAuthText.textContent = '没有账号？';
                toggleAuthBtn.textContent = '立即注册';
            } else {
                modalTitle.textContent = '用户注册';
                authForm.querySelector('button[type="submit"]').textContent = '注册';
                toggleAuthText.textContent = '已有账号？';
                toggleAuthBtn.textContent = '立即登录';
            }
            authModal.classList.remove('hidden');
        }

        // 登录/注册提交
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isLoginMode) {
                    // 登录
                    await appwrite.account.createEmailSession(email, password);
                } else {
                    // 注册（用户名使用邮箱前缀）
                    const name = email.split('@')[0];
                    await appwrite.account.create(appwrite.ID.unique(), email, password, name);
                    await appwrite.account.createEmailSession(email, password);
                }
                authModal.classList.add('hidden');
                authForm.reset();
                checkAuthStatus();
            } catch (error) {
                alert(error.message);
            }
        });

        // 切换登录/注册模式
        toggleAuthBtn.addEventListener('click', () => {
            openModal(!isLoginMode);
        });

        // HTML文件预览
        previewBtn.addEventListener('click', () => {
            const file = htmlUpload.files[0];
            if (!file) {
                alert('请先选择一个HTML文件');
                return;
            }
            const fileURL = URL.createObjectURL(file);
            previewIframe.src = fileURL;
            previewContainer.classList.remove('hidden');
        });

        // 事件监听
        loginBtn.addEventListener('click', () => openModal(true));
        registerBtn.addEventListener('click', () => openModal(false));
        closeModal.addEventListener('click', () => authModal.classList.add('hidden'));
        logoutBtn.addEventListener('click', async () => {
            await appwrite.account.deleteSession('current');
            checkAuthStatus();
        });
        guestLoginBtn.addEventListener('click', () => openModal(true));

        // 初始化页面
        checkAuthStatus();
    </script>
</body>
</html>
