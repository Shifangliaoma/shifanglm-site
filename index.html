<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>十方料码 · 胆码趋势（批量导入/自动高亮）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #0b0b15;
            color: #ddd;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #0b0b15;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ff6b3533;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(90deg, #ff6b35, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo i {
            font-size: 1.6rem;
            color: #ffd166;
            -webkit-text-fill-color: initial;
        }
        .admin-toggle {
            background: rgba(255,107,53,0.2);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #ff6b3540;
            color: #ffb347;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .admin-toggle.active {
            background: #ff6b35;
            color: #111;
            border-color: #ffd166;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 12px;
        }
        /* 搜索栏 */
        .search-bar {
            background: rgba(20, 20, 35, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            padding: 8px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,107,53,0.3);
            position: sticky;
            top: 70px;
            z-index: 9;
        }
        .search-bar i {
            color: #ff8c5a;
            font-size: 1.1rem;
        }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            padding: 8px 0;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #777;
        }
        .clear-search {
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 6px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #aaa;
            font-size: 0.9rem;
            padding: 0 4px;
        }
        .info-row span i {
            color: #ff6b35;
            margin-right: 4px;
        }
        /* 表格样式 */
        .trend-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            overflow: hidden;
        }
        .list-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(30,30,45,0.9);
            font-weight: 600;
            color: #ffb347;
            border-bottom: 1px solid #ff6b3540;
            gap: 12px;
            flex-wrap: nowrap;
            min-width: min-content;
        }
        .header-item {
            flex-shrink: 0;
        }
        .header-date {
            width: 70px;
        }
        .header-draw {
            width: 60px;
        }
        .header-trend {
            min-width: 280px;
            flex: 1;
        }
        .trend-item {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: rgba(18, 18, 30, 0.6);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            gap: 12px;
            flex-wrap: nowrap;
            min-width: min-content;
        }
        .trend-item:hover {
            background: rgba(30,30,45,0.8);
        }
        .col-date {
            width: 70px;
            flex-shrink: 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffd166;
        }
        .col-draw {
            width: 60px;
            flex-shrink: 0;
            font-size: 1.3rem;
            font-weight: 700;
            color: #4ecdc4;
            font-family: 'Courier New', monospace;
            background: rgba(78,205,196,0.1);
            padding: 4px 0;
            border-radius: 20px;
            text-align: center;
        }
        /* 导入框（管理员每行编辑） */
        .import-input {
            width: 110px;
            flex-shrink: 0;
            padding: 8px 10px;
            background: #1e1e30;
            border: 1px solid #ff6b3540;
            border-radius: 30px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }
        .import-input:focus {
            border-color: #ff8c5a;
        }
        /* 胆码趋势网格 */
        .trend-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(28px, 1fr));
            gap: 4px;
            flex: 1;
            min-width: 280px;
        }
        .digit-cell {
            aspect-ratio: 1/1;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.1s;
        }
        .digit-cell.highlight {
            background: #ff8c5a;
            color: #111;
            border-color: #ffd166;
            box-shadow: 0 0 6px #ff6b35;
            font-weight: 700;
        }
        /* 操作按钮组 */
        .action-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1rem;
            padding: 6px;
            border-radius: 50%;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn.edit:hover {
            background: rgba(255,107,53,0.2);
            color: #ff8c5a;
        }
        .action-btn.delete:hover {
            background: rgba(255,80,80,0.2);
            color: #ff5e5e;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #555;
        }
        footer {
            text-align: center;
            padding: 30px 16px 10px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,107,53,0.1);
            margin-top: 30px;
        }
        .brand-highlight {
            color: #ffb347;
        }
        /* 导入模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #151525;
            border-radius: 28px;
            padding: 28px 24px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #ff6b35;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close-btn {
            float: right;
            font-size: 2rem;
            color: #aaa;
            cursor: pointer;
        }
        .modal-title {
            font-size: 1.8rem;
            color: #ff6b35;
            margin-bottom: 20px;
            clear: both;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
        }
        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: #1e1e30;
            border: 1px solid #333;
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
        }
        .form-control:focus {
            border-color: #ff6b35;
        }
        textarea.form-control {
            border-radius: 20px;
            min-height: 200px;
            font-family: monospace;
            resize: vertical;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .btn-block {
            width: 100%;
            background: linear-gradient(145deg, #ff6b35, #ff4500);
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #ff6b35;
            color: #ff8c5a;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-chart-line"></i>
            <span>十方胆码 · 表格版</span>
        </div>
        <div class="admin-toggle active" id="adminToggle">
            <i class="fas fa-user-shield"></i> <span>管理员</span>
        </div>
    </nav>

    <div class="container">
        <!-- 搜索栏 -->
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchIssue" placeholder="输入期号如 26048" inputmode="numeric">
            <span class="clear-search" id="clearSearch" style="display: none;">✕</span>
        </div>
        <div class="info-row">
            <span><i class="far fa-list-alt"></i> 最近30期 (最新在底部)</span>
            <span>
                <i class="fas fa-sort-amount-down-alt"></i> 共 <span id="totalCount">0</span> 条
                <i class="fas fa-plus-circle" id="addTrendBtn" style="color:#ff8c5a; font-size:1.4rem; cursor:pointer; margin-left:12px;"></i>
                <i class="fas fa-upload" id="importBtn" style="color:#4ecdc4; font-size:1.4rem; cursor:pointer; margin-left:12px;" title="批量导入"></i>
            </span>
        </div>

        <!-- 表格表头 -->
        <div class="list-header">
            <div class="header-item header-date">日期</div>
            <div class="header-item header-draw">奖号</div>
            <div class="header-item header-trend">胆码趋势分布</div>
            <div class="header-item" style="width:110px;"></div> <!-- 导入框占位 -->
            <div class="header-item" style="width:80px;"></div> <!-- 操作按钮占位 -->
        </div>

        <!-- 列表容器 -->
        <div id="trendListContainer" class="trend-list"></div>
    </div>

    <!-- 新增/编辑模态框 -->
    <div class="modal" id="trendModal">
        <div class="modal-content">
            <span class="close-btn" id="modalClose">&times;</span>
            <h3 class="modal-title" id="modalTitle">添加期号</h3>
            <div class="form-group">
                <label class="form-label">期号 (5位数字)</label>
                <input type="text" id="issueInput" class="form-control" placeholder="如 26048" maxlength="5">
                <div class="error-message" id="issueError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">开奖号码 (3位数字)</label>
                <input type="text" id="drawInput" class="form-control" placeholder="如 612" maxlength="3">
                <div class="error-message" id="drawError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">胆码趋势 (10位数字)</label>
                <input type="text" id="trendInput" class="form-control" placeholder="如 5903417268" maxlength="10">
                <div class="error-message" id="trendError"></div>
            </div>
            <input type="hidden" id="editingId" value="">
            <button class="btn-block" id="saveTrendBtn"><i class="fas fa-save"></i> 保存记录</button>
        </div>
    </div>

    <!-- 批量导入模态框 -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <span class="close-btn" id="importModalClose">&times;</span>
            <h3 class="modal-title">批量导入数据</h3>
            <div class="form-group">
                <label class="form-label">粘贴数据（格式：期号 奖号 胆码趋势，每行一条）</label>
                <textarea id="importData" class="form-control" placeholder="26048 612 5903417268&#10;26049 110 6732405189&#10;26050 689 9071234568"></textarea>
                <div class="error-message" id="importError"></div>
            </div>
            <div class="flex-row">
                <button class="btn-block" id="doImportBtn"><i class="fas fa-check"></i> 导入</button>
                <button class="btn-block btn-secondary" id="clearImportBtn" style="background:transparent;">清空</button>
            </div>
            <p style="color:#aaa; font-size:0.8rem; margin-top:10px;">期号5位，奖号3位，胆码10位，空格分隔。重复期号将被覆盖。</p>
        </div>
    </div>

    <footer>
        <p><span class="brand-highlight">十方料码 · 胆码趋势</span> 自动高亮开奖号码，批量导入/单行编辑</p>
        <p style="margin-top:6px;">表格横向滑动，手机全显示</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        (function() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 40, density: { enable: true } },
                    color: { value: "#ff6b35" },
                    shape: { type: "circle" },
                    opacity: { value: 0.3, random: true },
                    size: { value: 2.5, random: true },
                    move: { enable: true, speed: 0.8 }
                }
            });

            // ---------- 数据 ----------
            let trends = [];
            let filterText = '';
            let isAdmin = true;  // 默认管理员

            // 初始化数据（用户提供的示例）
            function loadFromStorage() {
                const stored = localStorage.getItem('shifang_trends_v6');
                if (stored) {
                    try { trends = JSON.parse(stored); } catch { trends = []; }
                }
                if (!trends.length) {
                    trends = [
                        { id: '1', issue: '26048', drawNumber: '612', trendDigits: '5903417268' },
                        { id: '2', issue: '26049', drawNumber: '110', trendDigits: '6732405189' },
                        { id: '3', issue: '26050', drawNumber: '689', trendDigits: '9071234568' },
                        { id: '4', issue: '26051', drawNumber: '302', trendDigits: '6243581907' },
                        { id: '5', issue: '26052', drawNumber: '277', trendDigits: '4568137029' },
                        { id: '6', issue: '26053', drawNumber: '755', trendDigits: '0984526137' },
                        { id: '7', issue: '26054', drawNumber: '217', trendDigits: '5396102784' },
                        { id: '8', issue: '26055', drawNumber: '107', trendDigits: '0281356794' },
                        { id: '9', issue: '26056', drawNumber: '477', trendDigits: '0637891245' },
                        { id: '10', issue: '26057', drawNumber: '264', trendDigits: '5367419082' },
                        { id: '11', issue: '26058', drawNumber: '543', trendDigits: '6925837140' },
                        { id: '12', issue: '26059', drawNumber: '794', trendDigits: '1098347562' },
                        { id: '13', issue: '26060', drawNumber: '943', trendDigits: '1473289065' },
                        { id: '14', issue: '26061', drawNumber: '429', trendDigits: '5349160782' },
                        { id: '15', issue: '26062', drawNumber: '294', trendDigits: '7901324568' },
                        { id: '16', issue: '26063', drawNumber: '517', trendDigits: '2938016745' }
                    ];
                }
                // 确保每个对象有trendDigits且为10位
                trends.forEach(t => {
                    if (!t.trendDigits) t.trendDigits = t.drawNumber.padEnd(10, '0').slice(0,10);
                    if (t.trendDigits.length < 10) t.trendDigits = t.trendDigits.padEnd(10, '0');
                    if (t.trendDigits.length > 10) t.trendDigits = t.trendDigits.slice(0,10);
                });
                trends.sort((a, b) => parseInt(a.issue) - parseInt(b.issue));
                saveToStorage();
            }

            function saveToStorage() {
                localStorage.setItem('shifang_trends_v6', JSON.stringify(trends));
            }

            // 生成带高亮的网格HTML (trendDigits: 10位字符串, drawNumber: 开奖号)
            function getGridHtml(trendDigits, drawNumber) {
                let html = '';
                for (let i = 0; i < 10; i++) {
                    const digit = trendDigits[i] || '0';
                    const highlight = drawNumber.includes(digit) ? 'highlight' : '';
                    html += `<div class="digit-cell ${highlight}">${digit}</div>`;
                }
                return html;
            }

            // 更新某行的网格显示 (根据最新的trendDigits和drawNumber)
            function refreshRowGrid(itemId) {
                const item = trends.find(t => t.id === itemId);
                if (!item) return;
                const gridContainer = document.querySelector(`.trend-item[data-id="${itemId}"] .trend-grid`);
                if (gridContainer) {
                    gridContainer.innerHTML = getGridHtml(item.trendDigits, item.drawNumber);
                }
            }

            // 渲染列表
            function renderTrends() {
                const container = document.getElementById('trendListContainer');
                const totalSpan = document.getElementById('totalCount');
                const addBtn = document.getElementById('addTrendBtn');
                const importBtn = document.getElementById('importBtn');
                if (!container) return;

                addBtn.style.display = isAdmin ? 'inline-block' : 'none';
                importBtn.style.display = isAdmin ? 'inline-block' : 'none';

                let filtered = trends;
                if (filterText.trim() !== '') {
                    filtered = trends.filter(t => t.issue.includes(filterText.trim()));
                }

                let displayList = filtered;
                if (filterText.trim() === '') {
                    displayList = filtered.slice(-30); // 最近30期
                }

                totalSpan.innerText = filtered.length;

                if (displayList.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="far fa-frown"></i><p>没有匹配的期号</p></div>`;
                    return;
                }

                let html = '';
                displayList.forEach(item => {
                    const draw = item.drawNumber.padEnd(3, ' ').substring(0, 3);
                    const gridHtml = getGridHtml(item.trendDigits, item.drawNumber);

                    let importField = '';
                    let actionButtons = '';
                    if (isAdmin) {
                        importField = `<input type="text" class="import-input" data-id="${item.id}" value="${item.trendDigits}" maxlength="10" placeholder="10位胆码">`;
                        actionButtons = `
                            <div class="action-group">
                                <button class="action-btn edit" data-id="${item.id}" title="编辑"><i class="fas fa-pen"></i></button>
                                <button class="action-btn delete" data-id="${item.id}" title="删除"><i class="fas fa-trash"></i></button>
                            </div>
                        `;
                    }

                    html += `
                        <div class="trend-item" data-id="${item.id}">
                            <div class="col-date">${item.issue}</div>
                            <div class="col-draw">${draw}</div>
                            ${importField}
                            <div class="trend-grid" data-id="${item.id}">${gridHtml}</div>
                            ${actionButtons}
                        </div>
                    `;
                });

                container.innerHTML = html;

                if (isAdmin) {
                    // 导入框输入事件
                    document.querySelectorAll('.import-input').forEach(inp => {
                        inp.addEventListener('input', function(e) {
                            let val = this.value.replace(/[^0-9]/g, '');
                            if (val.length > 10) val = val.slice(0,10);
                            this.value = val;
                            const id = this.dataset.id;
                            const item = trends.find(t => t.id === id);
                            if (item) {
                                item.trendDigits = val;
                                saveToStorage();
                                refreshRowGrid(id); // 刷新网格（同时应用高亮）
                            }
                        });
                    });

                    // 编辑按钮
                    document.querySelectorAll('.edit').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const id = btn.getAttribute('data-id');
                            openEditModal(id);
                        });
                    });

                    // 删除按钮
                    document.querySelectorAll('.delete').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const id = btn.getAttribute('data-id');
                            deleteTrend(id);
                        });
                    });
                }
            }

            // ---------- 模态框逻辑 ----------
            function openAddModal() {
                document.getElementById('modalTitle').innerText = '添加期号';
                document.getElementById('issueInput').value = '';
                document.getElementById('drawInput').value = '';
                document.getElementById('trendInput').value = '';
                document.getElementById('editingId').value = '';
                clearErrors();
                document.getElementById('trendModal').style.display = 'flex';
            }

            function openEditModal(id) {
                const trend = trends.find(t => t.id === id);
                if (!trend) return;
                document.getElementById('modalTitle').innerText = '编辑期号';
                document.getElementById('issueInput').value = trend.issue;
                document.getElementById('drawInput').value = trend.drawNumber;
                document.getElementById('trendInput').value = trend.trendDigits;
                document.getElementById('editingId').value = id;
                clearErrors();
                document.getElementById('trendModal').style.display = 'flex';
            }

            function clearErrors() {
                document.getElementById('issueError').style.display = 'none';
                document.getElementById('drawError').style.display = 'none';
                document.getElementById('trendError').style.display = 'none';
            }

            function saveTrend() {
                const issue = document.getElementById('issueInput').value.trim();
                const draw = document.getElementById('drawInput').value.trim();
                const trend = document.getElementById('trendInput').value.trim().replace(/[^0-9]/g, '');
                const editingId = document.getElementById('editingId').value;

                clearErrors();

                let hasError = false;
                if (!/^\d{5}$/.test(issue)) {
                    document.getElementById('issueError').innerText = '期号必须为5位数字';
                    document.getElementById('issueError').style.display = 'block';
                    hasError = true;
                }
                if (!/^\d{3}$/.test(draw)) {
                    document.getElementById('drawError').innerText = '开奖号码必须为3位数字';
                    document.getElementById('drawError').style.display = 'block';
                    hasError = true;
                }
                if (trend.length !== 10) {
                    document.getElementById('trendError').innerText = '胆码趋势必须为10位数字';
                    document.getElementById('trendError').style.display = 'block';
                    hasError = true;
                }
                if (hasError) return;

                if (editingId) {
                    const index = trends.findIndex(t => t.id === editingId);
                    if (index !== -1) {
                        trends[index].issue = issue;
                        trends[index].drawNumber = draw;
                        trends[index].trendDigits = trend;
                    }
                } else {
                    const newId = Date.now() + '-' + Math.random().toString(36).substr(2, 6);
                    trends.push({ id: newId, issue, drawNumber: draw, trendDigits: trend });
                }

                trends.sort((a, b) => parseInt(a.issue) - parseInt(b.issue));
                saveToStorage();
                renderTrends();
                document.getElementById('trendModal').style.display = 'none';
            }

            function deleteTrend(id) {
                if (!confirm('确定删除该期记录？')) return;
                trends = trends.filter(t => t.id !== id);
                saveToStorage();
                renderTrends();
            }

            // ---------- 批量导入 ----------
            function openImportModal() {
                document.getElementById('importData').value = '';
                document.getElementById('importError').style.display = 'none';
                document.getElementById('importModal').style.display = 'flex';
            }

            function doImport() {
                const raw = document.getElementById('importData').value;
                const lines = raw.split(/\r?\n/).filter(line => line.trim() !== '');
                const errorDiv = document.getElementById('importError');
                errorDiv.style.display = 'none';
                let successCount = 0;
                let failCount = 0;

                lines.forEach(line => {
                    const parts = line.trim().split(/\s+/);
                    if (parts.length < 3) {
                        failCount++;
                        return;
                    }
                    const issue = parts[0];
                    const draw = parts[1];
                    const trend = parts[2].replace(/[^0-9]/g, ''); // 只留数字

                    if (!/^\d{5}$/.test(issue) || !/^\d{3}$/.test(draw) || trend.length !== 10) {
                        failCount++;
                        return;
                    }

                    // 检查是否存在，存在则覆盖
                    const existingIndex = trends.findIndex(t => t.issue === issue);
                    const newItem = { id: existingIndex >= 0 ? trends[existingIndex].id : (Date.now() + '-' + Math.random().toString(36).substr(2, 6)), issue, drawNumber: draw, trendDigits: trend };
                    if (existingIndex >= 0) {
                        trends[existingIndex] = newItem;
                    } else {
                        trends.push(newItem);
                    }
                    successCount++;
                });

                if (successCount > 0 || failCount > 0) {
                    trends.sort((a, b) => parseInt(a.issue) - parseInt(b.issue));
                    saveToStorage();
                    renderTrends();
                    errorDiv.innerText = `导入完成：成功 ${successCount} 条，失败 ${failCount} 条（格式不正确）`;
                    errorDiv.style.display = 'block';
                    errorDiv.style.color = successCount > 0 ? '#55ff55' : '#ff6b6b';
                } else {
                    errorDiv.innerText = '没有成功导入任何数据，请检查格式';
                    errorDiv.style.display = 'block';
                }
            }

            // ---------- 搜索 ----------
            const searchInput = document.getElementById('searchIssue');
            const clearBtn = document.getElementById('clearSearch');

            searchInput.addEventListener('input', function() {
                filterText = this.value.replace(/\D/g, '');
                this.value = filterText;
                clearBtn.style.display = filterText ? 'inline' : 'none';
                renderTrends();
            });

            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                filterText = '';
                clearBtn.style.display = 'none';
                renderTrends();
            });

            // ---------- 管理员切换 ----------
            const adminToggle = document.getElementById('adminToggle');
            function updateAdminUI() {
                adminToggle.innerHTML = isAdmin ? '<i class="fas fa-user-shield"></i> 管理员' : '<i class="fas fa-user"></i> 普通模式';
                adminToggle.classList.toggle('active', isAdmin);
                renderTrends();
            }
            adminToggle.addEventListener('click', () => {
                isAdmin = !isAdmin;
                updateAdminUI();
            });

            // ---------- 事件绑定 ----------
            document.getElementById('addTrendBtn').addEventListener('click', openAddModal);
            document.getElementById('importBtn').addEventListener('click', openImportModal);
            document.getElementById('modalClose').addEventListener('click', () => {
                document.getElementById('trendModal').style.display = 'none';
            });
            document.getElementById('importModalClose').addEventListener('click', () => {
                document.getElementById('importModal').style.display = 'none';
            });
            window.addEventListener('click', (e) => {
                const modal = document.getElementById('trendModal');
                if (e.target === modal) modal.style.display = 'none';
                const importModal = document.getElementById('importModal');
                if (e.target === importModal) importModal.style.display = 'none';
            });

            document.getElementById('saveTrendBtn').addEventListener('click', saveTrend);
            document.getElementById('doImportBtn').addEventListener('click', doImport);
            document.getElementById('clearImportBtn').addEventListener('click', () => {
                document.getElementById('importData').value = '';
            });

            // 输入限制
            document.getElementById('issueInput').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });
            document.getElementById('drawInput').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });
            document.getElementById('trendInput').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });

            // 初始化
            loadFromStorage();
            isAdmin = true;
            updateAdminUI();
        })();
    </script>
</body>
</html>
