<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十方料码 - 福彩3D工具平台</title>
    <style>
        /* 保留原有霓虹风格样式，无需修改 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .neon-title {
            font-size: 2.5rem;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
            margin-bottom: 20px;
            text-align: center;
        }
        .neon-subtitle {
            font-size: 1rem;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
            margin-bottom: 40px;
            text-align: center;
        }
        .neon-btn {
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: 0 0 5px #00ffff;
            box-shadow: 0 0 10px #00ffff;
            transition: all 0.3s ease;
            margin: 10px;
        }
        .neon-btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff;
        }
        .header {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }
        .auth-btns {
            display: flex;
            gap: 10px;
        }
        .footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff00ff;
            width: 90%;
            max-width: 400px;
        }
        .modal-title {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #00ffff;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #00ffff;
            color: #fff;
            border-radius: 5px;
            outline: none;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #ff00ff;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .tool-section {
            display: none;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .tool-title {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            margin-bottom: 30px;
        }
        .doc-embed {
            width: 100%;
            height: 400px;
            border: 2px solid #ff00ff;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 2px dashed #00ffff;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .upload-area:hover {
            box-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <div class="logo">十方料码</div>
        <div class="auth-btns">
            <button class="neon-btn" id="loginBtn">登录</button>
            <button class="neon-btn" id="registerBtn">注册</button>
        </div>
    </div>

    <!-- 访客页面 -->
    <div class="guest-section">
        <h1 class="neon-title">欢迎访问十方料码平台</h1>
        <p class="neon-subtitle">登录后即可使用福彩3D工具库与专业分析文档</p>
        <button class="neon-btn" id="guestLoginBtn">立即登录体验</button>
    </div>

    <!-- 工具页面（登录后显示） -->
    <div class="tool-section" id="toolSection">
        <h2 class="tool-title">福彩3D工具库</h2>
        <!-- 金山文档嵌入 -->
        <iframe class="doc-embed" src="https://kdocs.cn/l/cnqZ0nGYv6Uc" frameborder="0"></iframe>
        <!-- HTML文件上传 -->
        <div class="upload-area" id="uploadArea">
            <p>点击上传本地HTML工具文件</p>
        </div>
        <input type="file" id="fileInput" accept=".html" style="display: none;">
        <button class="neon-btn" id="previewBtn">预览上传文件</button>
        <div id="previewArea" style="margin-top: 20px;"></div>
    </div>

    <!-- 登录弹窗 -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-btn" id="loginClose">&times;</span>
            <h3 class="modal-title">用户登录</h3>
            <div class="input-group">
                <label for="loginEmail">邮箱</label>
                <input type="email" id="loginEmail" placeholder="请输入注册邮箱">
            </div>
            <div class="input-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <div class="modal-btns">
                <button class="neon-btn" id="doLoginBtn">登录</button>
            </div>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="close-btn" id="registerClose">&times;</span>
            <h3 class="modal-title">用户注册</h3>
            <div class="input-group">
                <label for="registerEmail">邮箱</label>
                <input type="email" id="registerEmail" placeholder="请输入邮箱">
            </div>
            <div class="input-group">
                <label for="registerPassword">密码</label>
                <input type="password" id="registerPassword" placeholder="请设置密码（至少8位）">
            </div>
            <div class="modal-btns">
                <button class="neon-btn" id="doRegisterBtn">注册</button>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
        2025 十方料码 - 福彩3D工具平台 | 仅供研究参考，不构成投注建议
    </div>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <script>
        // 初始化Appwrite（已修复跨域配置）
        const appwrite = new Appwrite();
        appwrite
            .setEndpoint('https://cloud.appwrite.io/v1')
            .setProject('6929b5bb003d77ecd385') // 你的项目ID，已核对截图
            .setPlatform('web')
            .setDomain(window.location.hostname); // 自动适配当前域名，解决跨域

        // DOM元素获取
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const guestLoginBtn = document.getElementById('guestLoginBtn');
        const loginModal = document.getElementById('loginModal');
        const registerModal = document.getElementById('registerModal');
        const loginClose = document.getElementById('loginClose');
        const registerClose = document.getElementById('registerClose');
        const doLoginBtn = document.getElementById('doLoginBtn');
        const doRegisterBtn = document.getElementById('doRegisterBtn');
        const toolSection = document.getElementById('toolSection');
        const guestSection = document.querySelector('.guest-section');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewBtn = document.getElementById('previewBtn');
        const previewArea = document.getElementById('previewArea');

        // 弹窗显示/隐藏
        loginBtn.addEventListener('click', () => loginModal.style.display = 'flex');
        registerBtn.addEventListener('click', () => registerModal.style.display = 'flex');
        guestLoginBtn.addEventListener('click', () => loginModal.style.display = 'flex');
        loginClose.addEventListener('click', () => loginModal.style.display = 'none');
        registerClose.addEventListener('click', () => registerModal.style.display = 'none');
        window.addEventListener('click', (e) => {
            if (e.target === loginModal) loginModal.style.display = 'none';
            if (e.target === registerModal) registerModal.style.display = 'none';
        });

        // 注册功能
        doRegisterBtn.addEventListener('click', async () => {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            
            if (!email || !password || password.length < 8) {
                alert('请输入有效邮箱，且密码至少8位！');
                return;
            }

            try {
                // 创建用户
                await appwrite.account.create(
                    ID.unique(),
                    email,
                    password
                );
                // 注册后自动登录
                await appwrite.account.createEmailSession(email, password);
                alert('注册并登录成功！');
                registerModal.style.display = 'none';
                showToolSection();
            } catch (error) {
                alert('注册失败：' + error.message);
            }
        });

        // 登录功能
        doLoginBtn.addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                alert('请输入邮箱和密码！');
                return;
            }

            try {
                await appwrite.account.createEmailSession(email, password);
                alert('登录成功！');
                loginModal.style.display = 'none';
                showToolSection();
            } catch (error) {
                alert('登录失败：' + error.message);
            }
        });

        // 显示工具页面
        function showToolSection() {
            guestSection.style.display = 'none';
            toolSection.style.display = 'block';
            loginBtn.style.display = 'none';
            registerBtn.style.display = 'none';
        }

        // 检查是否已登录
        async function checkLoginStatus() {
            try {
                await appwrite.account.get();
                showToolSection();
            } catch (error) {
                // 未登录，显示访客页面
                guestSection.style.display = 'block';
                toolSection.style.display = 'none';
            }
        }

        // 文件上传
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadArea.innerHTML = `已选择文件：${e.target.files[0].name}`;
            }
        });

        // 预览上传的HTML文件
        previewBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) {
                alert('请先选择要上传的HTML文件！');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                previewArea.innerHTML = `<iframe src="${e.target.result}" width="100%" height="400px" frameborder="0"></iframe>`;
            };
            reader.readAsDataURL(file);
        });

        // 页面加载时检查登录状态
        window.onload = checkLoginStatus;
    </script>
</body>
</html>
