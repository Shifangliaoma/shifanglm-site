<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十方料码 - 福彩3D专业分析平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <style>
        :root {
            --primary: #00ffff;
            --secondary: #ff00ff;
            --accent: #00ffaa;
            --dark: #0a0a1a;
            --darker: #050510;
            --card-bg: rgba(15, 15, 35, 0.7);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: var(--darker);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 粒子背景 */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        /* 导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(10, 10, 25, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
        }
        
        .nav-link {
            color: #ccc;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px 0;
        }
        
        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }
        
        .auth-btns {
            display: flex;
            gap: 15px;
        }
        
        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* 按钮样式 */
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #0080ff);
            color: #000;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #cc00cc);
            color: #fff;
        }
        
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            color: #ccc;
            cursor: pointer;
        }
        
        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--primary);
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        
        .code-input-group {
            display: flex;
            gap: 10px;
        }
        
        .code-input {
            flex: 1;
        }
        
        .send-code-btn {
            white-space: nowrap;
        }
        
        /* 错误提示 */
        .error-message {
            color: #ff5555;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
        
        .success-message {
            color: #55ff55;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
        
        .info-message {
            color: var(--primary);
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }
        
        .link-text {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }
        
        .text-center {
            text-align: center;
        }
        
        .mt-3 {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div id="particles-js"></div>
    
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-chart-network"></i>
            <span>十方料码</span>
        </div>
        <div class="nav-links">
            <a href="#" class="nav-link active" data-section="home">首页</a>
            <a href="#" class="nav-link" data-section="trends">趋势数据</a>
            <a href="#" class="nav-link" data-section="tools">分析工具</a>
        </div>
        <div class="auth-btns">
            <button class="btn btn-outline" id="loginBtn">登录</button>
            <button class="btn btn-primary" id="registerBtn">注册</button>
            <div id="userMenu" style="display: none;">
                <button class="btn btn-outline" id="logoutBtn">退出登录</button>
            </div>
        </div>
    </nav>
    
    <!-- 主内容区 -->
    <div class="container">
        <!-- 首页 -->
        <section id="home" class="content-section active">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-home"></i> 欢迎来到十方料码</h2>
                </div>
                <p>专业福彩3D数据分析平台，提供精准的趋势预测和强大的分析工具。</p>
                <div style="text-align: center; margin-top: 40px;">
                    <h3 style="color: var(--primary); margin-bottom: 20px;">平台特色</h3>
                    <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px;">
                        <div style="flex: 1; min-width: 200px; text-align: center;">
                            <i class="fas fa-chart-line" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
                            <h4>趋势分析</h4>
                            <p>专业的福彩3D趋势数据分析</p>
                        </div>
                        <div style="flex: 1; min-width: 200px; text-align: center;">
                            <i class="fas fa-tools" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
                            <h4>分析工具</h4>
                            <p>多种分析工具助您精准预测</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- 趋势数据 -->
        <section id="trends" class="content-section">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-chart-line"></i> 趋势数据</h2>
                </div>
                <div id="trendsContent">
                    <div style="text-align: center; padding: 50px 20px;">
                        <i class="fas fa-lock" style="font-size: 4rem; color: #ff5555; margin-bottom: 20px;"></i>
                        <h3 style="color: #ff5555; margin-bottom: 15px;">请先登录</h3>
                        <p>登录后即可查看趋势数据</p>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- 分析工具 -->
        <section id="tools" class="content-section">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-tools"></i> 分析工具</h2>
                </div>
                <div id="toolsContent">
                    <div style="text-align: center; padding: 50px 20px;">
                        <i class="fas fa-lock" style="font-size: 4rem; color: #ff5555; margin-bottom: 20px;"></i>
                        <h3 style="color: #ff5555; margin-bottom: 15px;">请先登录</h3>
                        <p>登录后即可使用分析工具</p>
                    </div>
                </div>
            </div>
        </section>
    </div>
    
    <!-- 登录模态框 -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-btn" id="loginClose">&times;</span>
            <h3 class="modal-title">用户登录</h3>
            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="请输入注册邮箱">
                <div class="error-message" id="loginEmailError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="请输入密码">
                <div class="error-message" id="loginPasswordError"></div>
            </div>
            <div class="form-group">
                <button class="btn btn-primary btn-block" id="doLoginBtn">登录</button>
            </div>
            <div class="text-center mt-3">
                <span>还没有账号？</span>
                <span class="link-text" id="switchToRegister">立即注册</span>
                <span> | </span>
                <span class="link-text" id="forgotPassword">忘记密码</span>
            </div>
        </div>
    </div>
    
    <!-- 注册模态框 -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="close-btn" id="registerClose">&times;</span>
            <h3 class="modal-title">用户注册</h3>
            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" id="registerEmail" class="form-control" placeholder="请输入邮箱">
                <div class="error-message" id="registerEmailError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="registerPassword" class="form-control" placeholder="请设置密码（至少8位）">
                <div class="error-message" id="registerPasswordError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">确认密码</label>
                <input type="password" id="registerPasswordConfirm" class="form-control" placeholder="请再次输入密码">
                <div class="error-message" id="registerPasswordConfirmError"></div>
            </div>
            <div class="form-group">
                <button class="btn btn-primary btn-block" id="doRegisterBtn">注册</button>
            </div>
            <div class="text-center mt-3">
                <span>已有账号？</span>
                <span class="link-text" id="switchToLogin">立即登录</span>
            </div>
        </div>
    </div>
    
    <!-- 忘记密码模态框 -->
    <div class="modal" id="forgotPasswordModal">
        <div class="modal-content">
            <span class="close-btn" id="forgotPasswordClose">&times;</span>
            <h3 class="modal-title">找回密码</h3>
            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" id="forgotEmail" class="form-control" placeholder="请输入注册邮箱">
                <div class="error-message" id="forgotEmailError"></div>
            </div>
            <div class="form-group">
                <button class="btn btn-primary btn-block" id="sendResetLink">发送密码重置链接</button>
            </div>
            <div class="info-message">
                <p>我们将向您的邮箱发送密码重置链接，请查收邮件并按照指示操作。</p>
            </div>
            <div class="text-center mt-3">
                <span class="link-text" id="backToLogin">返回登录</span>
            </div>
        </div>
    </div>

    <!-- 底部信息 -->
    <footer style="text-align: center; padding: 30px 20px; color: #666; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 50px;">
        <p>2025 十方料码 - 福彩3D专业分析平台 | 仅供研究参考，不构成投注建议</p>
    </footer>

    <!-- 引入粒子效果库 -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
        // 初始化Appwrite
        const client = new Appwrite.Client();
        client
            .setEndpoint('https://fra.cloud.appwrite.io/v1')
            .setProject('6929b5bb003d77ecd385');

        const account = new Appwrite.Account(client);
        
        // 全局变量
        let currentUser = null;
        
        // DOM元素
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const userMenu = document.getElementById('userMenu');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginModal = document.getElementById('loginModal');
        const registerModal = document.getElementById('registerModal');
        const forgotPasswordModal = document.getElementById('forgotPasswordModal');
        
        // 初始化粒子背景
        particlesJS('particles-js', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: "#00ffff" },
                shape: { type: "circle" },
                opacity: { value: 0.5, random: true },
                size: { value: 3, random: true },
                move: {
                    enable: true,
                    speed: 2,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false
                }
            }
        });
        
        // 显示/隐藏模态框
        loginBtn.onclick = () => {
            loginModal.style.display = 'flex';
            clearErrors();
        };
        
        registerBtn.onclick = () => {
            registerModal.style.display = 'flex';
            clearErrors();
        };
        
        document.getElementById('loginClose').onclick = () => loginModal.style.display = 'none';
        document.getElementById('registerClose').onclick = () => registerModal.style.display = 'none';
        document.getElementById('forgotPasswordClose').onclick = () => forgotPasswordModal.style.display = 'none';
        
        document.getElementById('switchToRegister').onclick = () => {
            loginModal.style.display = 'none';
            registerModal.style.display = 'flex';
        };
        
        document.getElementById('switchToLogin').onclick = () => {
            registerModal.style.display = 'none';
            loginModal.style.display = 'flex';
        };
        
        document.getElementById('forgotPassword').onclick = () => {
            loginModal.style.display = 'none';
            forgotPasswordModal.style.display = 'flex';
        };
        
        document.getElementById('backToLogin').onclick = () => {
            forgotPasswordModal.style.display = 'none';
            loginModal.style.display = 'flex';
        };
        
        // 清除错误提示
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
        }
        
        // 显示错误提示
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }
        
        // 注册功能
        document.getElementById('doRegisterBtn').onclick = async () => {
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            
            clearErrors();
            
            // 验证输入
            let hasError = false;
            
            if (!email) {
                showError('registerEmailError', '请输入邮箱地址');
                hasError = true;
            } else if (!/\S+@\S+\.\S+/.test(email)) {
                showError('registerEmailError', '请输入有效的邮箱地址');
                hasError = true;
            }
            
            if (!password) {
                showError('registerPasswordError', '请输入密码');
                hasError = true;
            } else if (password.length < 8) {
                showError('registerPasswordError', '密码至少需要8位');
                hasError = true;
            }
            
            if (!passwordConfirm) {
                showError('registerPasswordConfirmError', '请确认密码');
                hasError = true;
            } else if (password !== passwordConfirm) {
                showError('registerPasswordConfirmError', '两次输入的密码不一致');
                hasError = true;
            }
            
            if (hasError) return;
            
            try {
                // 创建用户
                await account.create(
                    Appwrite.ID.unique(),
                    email,
                    password
                );
                
                // 自动登录
                await account.createEmailSession(email, password);
                
                alert('注册成功！已自动登录');
                registerModal.style.display = 'none';
                checkLoginStatus();
            } catch (error) {
                console.error('注册错误:', error);
                if (error.message.includes('already exists')) {
                    showError('registerEmailError', '该邮箱已注册，请直接登录');
                } else {
                    showError('registerEmailError', '注册失败，请稍后重试');
                }
            }
        };
        
        // 登录功能
        document.getElementById('doLoginBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            clearErrors();
            
            if (!email) {
                showError('loginEmailError', '请输入邮箱地址');
                return;
            }
            
            if (!password) {
                showError('loginPasswordError', '请输入密码');
                return;
            }
            
            try {
                await account.createEmailSession(email, password);
                alert('登录成功！');
                loginModal.style.display = 'none';
                checkLoginStatus();
            } catch (error) {
                console.error('登录错误:', error);
                if (error.message.includes('Invalid credentials')) {
                    showError('loginPasswordError', '邮箱或密码错误');
                } else if (error.message.includes('User not found')) {
                    showError('loginEmailError', '该邮箱未注册');
                } else {
                    showError('loginEmailError', '登录失败，请稍后重试');
                }
            }
        };
        
        // 发送密码重置链接
        document.getElementById('sendResetLink').onclick = async () => {
            const email = document.getElementById('forgotEmail').value.trim();
            
            clearErrors();
            
            if (!email) {
                showError('forgotEmailError', '请输入邮箱地址');
                return;
            }
            
            if (!/\S+@\S+\.\S+/.test(email)) {
                showError('forgotEmailError', '请输入有效的邮箱地址');
                return;
            }
            
            try {
                // 使用Appwrite内置的密码重置功能
                // 注意：需要先在Appwrite控制台配置SMTP设置才能正常工作
                const resetUrl = `${window.location.origin}/reset-password.html`;
                await account.createRecovery(email, resetUrl);
                
                alert('密码重置链接已发送到您的邮箱，请查收邮件并按照指示操作。\n\n如果未收到邮件，请检查：\n1. 邮箱地址是否正确\n2. 垃圾邮件文件夹\n3. Appwrite邮件服务配置');
                
                // 关闭模态框
                forgotPasswordModal.style.display = 'none';
                loginModal.style.display = 'flex';
                
            } catch (error) {
                console.error('发送重置邮件失败:', error);
                
                if (error.message.includes('User not found')) {
                    showError('forgotEmailError', '该邮箱未注册');
                } else if (error.message.includes('rate limit')) {
                    showError('forgotEmailError', '发送过于频繁，请稍后再试');
                } else {
                    showError('forgotEmailError', '发送重置邮件失败，请检查邮箱是否正确或联系管理员');
                }
            }
        };
        
        // 退出登录
        logoutBtn.onclick = async () => {
            try {
                await account.deleteSession('current');
                alert('已退出登录');
                location.reload();
            } catch (error) {
                console.error('退出登录错误:', error);
            }
        };
        
        // 检查登录状态
        async function checkLoginStatus() {
            try {
                currentUser = await account.get();
                loginBtn.style.display = 'none';
                registerBtn.style.display = 'none';
                userMenu.style.display = 'flex';
                
                // 更新内容显示
                updateContentForLoggedInUser();
            } catch (error) {
                console.log('用户未登录');
                loginBtn.style.display = 'block';
                registerBtn.style.display = 'block';
                userMenu.style.display = 'none';
            }
        }
        
        // 更新登录用户的内容
        function updateContentForLoggedInUser() {
            // 更新趋势数据页面
            const trendsContent = document.getElementById('trendsContent');
            trendsContent.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <h3>福彩3D趋势数据分析</h3>
                    <p>以下是专业趋势分析内容...</p>
                    <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; margin-top: 20px;">
                        <p>这里显示趋势图表和分析数据...</p>
                    </div>
                </div>
            `;
            
            // 更新工具页面
            const toolsContent = document.getElementById('toolsContent');
            toolsContent.innerHTML = `
                <h3>分析工具列表</h3>
                <p>选择工具进行分析：</p>
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
