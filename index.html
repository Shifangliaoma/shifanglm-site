<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>十方料码 · 胆码趋势（一行布局/管理员）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #0b0b15;
            color: #ddd;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #0b0b15;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ff6b3533;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(90deg, #ff6b35, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo i {
            font-size: 1.6rem;
            color: #ffd166;
            -webkit-text-fill-color: initial;
        }
        .admin-toggle {
            background: rgba(255,107,53,0.2);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #ff6b3540;
            color: #ffb347;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .admin-toggle.active {
            background: #ff6b35;
            color: #111;
            border-color: #ffd166;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 12px;
        }
        /* 搜索栏 */
        .search-bar {
            background: rgba(20, 20, 35, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            padding: 8px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,107,53,0.3);
            position: sticky;
            top: 70px;
            z-index: 9;
        }
        .search-bar i {
            color: #ff8c5a;
            font-size: 1.1rem;
        }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            padding: 8px 0;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #777;
        }
        .clear-search {
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 6px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #aaa;
            font-size: 0.9rem;
            padding: 0 4px;
        }
        .info-row span i {
            color: #ff6b35;
            margin-right: 4px;
        }
        /* 列表区 — 强制一行布局，超宽可横向滑动 */
        .trend-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .trend-item {
            background: rgba(18, 18, 30, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.1s;
            overflow-x: auto;        /* 超宽时出现横向滚动条，保证一行 */
            -webkit-overflow-scrolling: touch;
        }
        .trend-item:hover {
            border-color: rgba(255,107,53,0.2);
        }

        /* 行内flex容器，不换行 */
        .row-fields {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;       /* 强制不换行 */
            min-width: min-content;   /* 宽度按内容自适应 */
        }

        .issue {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffd166;
            line-height: 1.2;
            white-space: nowrap;
            flex-shrink: 0;           /* 禁止缩小 */
        }
        .draw {
            font-size: 1.6rem;
            font-weight: 800;
            color: #4ecdc4;
            font-family: 'Courier New', monospace;
            background: rgba(78,205,196,0.1);
            padding: 4px 16px;
            border-radius: 40px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        /* 导入框 */
        .import-input {
            width: 100px;
            min-width: 80px;
            padding: 10px 12px;
            background: #1e1e30;
            border: 1px solid #ff6b3540;
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .import-input:focus {
            border-color: #ff8c5a;
            box-shadow: 0 0 8px #ff6b35;
        }
        .import-input::placeholder {
            color: #555;
            font-size: 0.8rem;
        }

        /* 0-9网格 — 允许缩小，但保证最小宽度 */
        .digit-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(28px, 1fr));
            gap: 4px;
            flex-shrink: 1;           /* 允许缩小 */
            min-width: 280px;          /* 最小宽度，再小格子就太小了 */
            width: auto;
        }
        .digit-cell {
            aspect-ratio: 1/1;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.15s;
            cursor: default;
        }
        .digit-cell.highlight {
            background: #ff8c5a;
            color: #111;
            border-color: #ffd166;
            box-shadow: 0 0 10px #ff6b35;
            font-weight: 800;
            transform: scale(1.02);
        }

        /* 操作按钮组 */
        .action-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            margin-left: auto;         /* 靠右，但在flex中可被压缩 */
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.1rem;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn.edit:hover {
            background: rgba(255,107,53,0.2);
            color: #ff8c5a;
        }
        .action-btn.delete:hover {
            background: rgba(255,80,80,0.2);
            color: #ff5e5e;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #555;
        }
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 12px;
            color: #333;
        }

        footer {
            text-align: center;
            padding: 30px 16px 10px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,107,53,0.1);
            margin-top: 30px;
        }
        .brand-highlight {
            color: #ffb347;
        }

        /* 模态框 (保持不变) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #151525;
            border-radius: 28px;
            padding: 28px 24px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #ff6b35;
            box-shadow: 0 20px 40px #00000080;
        }
        .close-btn {
            float: right;
            font-size: 2rem;
            line-height: 1;
            color: #aaa;
            cursor: pointer;
        }
        .modal-title {
            font-size: 1.8rem;
            color: #ff6b35;
            margin-bottom: 25px;
            clear: both;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
        }
        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: #1e1e30;
            border: 1px solid #333;
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .form-control:focus {
            border-color: #ff6b35;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
        .btn-block {
            width: 100%;
            background: linear-gradient(145deg, #ff6b35, #ff4500);
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            color: white;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        /* 手机小屏优化 */
        @media (max-width: 550px) {
            .issue, .draw { font-size: 1.3rem; }
            .import-input { width: 80px; padding: 8px 6px; }
            .digit-grid { min-width: 240px; }
            .digit-cell { font-size: 0.85rem; }
            .action-btn { width: 36px; height: 36px; }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-chart-line"></i>
            <span>十方胆码 · 一行版</span>
        </div>
        <div class="admin-toggle active" id="adminToggle">
            <i class="fas fa-user-shield"></i> <span>管理员</span>
        </div>
    </nav>

    <div class="container">
        <!-- 搜索栏 -->
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchIssue" placeholder="输入期号如 25613" inputmode="numeric">
            <span class="clear-search" id="clearSearch" style="display: none;">✕</span>
        </div>
        <div class="info-row">
            <span><i class="far fa-list-alt"></i> 最近30期 (最新在底部)</span>
            <span><i class="fas fa-sort-amount-down-alt"></i> 共 <span id="totalCount">0</span> 条
                <i class="fas fa-plus-circle" id="addTrendBtn" style="color:#ff8c5a; font-size:1.4rem; cursor:pointer; margin-left:12px;"></i>
            </span>
        </div>

        <!-- 列表容器 -->
        <div id="trendListContainer" class="trend-list"></div>
    </div>

    <!-- 新增/编辑模态框 -->
    <div class="modal" id="trendModal">
        <div class="modal-content">
            <span class="close-btn" id="modalClose">&times;</span>
            <h3 class="modal-title" id="modalTitle">添加期号</h3>
            <div class="form-group">
                <label class="form-label">期号 (5位数字)</label>
                <input type="text" id="issueInput" class="form-control" placeholder="如 25613" maxlength="5">
                <div class="error-message" id="issueError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">开奖号码 (3位数字)</label>
                <input type="text" id="drawInput" class="form-control" placeholder="如 256" maxlength="3">
                <div class="error-message" id="drawError"></div>
            </div>
            <input type="hidden" id="editingId" value="">
            <button class="btn-block" id="saveTrendBtn"><i class="fas fa-save"></i> 保存记录</button>
        </div>
    </div>

    <footer>
        <p><span class="brand-highlight">十方料码 · 胆码趋势</span> 一行布局，横向滑动查看全部</p>
        <p style="margin-top: 6px;">管理员模式默认开启，导入框手动输入数字(如 145) 实时高亮网格</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        (function() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 40, density: { enable: true } },
                    color: { value: "#ff6b35" },
                    shape: { type: "circle" },
                    opacity: { value: 0.3, random: true },
                    size: { value: 2.5, random: true },
                    move: { enable: true, speed: 0.8 }
                }
            });

            // ---------- 状态 ----------
            let trends = [];               // 全部数据，按期号升序
            let filterText = '';
            let isAdmin = true;             // 默认开启管理员模式，便于测试

            // 加载数据
            function loadFromStorage() {
                const stored = localStorage.getItem('shifang_trends_v4');
                if (stored) {
                    try { trends = JSON.parse(stored); } catch { trends = []; }
                }
                // 示例数据
                if (!trends.length) {
                    trends = [
                        { id: '1', issue: '25601', drawNumber: '425', manualCode: '425' },
                        { id: '2', issue: '25602', drawNumber: '789', manualCode: '789' },
                        { id: '3', issue: '25603', drawNumber: '014', manualCode: '014' },
                        { id: '4', issue: '25604', drawNumber: '333', manualCode: '3' },
                        { id: '5', issue: '25605', drawNumber: '256', manualCode: '256' },
                        { id: '6', issue: '25606', drawNumber: '107', manualCode: '107' },
                        { id: '7', issue: '25607', drawNumber: '888', manualCode: '8' },
                        { id: '8', issue: '25608', drawNumber: '692', manualCode: '692' },
                        { id: '9', issue: '25609', drawNumber: '555', manualCode: '5' },
                        { id: '10', issue: '25610', drawNumber: '123', manualCode: '123' },
                        { id: '11', issue: '25611', drawNumber: '999', manualCode: '9' },
                        { id: '12', issue: '25612', drawNumber: '777', manualCode: '7' },
                        { id: '13', issue: '25613', drawNumber: '256', manualCode: '256' },
                        { id: '14', issue: '25614', drawNumber: '321', manualCode: '321' },
                        { id: '15', issue: '25615', drawNumber: '468', manualCode: '468' },
                        { id: '16', issue: '25616', drawNumber: '111', manualCode: '1' },
                        { id: '17', issue: '25617', drawNumber: '222', manualCode: '2' },
                        { id: '18', issue: '25618', drawNumber: '333', manualCode: '3' },
                        { id: '19', issue: '25619', drawNumber: '444', manualCode: '4' },
                        { id: '20', issue: '25620', drawNumber: '555', manualCode: '5' },
                        { id: '21', issue: '25621', drawNumber: '666', manualCode: '6' },
                        { id: '22', issue: '25622', drawNumber: '777', manualCode: '7' },
                        { id: '23', issue: '25623', drawNumber: '888', manualCode: '8' },
                        { id: '24', issue: '25624', drawNumber: '999', manualCode: '9' },
                        { id: '25', issue: '25625', drawNumber: '000', manualCode: '0' },
                        { id: '26', issue: '25626', drawNumber: '135', manualCode: '135' },
                        { id: '27', issue: '25627', drawNumber: '579', manualCode: '579' },
                        { id: '28', issue: '25628', drawNumber: '246', manualCode: '246' },
                        { id: '29', issue: '25629', drawNumber: '802', manualCode: '802' },
                        { id: '30', issue: '25630', drawNumber: '413', manualCode: '413' },
                        { id: '31', issue: '25631', drawNumber: '725', manualCode: '725' },
                        { id: '32', issue: '25632', drawNumber: '690', manualCode: '690' }
                    ];
                } else {
                    // 保证每个对象有manualCode
                    trends.forEach(t => { if (t.manualCode === undefined) t.manualCode = t.drawNumber; });
                }
                trends.sort((a, b) => parseInt(a.issue) - parseInt(b.issue));
                saveToStorage();
            }

            function saveToStorage() {
                localStorage.setItem('shifang_trends_v4', JSON.stringify(trends));
            }

            // 根据manualCode生成网格HTML
            function getGridHtml(manualCode) {
                const digits = manualCode ? manualCode.toString() : '';
                const uniqueDigits = [...new Set(digits.split('').filter(c => /[0-9]/.test(c)))];
                let cells = '';
                for (let d = 0; d <= 9; d++) {
                    const highlight = uniqueDigits.includes(d.toString());
                    cells += `<div class="digit-cell ${highlight ? 'highlight' : ''}">${d}</div>`;
                }
                return cells;
            }

            // 刷新单个网格
            function refreshGridForItem(itemId) {
                const item = trends.find(t => t.id === itemId);
                if (!item) return;
                const gridContainer = document.querySelector(`.trend-item[data-id="${itemId}"] .digit-grid`);
                if (gridContainer) {
                    gridContainer.innerHTML = getGridHtml(item.manualCode);
                }
            }

            // 渲染列表
            function renderTrends() {
                const container = document.getElementById('trendListContainer');
                const totalSpan = document.getElementById('totalCount');
                const addBtn = document.getElementById('addTrendBtn');
                if (!container) return;

                addBtn.style.display = isAdmin ? 'inline-block' : 'none';

                let filtered = trends;
                if (filterText.trim() !== '') {
                    filtered = trends.filter(t => t.issue.includes(filterText.trim()));
                }

                let displayList = filtered;
                if (filterText.trim() === '') {
                    displayList = filtered.slice(-30);
                }

                totalSpan.innerText = filtered.length;

                if (displayList.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="far fa-frown"></i><p>没有匹配的期号</p></div>`;
                    return;
                }

                let html = '';
                displayList.forEach(item => {
                    const draw = item.drawNumber.padEnd(3, ' ').substring(0, 3);
                    const gridHtml = getGridHtml(item.manualCode);

                    let importField = '';
                    let actionButtons = '';
                    if (isAdmin) {
                        importField = `<input type="text" class="import-input" data-id="${item.id}" value="${item.manualCode || ''}" placeholder="胆码">`;
                        actionButtons = `
                            <div class="action-group">
                                <button class="action-btn edit" data-id="${item.id}" title="编辑"><i class="fas fa-pen"></i></button>
                                <button class="action-btn delete" data-id="${item.id}" title="删除"><i class="fas fa-trash"></i></button>
                            </div>
                        `;
                    }

                    // 注意顺序：期号-奖号-导入框-胆码网格-操作按钮
                    html += `
                        <div class="trend-item" data-id="${item.id}">
                            <div class="row-fields">
                                <span class="issue">${item.issue}</span>
                                <span class="draw">${draw}</span>
                                ${importField}
                                <div class="digit-grid" data-id="${item.id}">${gridHtml}</div>
                                ${actionButtons}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                if (isAdmin) {
                    // 导入框输入事件
                    document.querySelectorAll('.import-input').forEach(inp => {
                        inp.addEventListener('input', function(e) {
                            const id = this.dataset.id;
                            const newVal = this.value.replace(/[^0-9]/g, '');
                            const trend = trends.find(t => t.id === id);
                            if (trend) {
                                trend.manualCode = newVal;
                                saveToStorage();
                                refreshGridForItem(id);
                            }
                        });
                    });

                    // 编辑按钮
                    document.querySelectorAll('.edit').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const id = btn.getAttribute('data-id');
                            openEditModal(id);
                        });
                    });

                    // 删除按钮
                    document.querySelectorAll('.delete').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const id = btn.getAttribute('data-id');
                            deleteTrend(id);
                        });
                    });
                }
            }

            // 模态框逻辑
            function openAddModal() {
                document.getElementById('modalTitle').innerText = '添加期号';
                document.getElementById('issueInput').value = '';
                document.getElementById('drawInput').value = '';
                document.getElementById('editingId').value = '';
                clearErrors();
                document.getElementById('trendModal').style.display = 'flex';
            }

            function openEditModal(id) {
                const trend = trends.find(t => t.id === id);
                if (!trend) return;
                document.getElementById('modalTitle').innerText = '编辑期号';
                document.getElementById('issueInput').value = trend.issue;
                document.getElementById('drawInput').value = trend.drawNumber;
                document.getElementById('editingId').value = id;
                clearErrors();
                document.getElementById('trendModal').style.display = 'flex';
            }

            function clearErrors() {
                document.getElementById('issueError').style.display = 'none';
                document.getElementById('drawError').style.display = 'none';
            }

            function showError(elId, msg) {
                const el = document.getElementById(elId);
                el.innerText = msg;
                el.style.display = 'block';
            }

            function saveTrend() {
                const issue = document.getElementById('issueInput').value.trim();
                const draw = document.getElementById('drawInput').value.trim();
                const editingId = document.getElementById('editingId').value;

                clearErrors();

                if (!/^\d{5}$/.test(issue)) {
                    showError('issueError', '期号必须为5位数字');
                    return;
                }
                if (!/^\d{3}$/.test(draw)) {
                    showError('drawError', '开奖号码必须为3位数字');
                    return;
                }

                if (editingId) {
                    const index = trends.findIndex(t => t.id === editingId);
                    if (index !== -1) {
                        trends[index].issue = issue;
                        trends[index].drawNumber = draw;
                        // 编辑时不覆盖manualCode，保留原导入码
                    }
                } else {
                    const newId = Date.now() + '-' + Math.random().toString(36).substr(2, 6);
                    trends.push({ id: newId, issue, drawNumber: draw, manualCode: draw });
                }

                trends.sort((a, b) => parseInt(a.issue) - parseInt(b.issue));
                saveToStorage();
                renderTrends();
                document.getElementById('trendModal').style.display = 'none';
            }

            function deleteTrend(id) {
                if (!confirm('确定删除该期记录？')) return;
                trends = trends.filter(t => t.id !== id);
                saveToStorage();
                renderTrends();
            }

            // 搜索
            const searchInput = document.getElementById('searchIssue');
            const clearBtn = document.getElementById('clearSearch');

            searchInput.addEventListener('input', function() {
                filterText = this.value.replace(/\D/g, '');
                this.value = filterText;
                clearBtn.style.display = filterText ? 'inline' : 'none';
                renderTrends();
            });

            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                filterText = '';
                clearBtn.style.display = 'none';
                renderTrends();
            });

            // 管理员切换
            const adminToggle = document.getElementById('adminToggle');
            function updateAdminUI() {
                adminToggle.innerHTML = isAdmin ? '<i class="fas fa-user-shield"></i> 管理员' : '<i class="fas fa-user"></i> 普通模式';
                adminToggle.classList.toggle('active', isAdmin);
                renderTrends();
            }
            adminToggle.addEventListener('click', () => {
                isAdmin = !isAdmin;
                updateAdminUI();
            });

            document.getElementById('addTrendBtn').addEventListener('click', openAddModal);
            document.getElementById('modalClose').addEventListener('click', () => {
                document.getElementById('trendModal').style.display = 'none';
            });
            window.addEventListener('click', (e) => {
                const modal = document.getElementById('trendModal');
                if (e.target === modal) modal.style.display = 'none';
            });
            document.getElementById('saveTrendBtn').addEventListener('click', saveTrend);

            // 数字限制
            document.getElementById('issueInput').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });
            document.getElementById('drawInput').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });

            // 初始化
            loadFromStorage();
            isAdmin = true;  // 确保默认管理员
            updateAdminUI();
        })();
    </script>
</body>
</html>
