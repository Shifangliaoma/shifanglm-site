<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>十方料码，伪序专业趋势数据！ 联系QQ:921913231</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="matrix"></canvas>

  <header class="site-header">
    <div class="brand">
      <h1>十方料码，伪序专业趋势数据！</h1>
      <p class="sub">每日更新心得技巧 · 联系QQ: <a href="tencent://message/?uin=921913231" class="qq">921913231</a></p>
    </div>
    <nav class="header-actions">
      <button id="exportBtn" class="btn ghost">导 出</button>
      <input id="importFile" type="file" accept=".json" style="display:none" />
      <button id="importBtn" class="btn ghost">导 入</button>
      <button id="addPostBtn" class="btn neon">发 帖</button>
      <button id="toggleHacker" class="btn ghost">隐藏黑客</button>
      <button id="musicToggle" class="btn ghost" title="背景音乐">▶</button>
    </nav>
  </header>

  <main class="container">
    <section class="search-bar">
      <input id="searchInput" type="search" placeholder="搜索标题 / 内容 / 标签（示例: 走势、冷热）" />
    </section>

    <section id="posts" class="posts" aria-live="polite"></section>
  </main>

  <button id="fabAdd" class="fab neon" title="发帖">+</button>

  <div id="postModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <header class="modal-header">
        <h2>发布心得 / 技巧</h2>
        <button id="closeModal" class="close">&times;</button>
      </header>
      <form id="postForm" class="post-form">
        <label>
          标题
          <input id="postTitle" type="text" placeholder="输入标题，例如：09期冷热走势分析" required maxlength="100" />
        </label>
        <label>
          内容
          <textarea id="postContent" rows="6" placeholder="写下你的走势图心得、观察与选号思路..." required maxlength="2000"></textarea>
        </label>
        <label>
          标签（可选，用逗号分隔）
          <input id="postTags" type="text" placeholder="例如：走势,冷热,和值" />
        </label>

        <label>
          图片（可多选，支持 JPG/PNG，发布时会上传）
          <input id="postImages" type="file" accept="image/*" multiple />
        </label>
        <div id="imagePreviews" class="image-previews"></div>

        <div class="form-actions">
          <button type="submit" class="btn neon">发布</button>
          <button type="button" id="cancelBtn" class="btn ghost">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div id="hacker" class="hacker" aria-hidden="false" title="黑客守护者"></div>

  <footer class="site-footer">
    <small>免责声明：仅供参考与娱乐，理性购彩。联系方式：QQ 921913231</small>
  </footer>

  <!-- 背景音乐（尝试自动播放，移动端通常需要用户交互） -->
  <audio id="bgMusic" loop preload="auto" src="assets/cyber-loop.mp3"></audio>

  <script src="app.js" defer></script>
</body>
</html>
