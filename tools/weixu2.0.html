<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十方料码 - 定位复式专用分析系统</title>

    <style>

        body {

            padding: 15px;

        }

            width: 100%;

        /* 顶部标题区域优化 */
        .header {
            position: relative;
            text-align: center;
            margin-bottom: 25px;
            padding: 15px 0;
            border-radius: 12px;

            border: 1px solid #ffd700;

        }
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='rgba(255, 215, 0, 0.1)' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.3;
            border-radius: 12px;
            z-index: 0;
        }
        .header h1 {
            position: relative;
            color: #fff;
            font-size: 28px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #ffd700, 0 0 30px #ff00ff;
            margin: 0;

        }
        .header .subtitle {

        /* 导入数据区域优化 */
        .input-group {

            position: relative;

        }
        .input-label {

            margin-bottom: 10px;

            padding: 15px;

            padding: 20px;

            border-radius: 12px;

            font-size: 18px;

            text-shadow: 0 0 5px #ff00ff;
        }

            background: linear-gradient(90deg, #00ffff, #ff00ff);

            display: none;
            font-size: 16px;

            background: rgba(0, 20, 30, 0.8);
            border-radius: 3px;
        }

            border-radius: 3px;

            background: rgba(0, 20, 30, 0.8);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;

            padding: 12px;

            z-index: 9999;

        .toast.active {
            opacity: 1;
        }
        .voice-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8), 0 0 25px rgba(255, 0, 255, 0.6);
            color: #000;
            font-size: 24px;

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }

</head>
<body>
    <button class="voice-btn" id="voiceBtn" title="语音播报当前结果">🔊</button>
    <div class="container">
        <!-- 优化后的顶部标题区域 -->
        <div class="header">
            <h1>十方料码 · 福彩3D复式分析系统</h1>
            <div class="subtitle">精准判定 · 智能筛选 · 高效分析</div>
        </div>
        
        <!-- 优化后的导入数据区域 -->
        <div class="input-group">
            <label class="input-label" for="importInput">📊 导入定位复式数据（每行一组，格式：百位-十位-个位）</label>
            <textarea id="importInput" placeholder="示例：2563-1475-2589
0846-2874-2758
9713-0136-0931
0285-2985-2476"></textarea>
            <div class="qq-label">www.shifanglm.com</div>
        </div>
        
        <div class="btn-group">
            <button class="btn" id="parseBtn">解析数据</button>
            <button class="btn" id="clearBtn">清空数据</button>
            <button class="btn" id="selectAllBtn">全选组</button>
            <button class="btn" id="deselectAllBtn">取消全选</button>
            <button class="btn full-width" id="enableGenerateBtn">启用生成功能</button>
        </div>
        
        <div class="groups-container" id="groupsContainer">
            <div class="group-card">
                <div class="group-header">
                    <div class="group-id">无数据</div>
                    <div class="group-status"></div>
                </div>
                <div class="group-data">请点击"解析数据"加载组</div>
            </div>
        </div>
        
        <div class="settings-section">
            <div class="setting-row">
                <span class="setting-label">容错范围（错误组数）：</span>
                <input type="number" id="toleranceMin" class="tolerance-input" value="0" min="0">
                <span class="setting-label">-</span>
                <input type="number" id="toleranceMax" class="tolerance-input" value="0" min="0">
            </div>
            <p class="tolerance-desc">👺</p>
        </div>
        
        <button class="btn full-width" id="calcBtn" disabled>生成大底号码</button>
        
        <div class="result-section" id="resultSection">
            <div class="result-title">📊 大底生成结果</div>
            <div class="result-tabs">
                <button class="tab-btn active" data-tab="summary">统计汇总</button>
                <button class="tab-btn" data-tab="numbers">大底号码</button>
                <button class="tab-btn" data-tab="config">配置清单</button>
            </div>
            <div class="tab-content active" id="summaryContent"></div>
            <div class="tab-content" id="numbersContent"></div>
            <div class="tab-content" id="configContent"></div>
            
            <div class="verify-section">
                <input type="text" id="lotteryInput" placeholder="请输入3位开奖号" maxlength="3">
                <button id="verifyBtn">验证中奖</button>
            </div>
            <div class="verify-result" id="verifyResult"></div>
            
            <button class="btn full-width" id="copyBtn">一键复制当前标签内容</button>
        </div>
        
        <div class="footer">
            温馨提示：本工具仅用于数据分析，不构成购买建议。
        </div>
    </div>
    <div class="toast" id="toast">操作成功！</div>
    <script>
        let groupsData = [];
        let selectedGroupIds = new Set();
        let generateEnabled = false;
        let currentVoiceText = '';
        let speechSynthesis = window.speechSynthesis || null;
        let finalNumbers = [];
        
        function initVoiceTip() {
            if (!speechSynthesis) {
                showToast('当前浏览器不支持语音播报，将显示文字提示');
                const voiceBtn = document.getElementById('voiceBtn');
                voiceBtn.innerHTML = '📝';
                voiceBtn.title = '显示文字提示';
            }
        }
        
        function numberToChineseOrdinal(num) {
            const chars = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
            if (num <= 10) return chars[num] + '组';
            if (num < 20) return '十' + chars[num % 10] + '组';
            const ten = Math.floor(num / 10);
            const one = num % 10;
            return chars[ten] + '十' + (one > 0 ? chars[one] : '') + '组';
        }
        
        function playTipSound(type = 'success') {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                if (type === 'success') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
                    oscillator.frequency.setValueAtTime(1318.51, audioContext.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.8);
                } else {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
                    oscillator.frequency.setValueAtTime(392, audioContext.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.8);
                }
            } catch (e) {
                console.log('音效播放失败，仅显示文字提示');
            }
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 2000);
        }
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('复制成功！');
                playTipSound('success');
            } catch (err) {
                showToast('复制失败，请手动复制！');
                playTipSound('error');
            } finally {
                document.body.removeChild(textarea);
            }
        }
        
        function generateTabContents(selectedCount, validCount, minError, maxError, minCorrect, maxCorrect, validGroups, finalNumbers) {
            const summaryContent = document.getElementById('summaryContent');
            summaryContent.textContent = `📊 大底生成统计\n🎯 选中组数：${selectedCount} 组（未选中组已忽略）\n✅ 有效参与组数：${validCount} 组（需至少选择一个位置）\n⚠️  容错设置：允许错误组数 ${minError}-${maxError} 组\n✅ 正确组数范围：${minCorrect}-${maxCorrect} 组\n📈 大底号码总数：${finalNumbers.length} 注\n💰 预计金额：${finalNumbers.length * 2} 元（按每注2元计算）\n\n🎯 判定规则：选中位置需全部正确才算该组命中`;
            
            const numbersContent = document.getElementById('numbersContent');
            let numbersText = `🎰 3D大底号码（共${finalNumbers.length}注）\n\n`;
            finalNumbers.sort();
            finalNumbers.forEach((num, index) => {
                numbersText += num + ((index + 1) % 10 === 0 ? '\n' : ' ');
            });
            numbersContent.textContent = numbersText;
            
            const configContent = document.getElementById('configContent');
            let configText = `📋 配置清单\n📅 生成时间：${new Date().toLocaleString()}\n🎯 选中组数：${selectedCount} 组（未选中组已忽略）\n✅ 有效参与组数：${validCount} 组（需至少选择一个位置）\n⚠️  容错设置：允许错误组数 ${minError}-${maxError} 组\n✅ 正确组数范围：${minCorrect}-${maxCorrect} 组\n\n📝 有效参与组详细配置：\n`;
            validGroups.forEach(group => {
                const selectedPos = Array.from(group.selectedPositions).join('、');
                const unselectedPos = ['百位','十位','个位'].filter(p => !group.selectedPositions.has(p)).join('、') || '无';
                configText += `\n=== ${group.chineseId} ===\n原始数据：${group.line}\n选中位置：${selectedPos} ✅（需全部正确才命中）\n未选位置：${unselectedPos} ⚠️（忽略不计算）\n百位数字：${group.hundreds}\n十位数字：${group.tens}\n个位数字：${group.units}\n`;
            });
            configText += `\n⚠️ 十方料码 www.shifanglm.com  `;
            configContent.textContent = configText;
            
            currentVoiceText = summaryContent.textContent;
        }
        
        function renderGroupsContainer(groups) {
            const groupsContainer = document.getElementById('groupsContainer');
            if (groups.length === 0) {
                groupsContainer.innerHTML = `
                    <div class="group-card">
                        <div class="group-header" style="position: relative;">
                            <div class="group-id">无数据</div>
                            <div class="group-status"></div>
                        </div>
                        <div class="group-data">无有效数据</div>
                    </div>
                `;
                return;
            }
            let html = '';
            groups.forEach(group => {
                html += `
                    <div class="group-card ${group.isSelected ? 'selected' : ''}" data-id="${group.id}">
                        <div class="group-header" style="position: relative;">
                            <div class="group-id">${group.chineseId}</div>
                            <div class="group-status"></div>
                        </div>
                        <div class="group-data">${group.line}</div>
                        <div class="position-buttons">
                            <div class="pos-btn ${group.selectedPositions.has('百位') ? 'active' : ''}" data-pos="百位" data-group-id="${group.id}">百位</div>
                            <div class="pos-btn ${group.selectedPositions.has('十位') ? 'active' : ''}" data-pos="十位" data-group-id="${group.id}">十位</div>
                            <div class="pos-btn ${group.selectedPositions.has('个位') ? 'active' : ''}" data-pos="个位" data-group-id="${group.id}">个位</div>
                        </div>
                    </div>
                `;
            });
            groupsContainer.innerHTML = html;
            bindGroupEvents();
        }
        
        function bindGroupEvents() {
            document.querySelectorAll('.pos-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const groupId = parseInt(btn.dataset.groupId);
                    const position = btn.dataset.pos;
                    const group = groupsData.find(g => g.id === groupId);
                    if (group.isSelected) {
                        group.selectedPositions.has(position) ? group.selectedPositions.delete(position) : group.selectedPositions.add(position);
                        renderGroupsContainer(groupsData);
                    } else {
                        showToast('请先选中该组再设置位置！');
                        playTipSound('error');
                    }
                });
            });
            
            document.querySelectorAll('.group-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('pos-btn')) {
                        const groupId = parseInt(card.dataset.id);
                        const group = groupsData.find(g => g.id === groupId);
                        group.isSelected = !group.isSelected;
                        if (group.isSelected) {
                            selectedGroupIds.add(groupId);
                        } else {
                            selectedGroupIds.delete(groupId);
                        }
                        renderGroupsContainer(groupsData);
                    }
                });
            });
        }
        
        window.addEventListener('load', () => {
            document.querySelector('.container').style.minHeight = `${window.innerHeight - 30}px`;
            initVoiceTip();
            
            const importInput = document.getElementById('importInput');
            const parseBtn = document.getElementById('parseBtn');
            const clearBtn = document.getElementById('clearBtn');
            const selectAllBtn = document.getElementById('selectAllBtn');
            const deselectAllBtn = document.getElementById('deselectAllBtn');
            const enableGenerateBtn = document.getElementById('enableGenerateBtn');
            const calcBtn = document.getElementById('calcBtn');
            const toleranceMin = document.getElementById('toleranceMin');
            const toleranceMax = document.getElementById('toleranceMax');
            const resultSection = document.getElementById('resultSection');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const copyBtn = document.getElementById('copyBtn');
            const voiceBtn = document.getElementById('voiceBtn');
            const lotteryInput = document.getElementById('lotteryInput');
            const verifyBtn = document.getElementById('verifyBtn');
            const verifyResult = document.getElementById('verifyResult');
            
            // 解析数据
            parseBtn.addEventListener('click', () => {
                const inputText = importInput.value.trim();
                if (!inputText) {
                    showToast('请输入定位复式数据！');
                    playTipSound('error');
                    return;
                }
                const lines = inputText.split('\n').filter(line => line.trim() !== '');
                const validGroups = [];
                lines.forEach((line, index) => {
                    const parts = line.trim().split('-');
                    if (parts.length === 3) {
                        validGroups.push({
                            id: index + 1,
                            chineseId: numberToChineseOrdinal(index + 1),
                            line: line.trim(),
                            hundreds: parts[0],
                            tens: parts[1],
                            units: parts[2],
                            selectedPositions: new Set(),
                            isSelected: false
                        });
                    } else {
                        showToast(`第${index + 1}行格式错误，已忽略！`);
                        playTipSound('error');
                    }
                });
                if (validGroups.length === 0) {
                    renderGroupsContainer([]);
                    showToast('无有效数据！');
                    playTipSound('error');
                    return;
                }
                groupsData = validGroups;
                selectedGroupIds.clear();
                renderGroupsContainer(validGroups);
                showToast(`成功解析 ${validGroups.length} 组数据！`);
                playTipSound('success');
            });
            
            // 全选/取消全选
            selectAllBtn.addEventListener('click', () => {
                if (groupsData.length === 0) {
                    showToast('请先解析数据！');
                    playTipSound('error');
                    return;
                }
                groupsData.forEach(group => {
                    group.isSelected = true;
                    selectedGroupIds.add(group.id);
                });
                renderGroupsContainer(groupsData);
                showToast('已全选所有组！');
                playTipSound('success');
            });
            
            deselectAllBtn.addEventListener('click', () => {
                groupsData.forEach(group => group.isSelected = false);
                selectedGroupIds.clear();
                renderGroupsContainer(groupsData);
                showToast('已取消全选！');
                playTipSound('success');
            });
            
            // 启用生成
            enableGenerateBtn.addEventListener('click', () => {
                if (groupsData.length === 0) {
                    showToast('请先解析数据再启用生成功能！');
                    playTipSound('error');
                    return;
                }
                generateEnabled = true;
                calcBtn.disabled = false;
                enableGenerateBtn.disabled = true;
                enableGenerateBtn.textContent = '生成功能已启用';
                showToast('生成功能已启用，可以生成大底号码！');
                playTipSound('success');
            });
            
            // 标签切换
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`${tab}Content`).classList.add('active');
                    currentVoiceText = document.getElementById(`${tab}Content`).textContent;
                });
            });
            
            // 复制
            copyBtn.addEventListener('click', () => {
                const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
                const text = document.getElementById(`${activeTab}Content`).textContent;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('复制成功！');
                        playTipSound('success');
                    }).catch(err => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            });
            
            // 语音播报
            voiceBtn.addEventListener('click', () => {
                if (resultSection.style.display !== 'block') {
                    showToast('请先生成结果再进行语音播报！');
                    playTipSound('error');
                    return;
                }
                
                const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
                let text = document.getElementById(`${activeTab}Content`).textContent;
                text = text.replace(/[📊🎰📝⚠️💰]/g, '').replace(/\n+/g, '。').replace(/\s+/g, ' ');
                currentVoiceText = text;
                
                if (!speechSynthesis) {
                    alert('当前结果文字提示：\n' + text);
                    showToast('文字提示已显示');
                    return;
                }
                
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                    voiceBtn.classList.remove('playing');
                    showToast('语音播报已停止');
                    return;
                }
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.volume = 1;
                utterance.pitch = 1;
                utterance.onstart = () => {
                    voiceBtn.classList.add('playing');
                    showToast('语音播报中...');
                };
                utterance.onend = () => {
                    voiceBtn.classList.remove('playing');
                    showToast('语音播报完成！');
                    playTipSound('success');
                };
                utterance.onerror = () => {
                    voiceBtn.classList.remove('playing');
                    showToast('语音播报失败，显示文字提示');
                    playTipSound('error');
                    alert('当前结果文字提示：\n' + text);
                };
                speechSynthesis.speak(utterance);
            });
            
            // 核心逻辑：生成大底（按选中位置全对判定组命中）
            calcBtn.addEventListener('click', () => {
                if (!generateEnabled) {
                    showToast('请先启用生成功能！');
                    playTipSound('error');
                    return;
                }
                const selectedCount = selectedGroupIds.size;
                if (selectedCount === 0) {
                    showToast('请至少选择一组数据！');
                    playTipSound('error');
                    return;
                }
                
                // 容错值处理
                const minError = parseInt(toleranceMin.value) || 0;
                const maxError = parseInt(toleranceMax.value) || 0;
                if (minError < 0 || maxError < 0 || minError > maxError) {
                    showToast('容错范围输入错误！');
                    playTipSound('error');
                    return;
                }
                
                // 筛选有效参与组（选中+至少选一个位置）
                const validGroups = groupsData.filter(g => g.isSelected && g.selectedPositions.size > 0);
                const validCount = validGroups.length;
                
                if (validCount === 0) {
                    showToast('无有效参与组（选中组需至少选择一个位置）！');
                    playTipSound('error');
                    return;
                }
                
                if (maxError > validCount) {
                    showToast(`最大错误组数不能超过有效参与组数（${validCount}组）`);
                    playTipSound('error');
                    return;
                }
                
                // 正确组数范围（总有效组 - 错误组数）
                const minCorrect = validCount - maxError;
                const maxCorrect = validCount - minError;
                
                // 生成所有可能的3位数（000-999）
                let allNumbers = new Set();
                for (let h = 0; h < 10; h++) {
                    for (let t = 0; t < 10; t++) {
                        for (let u = 0; u < 10; u++) {
                            allNumbers.add(`${h}${t}${u}`);
                        }
                    }
                }
                
                // 核心判定逻辑：选中位置需全部正确才算组命中
                finalNumbers = [];
                allNumbers.forEach(num => {
                    const h = num[0], t = num[1], u = num[2];
                    let hitCount = 0; // 命中的有效组数量
                    
                    validGroups.forEach(group => {
                        const { hundreds, tens, units, selectedPositions } = group;
                        let isHit = true; // 默认为命中，只要有一个选中位置错误则变为未命中
                        
                        // 校验所有选中的位置，需全部正确
                        if (selectedPositions.has('百位') && !hundreds.includes(h)) isHit = false;
                        if (selectedPositions.has('十位') && !tens.includes(t)) isHit = false;
                        if (selectedPositions.has('个位') && !units.includes(u)) isHit = false;
                        
                        if (isHit) hitCount++;
                    });
                    
                    // 计算错误组数，筛选符合条件的号码
                    const errorCount = validCount - hitCount;
                    if (errorCount >= minError && errorCount <= maxError) {
                        finalNumbers.push(num);
                    }
                });
                
                // 生成结果内容
                generateTabContents(selectedCount, validCount, minError, maxError, minCorrect, maxCorrect, validGroups, finalNumbers);
                resultSection.style.display = 'block';
                resultSection.scrollIntoView({ behavior: 'smooth' });
                showToast(`大底生成成功！共${finalNumbers.length}注`);
                playTipSound('success');
            });
            
            // 开奖验证
            verifyBtn.addEventListener('click', () => {
                const lotteryNum = lotteryInput.value.trim();
                if (!/^\d{3}$/.test(lotteryNum)) {
                    verifyResult.textContent = '❌ 请输入有效的3位数字！';
                    verifyResult.style.color = '#ff4444';
                    playTipSound('error');
                    return;
                }
                if (finalNumbers.length === 0) {
                    verifyResult.textContent = '❌ 请先生成大底号码！';
                    verifyResult.style.color = '#ff4444';
                    playTipSound('error');
                    return;
                }
                if (finalNumbers.includes(lotteryNum)) {
                    verifyResult.textContent = '🎉 恭喜你中奖多多！';
                    verifyResult.style.color = '#ffd700';
                    playTipSound('success');
                    if (speechSynthesis && !speechSynthesis.speaking) {
                        const utterance = new SpeechSynthesisUtterance('恭喜你中奖多多！');
                        utterance.lang = 'zh-CN';
                        speechSynthesis.speak(utterance);
                    }
                } else {
                    verifyResult.textContent = '很遗憾没有中奖！';
                    verifyResult.style.color = '#ff4444';
                    playTipSound('error');
                }
            });
            
            // 回车验证
            lotteryInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    verifyBtn.click();
                }
            });
            
            // 清空
            clearBtn.addEventListener('click', () => {
                importInput.value = '';
                groupsData = [];
                selectedGroupIds.clear();
                generateEnabled = false;
                finalNumbers = [];
                calcBtn.disabled = true;
                enableGenerateBtn.disabled = false;
                enableGenerateBtn.textContent = '启用生成功能';
                resultSection.style.display = 'none';
                verifyResult.textContent = '';
                lotteryInput.value = '';
                renderGroupsContainer([]);
                if (speechSynthesis && speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                    voiceBtn.classList.remove('playing');
                }
                showToast('数据已清空！');
                playTipSound('success');
            });
            
            // 初始解析示例数据
            if (importInput.value.trim()) {
                parseBtn.click();
            }
        });
        
        window.addEventListener('resize', () => {
            document.querySelector('.container').style.minHeight = `${window.innerHeight - 30}px`;
        });
    </script>
</body>
</html>
