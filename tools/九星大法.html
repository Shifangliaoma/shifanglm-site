<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十方料码缩水工具网 - 福彩3D专业分析</title>
    <style>
        :root {
            --primary: #ff3366;
            --primary-dark: #e62e5c;
            --secondary: #ff9900;
            --secondary-dark: #e68a00;
            --accent: #ffcc00;
            --accent-light: #ffdd44;
            --dark: #0a0a1a;
            --darker: #050511;
            --light: #1a1a2e;
            --lighter: #2a2a3e;
            --text: #ffffff;
            --text-light: #ccccdd;
            --success: #00ff99;
            --success-dark: #00cc7a;
            --warning: #ffcc00;
            --danger: #ff3366;
            --border: #33334d;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(255, 51, 102, 0.25);
            --glow: 0 0 20px rgba(255, 51, 102, 0.4);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, var(--darker), var(--dark));
            color: var(--text);
            font-family: 'PingFang SC', 'Microsoft YaHei', 'SF Pro Display', -apple-system, sans-serif;
            font-size: 13px;
            line-height: 1.2;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 趣味醒目标题 */
        .brand-header {
            background: linear-gradient(135deg, #ff3366, #ff9900, #ffcc00);
            padding: 12px 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(255, 51, 102, 0.3);
            border-bottom: 3px solid var(--accent);
        }
        
        .brand-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .brand-logo {
            font-size: 20px;
            font-weight: 900;
            color: white;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            position: relative;
            display: inline-block;
        }
        
        .brand-logo::after {
            content: '✨';
            position: absolute;
            right: -25px;
            top: -5px;
            animation: sparkle 2s infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .brand-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        /* 主容器 */
        .main-container {
            max-width: 100%;
            padding: 0;
        }
        
        /* 功能切换 */
        .function-tabs {
            display: flex;
            background: var(--light);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 90;
            padding: 0 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        .tab {
            flex: 1;
            padding: 10px 6px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-light);
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            margin: 0 2px;
            cursor: pointer;
        }
        
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(255, 51, 102, 0.1);
        }
        
        .tab:hover {
            background: rgba(255, 51, 102, 0.05);
        }
        
        /* 功能面板 */
        .panel {
            display: none;
            padding: 0;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .panel.active {
            display: block;
        }
        
        /* 模块 */
        .module {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(10px);
        }
        
        .module-title {
            font-size: 14px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .title-icon {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
            color: white;
            box-shadow: 0 2px 4px rgba(255, 51, 102, 0.3);
        }
        
        .module-desc {
            font-size: 11px;
            color: var(--text-light);
            margin-bottom: 12px;
            line-height: 1.3;
        }
        
        /* 胆码选择 */
        .danma-section {
            margin-bottom: 15px;
        }
        
        .section-label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
        }
        
        .danma-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        
        .danma-btn {
            padding: 14px 0;
            background: var(--lighter);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-weight: 900;
            font-size: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        
        .danma-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 51, 102, 0.2);
        }
        
        .danma-btn.selected {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow);
            transform: scale(1.05);
        }
        
        .danma-btn.selected::after {
            content: '✓';
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .selected-danma-display {
            padding: 10px;
            background: var(--darker);
            border-radius: var(--radius);
            border: 2px solid var(--border);
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        
        .selected-danma-item {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(255, 51, 102, 0.3);
        }
        
        .remove-danma {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .remove-danma:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
        
        .no-selection {
            color: var(--text-light);
            font-style: italic;
            font-size: 12px;
        }
        
        /* 范围设置 - 使用选择器 */
        .range-section {
            margin-bottom: 15px;
        }
        
        .range-selectors {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .range-select {
            flex: 1;
            position: relative;
        }
        
        .range-select select {
            width: 100%;
            padding: 12px;
            background: var(--darker);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 15px;
            font-weight: 900;
            text-align: center;
            appearance: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .range-select select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 51, 102, 0.2);
        }
        
        .range-select::after {
            content: "▼";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 10px;
            pointer-events: none;
        }
        
        .range-separator {
            color: var(--primary);
            font-size: 16px;
            font-weight: 900;
            min-width: 20px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        /* 模式切换 */
        .mode-toggle {
            display: flex;
            background: var(--darker);
            border-radius: var(--radius);
            border: 2px solid var(--border);
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .mode-option {
            flex: 1;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            font-weight: 900;
            color: var(--text-light);
            transition: all 0.2s;
            font-size: 12px;
        }
        
        .mode-option.selected {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        
        /* 按钮组 */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        
        .action-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 8px rgba(255, 51, 102, 0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 51, 102, 0.4);
        }
        
        .btn-secondary {
            background: var(--lighter);
            color: var(--text);
            border: 2px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--light);
            border-color: var(--primary);
        }
        
        /* 开奖号输入 */
        .lottery-input {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .lottery-input input {
            flex: 1;
            padding: 14px;
            background: var(--darker);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            text-align: center;
            transition: all 0.2s;
            font-family: monospace;
        }
        
        .lottery-input input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 51, 102, 0.2);
        }
        
        /* 结果区 */
        .results-section {
            padding: 0;
            background: var(--darker);
            border-top: 2px solid var(--border);
        }
        
        .results-header {
            padding: 12px;
            background: var(--light);
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .results-title {
            font-size: 15px;
            font-weight: 900;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .results-title::before {
            content: '📊';
            font-size: 18px;
        }
        
        .results-stats {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 900;
            color: var(--success);
            font-family: monospace;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .stat-label {
            font-size: 10px;
            color: var(--text-light);
            margin-top: 2px;
        }
        
        /* 提取控制区 */
        .extract-bar {
            padding: 10px;
            background: var(--light);
            border-bottom: 2px solid var(--border);
            display: none;
        }
        
        .extract-bar.show {
            display: block;
        }
        
        .extract-controls {
            display: flex;
            gap: 6px;
        }
        
        .extract-btn {
            flex: 1;
            padding: 12px 6px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(255, 51, 102, 0.3);
        }
        
        .extract-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 51, 102, 0.4);
        }
        
        .extract-btn.copy {
            background: linear-gradient(135deg, var(--success), var(--success-dark));
        }
        
        .extract-btn.clear {
            background: linear-gradient(135deg, var(--danger), #e62e5c);
        }
        
        /* 号码显示区 - 改为一行显示 */
        .numbers-display {
            padding: 15px;
            background: var(--darker);
            min-height: 60px;
            max-height: 200px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            font-family: monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.6;
        }
        
        .numbers-display.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 14px;
            font-style: italic;
            padding: 20px;
            font-family: inherit;
        }
        
        /* 号码以空格间隔显示 */
        .numbers-content {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        
        .number-item {
            background: rgba(255, 51, 102, 0.15);
            border: 2px solid rgba(255, 51, 102, 0.4);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 18px;
            font-weight: 900;
            color: var(--primary);
            text-align: center;
            min-width: 50px;
            transition: all 0.2s;
        }
        
        .number-item:hover {
            background: rgba(255, 51, 102, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 51, 102, 0.2);
        }
        
        /* 身份标识显示区 */
        .identity-display {
            padding: 15px;
            background: var(--darker);
            min-height: 60px;
            max-height: 150px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-bottom: 2px solid var(--border);
        }
        
        .identity-display.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 14px;
            font-style: italic;
            padding: 20px;
        }
        
        .identity-item {
            padding: 12px;
            background: rgba(0, 255, 153, 0.15);
            border: 2px solid rgba(0, 255, 153, 0.4);
            border-radius: var(--radius);
            font-family: monospace;
            font-size: 18px;
            font-weight: 900;
            color: var(--success);
            text-align: center;
            margin-bottom: 8px;
            word-break: break-all;
            box-shadow: 0 2px 4px rgba(0, 255, 153, 0.2);
        }
        
        .identity-item:last-child {
            margin-bottom: 0;
        }
        
        /* 底部品牌信息 */
        .brand-footer {
            padding: 12px;
            text-align: center;
            background: var(--light);
            border-top: 2px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        
        .brand-footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
        }
        
        .brand-name {
            font-size: 15px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 4px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .brand-name::after {
            content: '🎯';
            margin-left: 6px;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        .brand-info {
            font-size: 10px;
            color: var(--text-light);
            line-height: 1.3;
        }
        
        /* 复制提示 */
        .copy-notice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, var(--success), var(--success-dark));
            color: white;
            padding: 15px 25px;
            border-radius: var(--radius);
            font-weight: 900;
            font-size: 14px;
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 10px;
            animation: popInOut 1.5s ease;
            box-shadow: 0 8px 20px rgba(0, 255, 153, 0.3);
        }
        
        @keyframes popInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }
        
        /* 响应式设计 */
        @media (max-width: 360px) {
            .brand-logo {
                font-size: 18px;
            }
            
            .danma-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .lottery-input input {
                font-size: 18px;
                padding: 12px;
            }
            
            .module {
                padding: 10px;
            }
            
            .number-item {
                font-size: 16px;
                padding: 6px 10px;
                min-width: 45px;
            }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--darker);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }
        
        /* 无结果状态 */
        .no-results {
            padding: 20px;
            text-align: center;
        }
        
        .no-results .icon {
            font-size: 30px;
            margin-bottom: 10px;
            opacity: 0.5;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        
        .no-results .message {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        
        .no-results .hint {
            font-size: 12px;
            color: var(--text-light);
        }
        
        /* 错误提示 */
        .error-message {
            background: rgba(255, 51, 102, 0.15);
            color: var(--danger);
            padding: 10px;
            border-radius: var(--radius);
            border-left: 4px solid var(--danger);
            margin: 8px 0;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .error-message::before {
            content: '⚠️';
            font-size: 14px;
        }
        
        /* 成功提示 */
        .success-message {
            background: rgba(0, 255, 153, 0.15);
            color: var(--success);
            padding: 10px;
            border-radius: var(--radius);
            border-left: 4px solid var(--success);
            margin: 8px 0;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .success-message::before {
            content: '✅';
            font-size: 14px;
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 51, 102, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 趣味醒目标题 -->
    <div class="brand-header">
        <div class="brand-logo">十方料码缩水工具网</div>
        <div class="brand-subtitle">专业福彩3D数据分析 | 智能筛选 精准查询</div>
    </div>
    
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 功能切换 -->
        <div class="function-tabs">
            <div class="tab active" data-tab="shrink">🎯 缩水筛选</div>
            <div class="tab" data-tab="query">🔍 号码查询</div>
        </div>
        
        <!-- 缩水筛选面板 -->
        <div class="panel active" id="shrink-panel">
            <div class="module">
                <div class="module-title">
                    <div class="title-icon">①</div>
                    <span>胆码缩水筛选</span>
                </div>
                <div class="module-desc">
                    选择胆码数字，设置出现次数范围，智能筛选福彩3D号码
                </div>
                
                <!-- 胆码选择 -->
                <div class="danma-section">
                    <div class="section-label">选择胆码（可多选）</div>

        const selectedDanmaDisplay = document.getElementById('selected-danma-display');
        const minCountSelect = document.getElementById('min-count-select');
        const maxCountSelect = document.getElementById('max-count-select');
        const modeWithRepeat = document.getElementById('mode-with-repeat');
        const modeWithoutRepeat = document.getElementById('mode-without-repeat');
        const clearAllBtn = document.getElementById('clear-all');
        const startShrinkBtn = document.getElementById('start-shrink');
        const lotteryNumberInput = document.getElementById('lottery-number');
        const querySingleBtn = document.getElementById('query-single');
        const resultCountEl = document.getElementById('result-count');
        const queryTimeEl = document.getElementById('query-time');
        const extractBar = document.getElementById('extract-bar');
        const extractBtn = document.getElementById('extract-btn');
        const copyBtn = document.getElementById('copy-btn');
        const clearBtn = document.getElementById('clear-btn');
        const numbersDisplay = document.getElementById('numbers-display');
        const identityDisplay = document.getElementById('identity-display');
        const copyNotice = document.getElementById('copy-notice');
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel');

        // 当前状态
        let currentSettings = {
            selectedDanma: [],
            mode: 'with-repeat',
            minCount: 1,
            maxCount: 3
        };
        
        let currentResults = [];
        let extractedNumbers = [];
        let currentMode = 'shrink';

        // 初始化
        function init() {
            // 标签页切换
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-tab');
                    currentMode = tabId;
                    
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    panels.forEach(panel => panel.classList.remove('active'));
                    document.getElementById(`${tabId}-panel`).classList.add('active');
                    
                    clearResults();
                });
            });

            // 胆码选择
            danmaGrid.addEventListener('click', function(e) {
                if (e.target.classList.contains('danma-btn')) {
                    const digit = e.target.getAttribute('data-digit');
                    toggleDanma(digit);
                }
            });

            // 范围选择器事件
            minCountSelect.addEventListener('change', function() {
                currentSettings.minCount = parseInt(this.value);
                validateRange();
            });
            
            maxCountSelect.addEventListener('change', function() {
                currentSettings.maxCount = parseInt(this.value);
                validateRange();
            });

            // 模式切换
            modeWithRepeat.addEventListener('click', () => setMode('with-repeat'));
            modeWithoutRepeat.addEventListener('click', () => setMode('without-repeat'));

            // 按钮事件
            clearAllBtn.addEventListener('click', clearAll);
            startShrinkBtn.addEventListener('click', startShrink);
            querySingleBtn.addEventListener('click', querySingle);
            extractBtn.addEventListener('click', extractNumbers);
            copyBtn.addEventListener('click', copyNumbers);
            clearBtn.addEventListener('click', clearResults);

            // 输入框回车
            lotteryNumberInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') querySingle();
            });
            
            // 限制号码输入只能数字
            lotteryNumberInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '').slice(0, 3);
            });

            // 设置默认值
            setMode('with-repeat');
            updateSelectedDanmaDisplay();
            
            // 默认选择示例胆码
            setTimeout(() => {
                toggleDanma('3');
                toggleDanma('7');
            }, 100);
        }

        // 切换胆码选择
        function toggleDanma(digit) {
            const index = currentSettings.selectedDanma.indexOf(digit);
            
            if (index === -1) {
                currentSettings.selectedDanma.push(digit);
            } else {
                currentSettings.selectedDanma.splice(index, 1);
            }
            
            updateSelectedDanmaDisplay();
            
            // 更新按钮选中状态
            danmaGrid.querySelectorAll('.danma-btn').forEach(btn => {
                if (btn.getAttribute('data-digit') === digit) {
                    if (index === -1) {
                        btn.classList.add('selected');
                    } else {
                        btn.classList.remove('selected');
                    }
                }
            });
        }

        // 更新已选胆码显示
        function updateSelectedDanmaDisplay() {
            const display = selectedDanmaDisplay;
            
            if (currentSettings.selectedDanma.length === 0) {
                display.innerHTML = '<div class="no-selection">点击上方数字选择胆码</div>';
                return;
            }
            
            const sortedDanma = [...currentSettings.selectedDanma].sort((a, b) => a - b);
            
            let html = '';
            sortedDanma.forEach(digit => {
                html += `
                    <div class="selected-danma-item">
                        ${digit}
                        <button class="remove-danma" data-digit="${digit}">×</button>
                    </div>
                `;
            });
            
            display.innerHTML = html;
            
            display.querySelectorAll('.remove-danma').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const digit = this.getAttribute('data-digit');
                    toggleDanma(digit);
                });
            });
        }

        // 验证范围输入
        function validateRange() {
            let min = currentSettings.minCount;
            let max = currentSettings.maxCount;
            
            if (min > max) {
                max = min;
                currentSettings.maxCount = max;
                maxCountSelect.value = max;
                showMessage(`已自动调整最大值为 ${max}`);
            }
        }

        // 设置模式
        function setMode(mode) {
            currentSettings.mode = mode;
            
            if (mode === 'with-repeat') {
                modeWithRepeat.classList.add('selected');
                modeWithoutRepeat.classList.remove('selected');
            } else {
                modeWithRepeat.classList.remove('selected');
                modeWithoutRepeat.classList.add('selected');
            }
        }

        // 清空所有
        function clearAll() {
            currentSettings.selectedDanma = [];
            updateSelectedDanmaDisplay();
            
            danmaGrid.querySelectorAll('.danma-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            minCountSelect.value = 1;
            maxCountSelect.value = 3;
            currentSettings.minCount = 1;
            currentSettings.maxCount = 3;
            
            clearResults();
            
            showSuccess('设置已清空');
        }

        // 开始缩水
        function startShrink() {
            if (currentSettings.selectedDanma.length === 0) {
                showError('请选择至少一个胆码');
                return;
            }
            
            validateRange();
            
            // 显示加载状态
            const originalText = startShrinkBtn.innerHTML;
            startShrinkBtn.innerHTML = '<span class="loading"></span> 计算中...';
            startShrinkBtn.disabled = true;
            
            setTimeout(() => {
                const startTime = performance.now();
                currentResults = performShrink();
                const endTime = performance.now();
                
                // 恢复按钮状态
                startShrinkBtn.innerHTML = originalText;
                startShrinkBtn.disabled = false;
                
                // 显示结果
                displayResults(currentResults, endTime - startTime);
            }, 50);
        }

        // 执行缩水逻辑
        function performShrink() {
            const { selectedDanma, mode, minCount, maxCount } = currentSettings;
            const results = [];
            
            const danmaDigits = selectedDanma.map(d => parseInt(d));
            
            for (let i = 0; i < lotteryData.length; i++) {
                const identityCode = lotteryData[i];
                const lotteryNumber = identityCode.substring(0, 3);
                
                let matchCount = 0;
                
                if (mode === 'with-repeat') {
                    for (const digit of identityCode) {
                        if (danmaDigits.includes(parseInt(digit))) {
                            matchCount++;
                        }
                    }
                } else {
                    const uniqueDigits = [...new Set(identityCode.split('').map(d => parseInt(d)))];
                    for (const danmaDigit of danmaDigits) {
                        if (uniqueDigits.includes(danmaDigit)) {
                            matchCount++;
                        }
                    }
                }
                
                if (matchCount >= minCount && matchCount <= maxCount) {
                    results.push({
                        index: i,
                        number: lotteryNumber,
                        identity: identityCode,
                        count: matchCount
                    });
                }
            }
            
            return results;
        }

        // 单号查询
        function querySingle() {
            const number = lotteryNumberInput.value.trim();
            
            if (!number || !/^\d{3}$/.test(number)) {
                showError('请输入有效的3位福彩3D号码');
                return;
            }
            
            // 显示加载状态
            const originalText = querySingleBtn.innerHTML;
            querySingleBtn.innerHTML = '<span class="loading"></span> 查询中...';
            querySingleBtn.disabled = true;
            
            setTimeout(() => {
                const startTime = performance.now();
                const result = performQuery(number);
                const endTime = performance.now();
                
                // 恢复按钮状态
                querySingleBtn.innerHTML = originalText;
                querySingleBtn.disabled = false;
                
                // 显示结果
                displayQueryResult(result, endTime - startTime);
            }, 50);
        }

        // 执行号码查询
        function performQuery(number) {
            for (let i = 0; i < lotteryData.length; i++) {
                const identityCode = lotteryData[i];
                const lotteryNumber = identityCode.substring(0, 3);
                
                if (lotteryNumber === number) {
                    return {
                        index: i,
                        number: lotteryNumber,
                        identity: identityCode
                    };
                }
            }
            return null;
        }

        // 显示查询结果
        function displayQueryResult(result, queryTime = 0) {
            resultCountEl.textContent = result ? 1 : 0;
            queryTimeEl.textContent = `${Math.round(queryTime)}ms`;
            
            extractBar.classList.remove('show');
            
            if (!result) {
                identityDisplay.innerHTML = `
                    <div class="no-results">
                        <div class="icon">🔍</div>
                        <div class="message">未找到对应的身份标识</div>
                    </div>
                `;
                identityDisplay.classList.add('empty');
                numbersDisplay.classList.add('empty');
                numbersDisplay.innerHTML = '缩水筛选结果将显示在这里';
                return;
            }
            
            identityDisplay.innerHTML = `
                <div class="identity-item">${result.identity}</div>
            `;
            identityDisplay.classList.remove('empty');
            
            numbersDisplay.classList.add('empty');
            numbersDisplay.innerHTML = '缩水筛选结果将显示在这里';
            
            setTimeout(() => {
                document.querySelector('.results-section').scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }, 100);
        }

        // 显示缩水结果 - 修改为空格间隔显示
        function displayResults(results, queryTime = 0) {
            resultCountEl.textContent = results.length;
            queryTimeEl.textContent = `${Math.round(queryTime)}ms`;
            
            if (results.length === 0) {
                numbersDisplay.innerHTML = `
                    <div class="no-results">
                        <div class="icon">🔍</div>
                        <div class="message">未找到匹配的号码</div>
                        <div class="hint">请调整筛选条件后重试</div>
                    </div>
                `;
                numbersDisplay.classList.add('empty');
                extractBar.classList.remove('show');
                identityDisplay.classList.add('empty');
                identityDisplay.innerHTML = '跟我一起玩缩水,QQ:921913231';
                return;
            }
            
            identityDisplay.classList.add('empty');
            identityDisplay.innerHTML = '十方料码 QQ:921913231';
            
            extractBar.classList.add('show');
            
            // 显示号码（空格间隔）
            showNumbers(results.map(r => r.number));
            
            setTimeout(() => {
                document.querySelector('.results-section').scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }, 100);
        }

        // 显示号码 - 改为空格间隔
        function showNumbers(numbers) {
            // 去重排序
            const uniqueNumbers = [...new Set(numbers)].sort((a, b) => parseInt(a) - parseInt(b));
            
            numbersDisplay.classList.remove('empty');
            
            if (uniqueNumbers.length === 0) {
                numbersDisplay.innerHTML = '<div class="no-results">没有号码可显示</div>';
                return;
            }
            
            // 创建带空格间隔的号码显示
            let html = '<div class="numbers-content">';
            
            uniqueNumbers.forEach(number => {
                html += `<div class="number-item">${number}</div>`;
            });
            
            html += '</div>';
            numbersDisplay.innerHTML = html;
            
            // 保存提取的号码
            extractedNumbers = uniqueNumbers;
            
            // 显示消息
            showSuccess(`找到 ${currentResults.length} 条记录，去重后 ${uniqueNumbers.length} 个号码`);
        }

        // 提取号码
        function extractNumbers() {
            if (currentResults.length === 0) {
                showError('没有可提取的号码');
                return;
            }
            
            const numbers = currentResults.map(r => r.number);
            showNumbers(numbers);
            showSuccess('已重新提取号码');
        }

        // 复制号码 - 改为空格间隔
        function copyNumbers() {
            if (extractedNumbers.length === 0) {
                showError('没有可复制的号码');
                return;
            }
            
            // 构建文本 - 用空格间隔
            const text = extractedNumbers.join(' ');
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text)
                    .then(() => showCopyNotice())
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        // 兼容性复制
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopyNotice();
                } else {
                    showError('复制失败，请手动复制');
                }
            } catch (err) {
                showError('复制失败，请手动复制');
            }
            
            document.body.removeChild(textarea);
        }

        // 显示复制提示
        function showCopyNotice() {
            copyNotice.style.display = 'flex';
            setTimeout(() => {
                copyNotice.style.display = 'none';
            }, 1500);
        }

        // 清空结果
        function clearResults() {
            currentResults = [];
            extractedNumbers = [];
            resultCountEl.textContent = '0';
            queryTimeEl.textContent = '0ms';
            numbersDisplay.innerHTML = '查询结果将显示在这里';
            numbersDisplay.classList.add('empty');
            identityDisplay.innerHTML = '十方料码 QQ:921913231';
            identityDisplay.classList.add('empty');
            extractBar.classList.remove('show');
            
            if (currentMode === 'query') {
                lotteryNumberInput.value = '';
            }
        }

        // 显示错误
        function showError(message) {
            showMessage(message, 'error');
        }

        // 显示成功
        function showSuccess(message) {
            showMessage(message, 'success');
        }

        // 显示消息
        function showMessage(message, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
            messageDiv.textContent = message;
            
            const resultsSection = document.querySelector('.results-section');
            const extractBar = document.getElementById('extract-bar');
            
            if (extractBar.classList.contains('show')) {
                resultsSection.insertBefore(messageDiv, extractBar);
            } else {
                const resultsHeader = resultsSection.querySelector('.results-header');
                resultsSection.insertBefore(messageDiv, resultsHeader.nextSibling);
            }
            
            setTimeout(() => {
                if (messageDiv.parentNode) {
                    messageDiv.parentNode.removeChild(messageDiv);
                }
            }, 3000);
        }

        // 页面加载完成
        document.addEventListener('DOMContentLoaded', init);
        
        // 防止页面缩放
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        
        let lastTouch = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouch < 300) e.preventDefault();
            lastTouch = now;
        }, false);
    </script>
</body>
</html>
